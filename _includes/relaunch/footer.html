<footer class="mw-footer"><div class="mw-shell"><div class="mw-footer-top"><a href="{{ site.baseurl }}/"><img src="{{ '/assets/images/logo.svg' | asset_url }}" width="150" height="52" alt="{{ copy.common.brand.logo_alt | escape }}" loading="lazy"></a><p>{{ copy.common.footer.text }}</p><a href="mailto:{{ site.email }}">{{ site.email }}</a></div><div class="mw-footer-bottom"><small>{{ copy.common.footer.copyright }}</small><nav>{% for item in copy.common.footer.legal %}<a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>{% endfor %}</nav></div></div></footer>
