<section class="mw-section" id="enquiry"><div class="mw-shell mw-contact-grid"><div><h2>{{ copy.form.title }}</h2><p><a href="mailto:{{ site.email }}">{{ site.email }}</a><br><a href="tel:{{ site.phone }}">{{ site.phone }}</a></p><p>{{ site.author }}<br>{{ site.address }}</p></div>
<form action="{{ site.contact_form_action }}" method="post" class="mw-form">
<p>{{ copy.form.required }}</p>
<label for="enquiry-name">{{ copy.form.name }}</label><input id="enquiry-name" name="name" autocomplete="name" required maxlength="150">
<label for="enquiry-email">{{ copy.form.email }}</label><input id="enquiry-email" name="email" type="email" autocomplete="email" required maxlength="254">
<label for="enquiry-company">{{ copy.form.company }}</label><input id="enquiry-company" name="company" autocomplete="organization" maxlength="200">
<label for="enquiry-message">{{ copy.form.message }}</label><textarea id="enquiry-message" name="message" rows="6" required maxlength="5000"></textarea>
<p>{{ copy.form.privacy }} <a href="{{ site.baseurl }}/privacy.html">{{ copy.ui.legal[1].title }}</a></p>
<button class="mw-button" type="submit">{{ copy.form.send }}</button>
</form></div></section>
