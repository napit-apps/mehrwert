{% assign contact_form = site.translations[site.lang].common.contact_form %}
<form action="{{site.contact_form_action}}" method="POST" class="home-contact-form">
	<div class="form-row">
		<div class="col-lg-12">
			<div class="form-group">
				<input type="text" class="form-control" name="Name" id="name" placeholder="{{ contact_form.form.name }}" aria-label="{{ contact_form.form.name | escape }}">
			</div>
		</div>
	</div>
	<div class="form-row">
		<div class="col-lg-6">
			<div class="form-group">
				<input type="text" class="form-control" name="_replyto" id="email" placeholder="{{ contact_form.form.email }}" aria-label="{{ contact_form.form.email | escape }}">
			</div>
		</div>
		<div class="col-lg-6">
			<div class="form-group">
				<input type="text" class="form-control" name="Telephone" id="telephone" placeholder="{{ contact_form.form.phone }}" aria-label="{{ contact_form.form.phone | escape }}">
			</div>
		</div>
	</div>
	<div class="form-row">
		<div class="col-lg-12">
			<div class="form-group">
				<input type="text" class="form-control" name="Subject" id="subject" placeholder="{{ contact_form.form.subject }}" aria-label="{{ contact_form.form.subject | escape }}">
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-lg-12">
			<textarea name="Message" id="message" cols="30" rows="4" class="form-control mb-4" placeholder="{{ contact_form.form.message }}" aria-label="{{ contact_form.form.message | escape }}"></textarea>
			<p class="text-sm">{% capture privacy_link %}href="{{ '/privacy.html' | localized_url }}"{% endcapture %}{{ contact_form.privacy-note | replace: 'href="/en/privacy.html"', privacy_link | replace: 'href="/privacy.html"', privacy_link }}</p>
			<button type="submit" class="btn btn-primary">{{ contact_form.button }}</button>
		</div>
	</div>
</form>
