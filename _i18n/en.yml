        items:
        - title: Connecting goals, planning and teams
          text: 'We coordinate priorities with leaders, product owners and teams, make dependencies visible and create planning that provides direction in everyday work. Whether quarterly planning or a simpler coordination format: we align collaboration with your organisation.'
          result: Agreed goals and priorities · visible dependencies · suitable planning and feedback formats.
        - title: Improving ways of working and quality
          text: Together, we examine queries, waiting times and rework – for example due to unclear requirements or handovers. With those involved, we develop practical agreements and support their use in everyday work.
          result: Better-prepared work · shared quality criteria · clearer handovers.
        - title: Supporting improvements and reviewing their effect
          text: We support leadership and teams in applying changes in everyday work. Together, we review whether, for example, lead times, rework or delivery reliability improve. We use suitable metrics and feedback and adapt measures when they do not have the intended effect.
          result: Concrete improvements with named owners · regular feedback · suitable measurement signals for decisions.
      ai:
        label: SOFTWARE DELIVERY IN TRANSITION
        title: When AI changes development, collaboration needs to evolve with it.
        paragraphs:
        - 'AI can change software analysis, development, testing and documentation. This raises new questions: who checks results? How is quality maintained? What should coordination and feedback look like when work changes?'
        - We consider tools and collaboration together. Whether responsibilities, quality checks or ways of working should be adapted depends on actual capabilities and requirements. Value, security and traceable results remain decisive.
      engagements:
        label: COLLABORATION
        title: Change needs people who take responsibility.
        paragraphs:
        - 'We take responsibility for the agreed tasks: we develop suitable measures with those involved, support their introduction, address obstacles openly and adjust when needed.'
        - For improvements to endure in everyday work, leadership must also set priorities, make decisions and allow time for change. We work with your teams and existing partners – selectively or over a longer period, depending on the task.
      values:
        label: SUSTAINABLY BETTER SOFTWARE
        title: Good collaboration should endure – even after our support ends.
        paragraphs:
        - 'We help develop ways of working that teams can continue themselves. This includes dropping meetings and rules when they bring no benefit. Awareness and responsibility from Green Agile shape this aim: recognising consequences, owning decisions and shaping collaboration to work in the long term.'
        link: Awareness and responsibility in the Green Agile Guide
        url: "/green-agile-guide.html"
      faq:
        label: GOOD TO KNOW
        title: Frequently asked questions about working together
        items:
        - title: Do our teams already need to work in an agile way?
          text: No. What matters is not which process model you use today, but which problems you want to solve. We build on existing structures and develop with you the ways of working that actually help.
        - title: Do we need to fundamentally change our existing planning and ways of working?
          text: Not necessarily. We start with what already works and consider together where changes make sense. Project and portfolio planning, teams' daily work and management oversight do not have to follow the same method. What matters is that they fit together and enable necessary decisions in time.
        - title: How do we recognise whether software delivery is improving?
          text: We first look at the effect you want to achieve – such as better predictability, less waiting or higher quality. We select suitable observations and metrics accordingly. They should support teams in improving and enable informed decisions, not pit individuals or teams against each other.
        - title: Who ensures that new ways of working are used over the long term?
          text: We design and support the introduction, review application and make obstacles visible. Management and the respective teams are needed for priorities, necessary capacity and binding decisions. We help build precisely this collaboration from the outset.
      contact:
        label: THE NEXT STEP
        title: What should work better in your software delivery?
        text: Perhaps you want to coordinate several teams better, make planning more reliable or finally put a change already started into practice. Tell us what is on your mind. Together, we clarify where mehr.wert can usefully support you.
        primary: Let's have an initial conversation
        alternative: Or write directly to kontakt@mehrwert.tech.
      experience:
        label: EXPERIENCE AS A FOUNDATION
        text: Through our own software development, technical leadership and work with leaders and teams, we know different perspectives. Two experiences show how different tasks can be in practice.
        link: More on projects & experience
        url: "/projects.html"
        items:
        - title: EnBW Trading IT
          origin: Earlier professional experience · Marcel Russ
          text: In my earlier role, I helped shape cross-team quarterly planning and shared onsite weeks. These formats became a recurring basis for coordination and decisions.
          link: Explore the EnBW experience
          url: "/projects/enbw.html"
        - title: Viridium
          origin: Ongoing client engagement · mehr.wert
          text: At Viridium, we support an IT organisation with twelve squads in building shared working and quality foundations. Through the Community of Practice, we encourage exchange and develop shared agreements. We support their application selectively in individual squads.
          link: Explore the Viridium experience
          url: "/projects/viridium.html"
  about:
    meta_title: About mehr.wert | mehr.wert
    description: Sustainably better software. Out of conviction.
    hero:
      label: ABOUT MEHR.WERT
      title: Sustainably better software. Out of conviction.
      paragraphs:
      - For us, software is never just technology. It influences how people work, how companies make decisions and how easily things can change. We want to help good ideas become something that holds up in everyday life. With our own experience, an open perspective and a willingness to take responsibility.
      primary: Meet the person behind mehr.wert
      secondary: How we work together
    story:
      label: WHY MEHR.WERT EXISTS
      title: Why I founded mehr.wert.
      paragraphs:
      - 'I began my career as a software developer and consultant. Even before my time at HUGO BOSS, I worked in very different industries – including automotive and industrial settings. I repeatedly had to familiarise myself with new domains, workflows and people. This shaped my perspective: good software does not come from good technology alone. You need to understand what it is needed for and who will work with it later.'
      - With my app myWork, I also developed a product of my own, continued developing it over many years and operated it. This gives you direct experience of how long technical decisions have an impact, how requirements change and how important feedback is from people who use an application every day.
      - 'Later, at HUGO BOSS, I led web and mobile teams and took responsibility for digital products. At Exxeta and in EnBW Trading IT, modernisation, strategy and collaboration in larger organisations were added. One thing kept recurring: there is rarely a shortage of good ideas or capable people. Things become harder when decisions remain unresolved, responsibilities are unclear or changes fail to take effect in everyday work.'
      - I founded mehr.wert in 2024 because I wanted to bring these experiences together. I want to support companies independently, express my assessment openly and take responsibility for the work we agree together. For me, this is not about changing as much as possible. It is about finding out what can actually improve – and what already works well and should remain.
      - I believe in experience, but not in ready-made answers for every situation. That is why I listen, question my own assumptions too and remain open to new insights. Together with the people who know the company and its challenges best, we find the right path.
      signature: Marcel Russ · Founder and Managing Director
      link: Explore projects & experience
      url: "/projects.html"
      portrait: "/assets/images/banner/2023.avif"
      portrait_alt: Marcel Russ, founder and managing director of mehr.wert
      caption: Marcel Russ – Diplom Informatiker, University of Stuttgart
      anecdote: Incidentally, the name mehr.wert goes back to a client who once said I was worth more than all the expensive consultants from the big firms put together – it made me smile, but the aspiration has stayed with me.
    network:
      diagram:
        core: mehr.wert · Marcel Russ
        responsibility: Your direct contact
        expertise: Specialists from my network
        customer: Your own teams and existing partners
      label: HOW WE ARE SET UP
      title: A stable core. A network that fits the task.
      paragraphs:
      - mehr.wert is deliberately personally led. I am your direct contact, develop the direction with you and shape our collaboration. I take responsibility for the tasks we agree – from the first conversation to the next steps in practice.
      - 'Not every initiative needs the same people or a large project team. When additional experience or specialist technical skills are needed, I work with specialists from my network. This creates a group assembled according to need: with a clear core, complementary expertise and as little organisational overhead as makes sense.'
      - Your own teams and existing partners remain involved. We complement what is missing instead of replacing structures that work. And even when other specialists contribute, you always know whom to contact.
    approach:
      label: HOW WE WORK
      title: We bring experience. And remain open to what we learn.
      paragraphs:
      - At the beginning, I want to understand what is on your mind, what already works well and where you would like change. We look at technical questions, but equally at the people who will later work with the results. Your industry, culture and available possibilities matter more than any standard model.
      - Sometimes what is needed above all is a clear decision. Sometimes a small, manageable experiment helps before considerable money and time are committed. And sometimes the best recommendation is deliberately not to change something. We use the ways of working and methods that help in the particular situation – and leave the rest out.
      - When we change something, we are interested in its consequences in everyday work. We gather feedback, examine suitable metrics and speak openly about what works and what does not. The next steps follow from this. Together, with clear responsibilities and a willingness to correct course.
    values:
      label: WHAT MATTERS TO US
      title: Sustainably better. For businesses, people and the environment.
      paragraphs:
      - For us, the planet is a stakeholder too – even if it never sits in any of our meetings.
      - Awareness and responsibility from Green Agile help us bring these perspectives together. We examine opportunities and trade-offs, explain our recommendations and take responsibility for the agreed tasks. Not everything can be optimised at once. But we should know the consequences of our decisions.
      - This approach also shapes our own collaboration. We use proven agile approaches and new technologies where they help and review together whether they deliver the intended value.
      link: Discover the Green Agile Guide
      url: "/green-agile-guide.html"
      intro: For us, sustainably better software means more than lower costs or a longer lifespan. We want to help shape solutions that make economic sense, support people and use our planet's resources responsibly. For us, all three perspectives belong in a good decision.
      items:
      - title: Economic
        text: Software should bring real value and remain viable over the long term. We therefore consider not only development costs, but also operation, maintainability, dependencies and the possibilities for making changes later.
      - title: Social
        text: Software is developed by people and for people. We consider how it affects everyday work, whether it is accessible and understandable and how teams collaborate. Good solutions should support people, not create additional barriers.
      - title: Environmental
        text: Software also consumes energy and resources. Computing power, data transfer, infrastructure and the lifespan of systems affect our environment. We want to consider these effects consciously and improve them where it is sensible and possible.
    reading:
      label: FURTHER READING
      title: If you would like to know more.
      items:
      - title: IT Strategy & Modernisation
        text: How we provide direction for difficult technology decisions and support modernisation.
        url: "/services/it-strategy-modernisation.html"
      - title: Organisation & Software Delivery
        text: How we help leadership and teams collaborate better and put changes into practice.
        url: "/services/agile-transformation-coaching.html"
      - title: Projects & experience
        text: What we have developed, led and moved forward together with clients.
        url: "/projects.html"
    contact:
      label: THE NEXT STEP
      title: Perhaps we should simply talk.
      text: You do not need a fully defined task yet. Tell us what is on your mind or which decision is ahead. We listen, ask questions and tell you openly whether and how we can help.
      primary: Let's have an initial conversation
      email: kontakt@mehrwert.tech
