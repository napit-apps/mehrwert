  services:
    it_strategy:
      meta_title: IT strategy & software modernisation | mehr.wert
      description: 'IT strategy and modernisation of business-critical software: assess options, understand risks and support change personally.'
      hero:
        label: IT STRATEGY & MODERNISATION
        title: A clear direction for your IT. So your business can keep moving.
        paragraphs:
        - A good IT strategy starts with your business. We establish an overview of systems, dependencies and possibilities, clarify important decisions and develop the next sensible steps with you. During implementation, we take on the responsibility we agree – and review together whether the path still fits.
        primary: Let's have an initial conversation
        secondary: How we support you
      situations:
        label: WHEN IT DECISIONS ARE NEEDED
        title: Perhaps you are facing one of these questions.
        items:
        - title: Your IT has grown. But where should it go next?
          text: New requirements meet existing systems, contracts and responsibilities. There is no shared picture of what can remain – and where change is needed.
        - title: The software works. Every change gets harder.
          text: Business-critical applications work, but knowledge is dispersed and dependencies are barely documented. You want to modernise without putting ongoing operations at risk.
        - title: Standard software has become a custom solution.
          text: Customisations complicate updates, increase costs or deepen dependence on vendors. A realistic assessment of the actual options is now needed.
        - title: The direction is clear. But the initiative has stalled.
          text: Business departments, IT and partners are involved, but priorities and responsibilities do not align. Decisions need to take effect in everyday work again.
      benefits:
        label: WHAT MATTERS
        title: A good IT strategy creates room to act.
        intro: It does not need to predict everything. It should help assess options and make important decisions transparently, even when new insights emerge.
        items:
        - title: Clarity on what matters.
          text: Which systems, risks and dependencies are critical to your business?
        - title: Well-founded priorities.
          text: What is worthwhile in view of benefits, costs and risks – and what is not?
        - title: Next steps that can be adapted.
          text: Who takes on what, and when is it worth reviewing the path?
      decisions:
        label: MODERNISATION AS A STRATEGIC DECISION
        criteria:
        - Business value
        - Risks
        - Economic viability
        - Feasibility
        title: Not everything needs replacing. But it does need a conscious decision.
        intro: Sometimes targeted development is right, sometimes incremental renewal or replacement. What matters is your business, the risks, the costs and your organisation's capabilities.
        items:
        - title: Develop selectively
          text: What works reliably does not need to be replaced. We clarify where improvements make sense and what should be preserved.
        - title: Modernise incrementally
          text: When parts of an application increasingly slow things down, we plan manageable changes while keeping ongoing operations in view.
        - title: Replace deliberately
          text: When effort, risks or dependencies are no longer sustainable, we assess an orderly replacement – including the knowledge that must be preserved.
        closing: These options are not mutually exclusive. The right path may change as new insights emerge.
      engagements:
        label: COLLABORATION
        title: You get the support your situation needs.
        paragraphs:
        - Sometimes an independent assessment or a workshop is enough. For larger initiatives, we support you over a longer period, if needed also taking on interim IT leadership responsibility. You speak directly with Marcel Russ; your teams and partners remain involved. Additional specialists join only when they are truly needed.
      support:
        label: OUR SUPPORT
        title: We step in where you need us.
        intro: Sometimes an independent perspective is enough. Sometimes a shared IT strategy or support during implementation is needed. Scope and approach depend on your situation.
        items:
        - title: Assessing the IT situation
          text: We examine your systems, business requirements, risks and dependencies. Together, we clarify which information is missing for a decision and which options are already apparent.
          result: A clear starting point · well-founded options for action.
        - title: Aligning strategy and modernisation
          text: We clarify with you what your IT should deliver in future and assess existing solutions, alternatives and possible stages. Architecture, costs, security and your organisation's capabilities inform the decisions.
          result: A shared target vision · clear priorities · next steps that can be reviewed.
        - title: Supporting implementation and taking IT responsibility
          text: We bring people together, help put agreed decisions into practice and make progress and obstacles visible. New insights may change the next step. Where needed, we take on clearly agreed IT leadership responsibility for a limited period.
          result: Clear responsibilities · visible progress · timely decisions.
        clarification: Software development remains with your teams, existing partners or specialists brought in as needed. We take responsibility for the tasks we agree together.
        result_label: 'Possible work outcomes:'
      values:
        label: SUSTAINABLY BETTER SOFTWARE
        title: Good decisions have an impact beyond the next release.
        paragraphs:
        - 'We consider the consequences of technical decisions: maintainability, operating costs, resources and the people working with the software. Awareness and responsibility help us weigh opportunities and risks openly – even when circumstances change.'
      faq:
        label: GOOD TO KNOW
        title: Frequently asked questions about working together
        items:
        - title: Do we already need to know what we want to modernise?
          text: No. Particularly when the direction is still open, assessing the situation together can be useful. We examine the starting point and goals, assess options and clarify which decision comes next.
        - title: Do you work with our existing teams and service providers?
          text: Yes. We involve the people who know the systems and processes. Depending on the assignment, we help with strategy and coordination or take on the agreed management of the initiative. We involve additional specialists only when needed.
        - title: Can you also take on IT responsibility temporarily?
          text: Yes, provided the task, mandate and decision-making scope are clear. This could, for example, involve managing a modernisation initiative or a time-limited IT leadership role.
      contact:
        label: THE NEXT STEP
        title: Which IT decision is on your mind?
        text: Would you like to realign your IT, modernise an important application or move a stalled initiative forward? Tell us where you stand. Together, we consider which next step makes sense.
        primary: Let's have an initial conversation
        alternative: Or write directly to
      ai:
        label: NEW POSSIBILITIES THROUGH AI
        title: Using AI sensibly. With a clear focus on value.
        paragraphs:
        - Artificial intelligence opens up new possibilities for understanding, developing and modernising software. Particularly in established systems, it can help uncover existing business knowledge, reveal dependencies and support quality assurance. This helps prepare changes better and make more informed decisions.
        - We incorporate these possibilities into our strategy and modernisation work. Which tools are useful depends on your goals, your IT landscape and the available information. We consider economic viability, privacy, security, quality and potential new dependencies.
        closing: "<strong>Our aim:</strong> To use the possibilities of modern technology without relinquishing professional judgement and responsibility."
      experience:
