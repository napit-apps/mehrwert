    details:
      duecker:
        hero:
          eyebrow: CLIENT ENGAGEMENT · MEHR.WERT
          title: Modernising a business-critical software platform
          lead: Preparing established software for the future – by bringing business departments and development together to create a shared basis for decisions and implementation.
          context: Ongoing modernisation initiative · Business and technical collaboration · IT strategy
          client: Dücker
        situation:
          title: The application is indispensable. Knowledge about it is dispersed.
          paragraphs:
          - When software supports a business for many years, it often contains much more than program code. Established workflows, business decisions and special rules are part of day-to-day operations. Not all of this is fully documented outside the application.
          - In this initiative, different departments brought their own perspectives on the existing platform. A shared understanding of the domain and a common modernisation path first had to be developed. The task was to prepare necessary changes without losing the valuable knowledge held in the current system.
        role:
          title: 'Our task: bringing people together and preparing concrete steps towards modernisation.'
          paragraphs:
          - We support the company in preparing the business and strategic foundations for its software modernisation. We connect the perspectives of business departments and development, structure open questions and help turn different expectations into a jointly supported direction.
          - An important part of our responsibility is to prepare the outcomes so they can be used in further development, beyond the initial discussions. Technical implementation remains with the development teams involved. mehr.wert supports the agreed modernisation work and connects business clarification with preparation for implementation.
        transfer:
          title: What makes this experience relevant to other modernisation initiatives.
          paragraphs:
          - The hardest part of modernisation is not always the new technology. Often, the first step is to understand why an existing application works the way it does – and which business dependencies are involved.
          - That is why we consider IT strategy, the business domain and implementation together. We help develop a responsible way forward and establish the foundations for changes to go beyond a target architecture on paper.
        closing:
          title: Is a business-critical application in your organisation facing change?
          paragraphs:
          - 'Whether modernising, incrementally developing or replacing it: a clear understanding of the starting point comes first. Let us discuss the decisions facing your initiative.'
          links:
          - title: IT Strategy & Modernisation
            url: "/services/it-strategy-modernisation.html"
          - title: View all projects & experience
            url: "/projects.html"
          - title: Let's have an initial conversation
            url: "/contact.html"
        approach:
          title: First understand what needs to be preserved. Then determine the next step.
          items:
          - title: Creating a shared understanding of the domain
            text: People from departments that had previously worked separately came together to examine business processes, terminology and relationships. This enabled them to clarify different perspectives and build a shared understanding of business requirements.
          - title: Making existing business rules accessible
            text: Important business rules were embedded in the existing software. We identified and structured these rules and handed them over to development. Knowledge from the existing system thus became a concrete basis for the next technical steps.
          - title: Agreeing a viable modernisation path
            text: A modernisation strategy was developed together on this basis. It connects business requirements with implementation options and provides guidance for taking the initiative forward step by step.
          intro: The focus was not on a premature decision for a new technology. We worked on the foundations that make informed modernisation possible in the first place.
        results:
          title: What has already been established.
          items:
          - title: A shared understanding of the business domain
            text: Previously separate departments brought their perspectives together and developed a shared understanding of processes and requirements. This provides a better basis for business discussions and further decisions.
          - title: An agreed direction for modernisation
            text: Those involved defined a common path for the platform's further development. It provides direction without pre-empting specific implementation steps.
          - title: Business rules prepared for development
            text: Business rules from the existing application were identified and handed over to development. This material can help preserve established behaviour in a traceable way as the system evolves incrementally.
          intro: Modernisation is an ongoing initiative. Key foundations for the next steps have already been created together.
        process:
          title: Business knowledge becomes the basis for implementation.
          steps:
          - Business departments & existing application
          - Shared domain understanding
          - Modernisation strategy & usable business rules
          feedback: Business knowledge is understood together, structured and made available for further development.
          caption: Simplified illustration of the business preparation for software modernisation.
          mode: flow
          intro: Connecting business departments and development is not an additional coordination step. It is a prerequisite for preserving and changing the right things during modernisation.
        meta_title: Modernising a business-critical software platform | mehr.wert
        description: Preserving existing business knowledge and establishing a shared direction for technical renewal.
      mywork-produktverantwortung:
        hero:
          eyebrow: OWN PRODUCT · MARCEL RUSS
          title: myWork – Mobile time tracking
          lead: An iOS app for tracking working hours and projects – which I developed and took responsibility for myself, from the first idea over many years.
          context: iOS software product · Concept, development, operation and ongoing improvement
          client: ''
        situation:
          title: A personal need became a software product.
          paragraphs:
          - The idea for myWork arose from a desire to make tracking working hours and projects easier. What began as a personal task developed into a mobile application during my studies, which I published and subsequently continued to improve.
          - What mattered was not only that the app fulfilled its tasks. It needed to remain easy to use in everyday life, accommodate new requirements and be maintained reliably across several generations of technology. myWork thus gave me early practical experience of long-term product responsibility.
        role:
          title: With myWork, my responsibility does not end at release.
          paragraphs:
          - I conceived, designed and developed myWork myself. Architecture, technical implementation and publication are part of this, as are maintenance, quality assurance, support and decisions about new features or necessary adaptations.
          - Unlike a time-limited project, I continue to live with the consequences of earlier decisions myself. Something implemented quickly today may be expensive to maintain tomorrow. Something technically elegant must also prove itself in users' daily lives. For me, these two perspectives are inseparable.
        transfer:
          title: Why this experience shapes my consulting work today.
          paragraphs:
          - Taking responsibility for your own software over many years changes how you view technical decisions. Architecture and maintainability, usability and operating costs, new features and existing dependencies cannot be assessed in isolation.
          - I bring this product perspective to mehr.wert's work. In IT strategy and modernisation, I ask not only what is technically possible, but also which solution can be operated, changed and economically sustained over the long term.
        closing:
          title: Would you like to keep your software fit for the future?
          paragraphs:
          - 'Whether you are developing an existing application further or need to make fundamental technology decisions: considering the entire lifecycle helps you choose an appropriate path.'
