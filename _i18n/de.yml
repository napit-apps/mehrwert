      - title: Rolle und Verantwortung
        text: Marcel Russ hat die Zeiterfassungs-App myWork selbst entwickelt und über Jahre betrieben und weiterentwickelt. Das umfasst Produktentscheidungen genauso wie Entwicklung, Qualität und Wartung.
      - title: Beitrag
        text: Von der Produktidee und technischen Architektur über Implementierung und Veröffentlichung bis zur kontinuierlichen Weiterentwicklung lag die Verantwortung direkt beim Entwickler und Produktverantwortlichen.
      - title: Ergebnis und Bedeutung
        text: myWork ist ein langfristig weiterentwickeltes eigenes Softwareprodukt.
      - title: Heute relevant
        text: 'Diese Perspektive prägt den Anspruch von mehr.wert: Architekturentscheidungen müssen bei Erweiterungen und im Betrieb tragen – nicht nur im Konzept überzeugend aussehen.'
      description: Ein eigenes Produkt entwickeln und über Jahre für Nutzer, Architektur, Betrieb und Weiterentwicklung verantwortlich bleiben.
