        - title: Veröffentlichen und weiter pflegen
          text: Mit der App-Store-Veröffentlichung wurde aus der Entwicklung ein nutzbares Softwareprodukt. Weitere Pflege und Produktentscheidungen gehörten ebenso zu meiner Arbeit wie die ursprüngliche technische Umsetzung.
        intro: Bei einer Finanz-App treffen verständliche Oberflächen und verlässlicher Umgang mit Nutzerdaten unmittelbar aufeinander. Für mich waren drei Aspekte besonders prägend.
      results:
        title: Ein eigenes iOS-Produkt von der Idee bis zur Veröffentlichung.
        paragraphs:
        - Aus der Produktidee wurde eine veröffentlichte iOS-App zur Verwaltung persönlicher Finanzen. Konzeption, Interface-Design und technische Entwicklung habe ich selbst verantwortet. Mit der laufenden Pflege kamen weitere Aufgaben hinzu, die über eine einmalige Implementierung hinausgehen.
