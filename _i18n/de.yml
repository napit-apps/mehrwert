      faq:
        title: FAQs
        item:
        - question: Warum sollten Sie sich und Ihr Team für das Training anmelden?
          answer: Die Umweltauswirkungen von Software steigt rassant. In diesem Training erfahren Sie, wie Entwickler, IT Abteilungen und Manager zu einer nachhaltigen IT Zukunft beitragen können.
        - question: Wer sollte an diesem Training teilnehmen?
          answer: Dieses Training ist speziell für Fachleute konzipiert, die in den Bereichen Softwareentwicklung, -implementierung oder -management tätig sind. Es richtet sich an alle, die ihre Kenntnisse im Bereich der nachhaltigen Softwarepraktiken vertiefen möchten, um aktiv zur Reduzierung des CO2-Fußabdrucks ihrer Anwendungen beizutragen.
        - question: Welche Voraussetzungen sind für die Teilnahme erforderlich?
          answer: Teilnehmer dieses Trainings sollten über Grundkenntnisse in der Softwareentwicklung verfügen. Dies bildet die Basis, um die Prinzipien und Techniken nachhaltiger Softwareentwicklung effektiv zu verstehen und anzuwenden.
        - question: Was werden Sie in diesem Training lernen?
          answer: In diesem Training werden Sie sich mit den Schlüsselkonzepten der nachhaltigen Softwareentwicklung auseinandersetzen. Dazu gehören Energieeffizienz, CO2-Bewusstsein und Hardwareeffizienz. Sie lernen, wie diese Prinzipien in der Praxis angewandt werden, um den CO2-Fußabdruck Ihrer Softwareprodukte zu minimieren.
        - question: Auf welchen Grundlagen beruhen die Trainingsinhalte?
          answer: Die Trainingsinhalte stützen sich auf die fundierten Vorarbeiten der Green Software Foundation. Diese werden durch tiefergehende Lehrmaterialien ergänzt, die neueste wissenschaftliche Erkenntnisse sowie praxisnahe Beispiele einschließen, um Ihnen ein umfassendes Verständnis der nachhaltigen Softwareentwicklung zu vermitteln.
        - question: Wie können Sie sich und Ihr Team für das Training anmelden?
          answer: Um sich und Ihr Team für das Training anzumelden, nutzen Sie bitte das Anmeldeformular weiter unten auf der Seite, rufen uns an oder schicken uns eine E-Mail. Bei Fragen oder für weitere Informationen stehen wir Ihnen gerne zur Verfügung.
        - question: Gibt es eine Mindestteilnehmerzahl oder eine Begrenzung der Teilnehmeranzahl?
          answer: Für das Training gibt es sowohl eine Mindestteilnehmerzahl als auch eine Obergrenze für die Anzahl der Teilnehmenden. Um eine optimale Lernumgebung zu gewährleisten empfehlen wir eine Gruppengröße von 4 bis 10 Teilnehmenden. Kontaktieren Sie uns gerne direkt für weitere Informationen.
        - question: Warum findet das Training bevorzugt in Präsenz statt?
          answer: Das Training wird vorrangig vor Ort durchgeführt, um eine interaktive Lernumgebung zu fördern, in der direkter Austausch und praktische Übungen optimal umgesetzt werden können. Diese Form des Lernens unterstützt nicht nur den Aufbau von Netzwerken unter den Teilnehmern, sondern ermöglicht auch unmittelbares Feedback und individuelle Unterstützung durch die Trainer.
        - question: Können einzelne Teilnehmer auch remote am Training teilnehmen?
          answer: Ja, es besteht die Möglichkeit, dass einzelne Teilnehmer remote am Training teilnehmen. Wir bieten flexible Lösungen an, um eine effektive Integration von Präsenz- und Fernunterricht zu gewährleisten. Für spezifische Anforderungen oder die Einrichtung eines hybriden Trainingsformats stehen wir Ihnen gerne zur Verfügung, um eine passende Lösung zu finden.
        - question: Werden im Training technologiespezifische Fragen behandelt?
          answer: Während die Inhalte unseres Trainings technologieunabhängig gestaltet sind, um eine breite Anwendbarkeit zu gewährleisten, gehen wir gerne auf technologiespezifische Fragen ein. Wir ermutigen die Teilnehmenden, solche Fragen zu stellen, um auf individuelle Bedürfnisse und spezifische Situationen eingehen zu können. Der Umfang ist dabei über das gewählte Trainingspaket geregelt.
        - question: Wieviel kostet das Training?
          answer: Die Kosten für das Training variieren je nach gewähltem Paket. Eine detaillierte Übersicht über die verschiedenen Trainingspakete und deren Preise finden Sie auf dieser Webseite. Bitte beachten Sie, dass für Veranstaltungsorte außerhalb eines 50-km-Radius um Kirchheim unter Teck zusätzliche Reisekosten anfallen können. Für spezifische Informationen zu den Reisekosten kontaktieren Sie uns bitte direkt.
        - question: Wie lange dauert das Training?
          answer: Die Dauer des Trainings hängt vom gewählten Paket ab. Details zu den einzelnen Trainingspaketen und deren Laufzeiten finden Sie auf dieser Webseite. Dort bieten wir eine Auswahl verschiedener Formate, die auf unterschiedliche Bedürfnisse und Zeitpläne zugeschnitten sind.
        - question: Wie erfolgt die Zertifizierung?
          answer: Wenn Sie sich für eine Zertifizierung entscheiden, haben Sie die Möglichkeit, im Anschluss an das Training eine Prüfung über die Linux Foundation abzulegen. Diese Prüfung testet Ihr erworbenes Wissen und Ihre Fähigkeiten im Bereich der nachhaltigen Softwareentwicklung. Bei erfolgreichem Bestehen der Prüfung erhalten Sie ein Zertifikat, das Ihre Qualifikationen als Green Software Practitioner bestätigt.
        - question: Wo findet das Training statt?
          answer: Für die Durchführung des Tainungs kommen wir sehr gerne bei Ihnen vorbei. Alternativ, laden wir Sie gerne zu uns in Kirchheim unter Teck ein.
