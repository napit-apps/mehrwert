          - title: Bewegungsinformationen erfassen
            text: Die Sensorik im Kleidungsstück war dafür vorgesehen, Bewegungsinformationen beim Training bereitzustellen. Welche Daten sinnvoll genutzt werden können, hängt von den technischen Möglichkeiten und vom Anwendungszweck ab.
          - title: Informationen algorithmisch aufbereiten
            text: Aus erfassten Informationen entsteht noch keine verständliche Rückmeldung. Dafür müssen die Daten geeignet verarbeitet und die Ergebnisse für die vorgesehene Darstellung nutzbar gemacht werden.
          - title: Ergebnisse in einer mobilen App darstellen
            text: Die Anwendung sollte Bewegungsabläufe visualisieren. Für die Abstimmung zwischen App-Entwicklung und den anderen technischen Disziplinen war deshalb ein gemeinsames Verständnis der darzustellenden Informationen wichtig.
        process:
          title: Von der Bewegung zur mobilen Darstellung.
          intro: Das Konzept verband mehrere technische Bausteine zu einer nachvollziehbaren Verarbeitungskette.
          feedback: Für einen sinnvollen Gesamteindruck müssen technische Daten und ihre Darstellung aufeinander abgestimmt sein.
          caption: Vereinfachte Darstellung der Produktidee, keine Abbildung eines validierten Serienprodukts.
          mode: flow
          steps:
          - Smartes Sport-Shirt & Sensorik
          - Algorithmische Verarbeitung
          - Visualisierung in der App
        meta_title: Bewegungsanalyse mit Sensorik und mobiler App | mehr.wert
        description: Sensoren, Algorithmen und App-Entwicklung in einem frühen Innovationsvorhaben zusammenbringen.
      green-agile-guide:
        hero:
          eyebrow: INITIATIVE · GREEN AGILE
          title: Green Agile Guide – Nachhaltigkeit im agilen Alltag
          lead: Nachhaltige Software entsteht durch bewusste Entscheidungen und übernommene Verantwortung – nicht allein durch zusätzliche Regeln oder neue Methoden.
          context: Fachinitiative von Marcel Russ · Agile Produkt- und Softwareentwicklung · Bewusstsein & Verantwortung
          client: ''
        situation:
          title: Wie wird Nachhaltigkeit Teil der täglichen Softwarearbeit?
          paragraphs:
          - 'In der Softwareentwicklung werden viele Entscheidungen unter Zeitdruck getroffen: Welche Funktion hat Priorität? Wie viel Aufwand investieren wir in Qualität? Welche Auswirkungen haben unsere Architektur und unser Betrieb über die nächsten Jahre?'
          - 'Nachhaltigkeit wird dabei oft als zusätzliche Aufgabe behandelt. Ich wollte einen Ansatz entwickeln, der dort ansetzt, wo Teams ohnehin Entscheidungen treffen: bei Produktzielen, Backlogs, der Umsetzung und den gemeinsamen Qualitätsmaßstäben.'
        role:
          title: Eine fachliche Initiative aus meiner Überzeugung.
          paragraphs:
          - Ich entwickle den Green Agile Guide, weil ich nachhaltige Softwareentwicklung als Teil guter professioneller Arbeit verstehe. Es geht mir nicht darum, agilen Teams ein weiteres Framework zu geben. Ich möchte verdeutlichen, wie sie die Folgen ihrer Entscheidungen bewusster betrachten und Verantwortung für langfristige Qualität übernehmen können.
          - Dafür übertrage ich Nachhaltigkeitsfragen in bereits bekannte agile Rollen, Ziele und Arbeitsweisen. Die Gedanken bringe ich auch in Vorträge und fachliche Diskussionen ein und entwickle sie weiter.
        results:
          title: Ein Guide, der Haltung in die Praxis übersetzt.
          paragraphs:
          - Mit dem Green Agile Guide ist ein fachlicher Bezugsrahmen entstanden, der Nachhaltigkeit mit bekannten agilen Zielen, Verantwortlichkeiten und Arbeitsweisen verknüpft. Er bietet Anregungen, um Qualitäts- und Nachhaltigkeitsfragen frühzeitig zu stellen – und nicht erst am Ende eines Entwicklungsprojekts.
          - Der Guide ist zugleich Grundlage für meine Vorträge und fachlichen Diskussionen. Seine Stärke liegt darin, bestehende Zusammenarbeit weiterzuentwickeln, statt die Organisation mit zusätzlichen Rollen und Meetings zu belasten.
        transfer:
          title: Was Green Agile mit mehr.wert verbindet.
          paragraphs:
          - "„Nachhaltig bessere Software“ ist unser Qualitätsanspruch. Wir betrachten technische Lösungen nicht nur danach, ob sie heute funktionieren, sondern auch danach, wie sie langfristig betrieben, verändert und verantwortet werden können."
          - Bewusstsein und Verantwortung prägen deshalb auch unsere Arbeit in IT-Strategie, Modernisierung und Software-Delivery. Green Agile macht diese Haltung in einem konkreten fachlichen Kontext sichtbar; es ist keine zusätzliche Servicesparte.
        closing:
          title: Sie möchten bewusster über die Qualität Ihrer Software entscheiden?
          paragraphs:
          - Wir sprechen gerne darüber, wie langfristige Qualität und verantwortungsvolle Technologieentscheidungen in Ihre bestehenden Ziele und Arbeitsweisen passen.
          links:
          - title: Mehr über den Green Agile Guide
            url: "/green-agile-guide.html"
          - title: Organisation & Software-Delivery
            url: "/services/agile-transformation-coaching.html"
          - title: Alle Projekte & Erfahrungen ansehen
            url: "/projects.html"
          - title: Unverbindlich ins Gespräch kommen
            url: "/contact.html"
        values:
          title: Bewusstsein und Verantwortung gehören zusammen.
          intro: Der Guide baut auf zwei Werten auf, die sich im Alltag gegenseitig ergänzen.
          items:
          - title: Bewusstsein
            text: Entscheidungen haben Auswirkungen auf Ressourcen, Kosten, Architektur, Nutzer und Teams. Wer diese Folgen sichtbar macht, kann Alternativen besser beurteilen und Prioritäten bewusst setzen.
          - title: Verantwortung
            text: Erkenntnisse allein verändern noch nichts. Verantwortung bedeutet, die relevanten Folgen in Entscheidungen zu berücksichtigen, Vereinbarungen in die Arbeit zu übernehmen und Ergebnisse kritisch zu überprüfen.
          closing: Nachhaltige Software entsteht dort, wo Bewusstsein auf Verantwortung trifft.
        approach:
          title: Keine neuen Rituale. Bessere Fragen im richtigen Moment.
          intro: Agile Teams arbeiten bereits mit Zielen, Backlogs, gemeinsamer Planung und Qualitätsvereinbarungen. Der Green Agile Guide nutzt diese bekannten Elemente als Ansatzpunkte für nachhaltigere Entscheidungen.
          items:
          - title: Produktziele und Prioritäten
            text: Bei der Ausrichtung eines Produkts können Teams neben dem unmittelbaren Nutzen auch Betrieb, Ressourcenverbrauch, Zugänglichkeit und langfristige Kosten berücksichtigen.
          - title: Backlog und Umsetzung
            text: Nachhaltigkeitsaspekte können in die Beschreibung und Abwägung bestehender Aufgaben einfließen. Entscheidend ist, sie dort zu betrachten, wo über Umfang, Lösung und Aufwand entschieden wird.
          - title: Qualitätskriterien und Feedback
            text: Gemeinsame Qualitätsmaßstäbe helfen, die Folgen technischer Entscheidungen sichtbar zu machen. Geeignete Rückmeldungen und Messgrößen können zeigen, ob ein gewählter Weg die beabsichtigte Wirkung unterstützt.
        process:
          title: Nachhaltigkeit in den vorhandenen Entscheidungsfluss einbinden.
          intro: Der Ansatz ergänzt bestehende Arbeitsweisen um eine bewusste Perspektive, statt einen parallelen Prozess aufzubauen.
          feedback: Auswirkungen erkennen, Entscheidungen treffen und ihre Folgen überprüfen – innerhalb der normalen Produkt- und Softwarearbeit.
          caption: Vereinfachte Darstellung des Green-Agile-Gedankens; keine zusätzliche Prozessvorgabe.
          mode: values
          steps:
          - Produktziel & Prioritäten
          - Backlog & Umsetzung
          - Qualität & Feedback
          bracket: Bewusstsein + Verantwortung
        meta_title: Green Agile Guide – Nachhaltigkeit in agilen Arbeitsweisen | mehr.wert
        description: Bewusstsein und Verantwortung in der Produkt- und Softwarearbeit verankern.
      enbw:
        hero:
          eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
          title: Quartalsplanung und Onsite-Wochen
          lead: Strategische Ziele, Team-Roadmaps und Abhängigkeiten zusammenbringen – damit Teams und Führung ihre Vorhaben gemeinsam planen und Entscheidungen rechtzeitig treffen können.
          context: EnBW Trading IT · Enterprise Agile Coaching und zeitweise Release Train Engineering · Teamübergreifende Planung und Zusammenarbeit
          client: EnBW Trading IT
        situation:
          title: Wenn viele Teams liefern, braucht es eine gemeinsame Richtung.
          paragraphs:
          - In der Trading IT liefen unterschiedliche Vorhaben parallel. Teams arbeiteten an ihren eigenen Aufgaben und Roadmaps, waren dabei aber vielfach voneinander abhängig. Für die übergreifende Steuerung reichte es nicht aus, wenn jedes Team für sich gut plante. Strategische Prioritäten, Team-Roadmaps, Abhängigkeiten und offene Entscheidungen mussten gemeinsam betrachtet werden.
          - Die Herausforderung bestand deshalb nicht nur darin, einen Plan zu erstellen. Gefragt war eine Arbeitsform, mit der Teams, Verantwortliche und Management regelmäßig zusammenkommen, ihre Planungen aufeinander abstimmen und neue Erkenntnisse im weiteren Verlauf berücksichtigen können.
        role:
          title: 'Meine Aufgabe: aus einer Idee eine gelebte Planungsroutine machen.'
          paragraphs:
          - Ich habe im Umfeld der EnBW Trading IT über mehrere Phasen und in unterschiedlichen Rollen gearbeitet – zunächst in der übergreifenden agilen Organisationsentwicklung, zeitweise auch als Release Train Engineer. Ein wesentlicher Teil meiner Verantwortung lag darin, den teamübergreifenden Quartalsplanungsprozess mitzugestalten, weiterzuentwickeln und im Arbeitsalltag zu verankern.
          - 'Dazu gehörte mehr als die Moderation einzelner Termine: Ich habe Formate konzipiert und vorbereitet, Teams und Verantwortliche in der Planung zusammengebracht, Abstimmungen begleitet und daran gearbeitet, dass die vereinbarten Prozesse und Rückmeldeschleifen tatsächlich genutzt wurden. Die operative RTE-Rolle half dabei, die gemeinsam entwickelte Arbeitsweise über die Einführung hinaus zu betreiben.'
        transfer:
          title: Was ich aus dieser Erfahrung mitnehme.
          paragraphs:
          - Eine gute Strategie wird erst dann wirksam, wenn Menschen sie in gemeinsame Entscheidungen und konkrete Arbeit übersetzen können. Das erfordert nicht zwingend mehr Prozesse. Es braucht klare Ziele, passende Abstimmungen und die Bereitschaft, aus dem Arbeitsalltag zu lernen.
          - 'Diese Erfahrung prägt meine heutige Arbeit bei mehr.wert: Wir verbinden strategische Orientierung mit tragfähigen Arbeitsweisen und begleiten ihre Einführung so, dass Teams und Führung sie tatsächlich nutzen können.'
        closing:
          title: Ähnliche Herausforderungen in Ihrer IT-Organisation?
          paragraphs:
          - Wenn viele Teams an gemeinsamen Vorhaben arbeiten, lohnt sich ein Blick darauf, wie Ziele, Planung und Delivery heute zusammenfinden. Wir sprechen gerne darüber, was in Ihrer Situation hilfreich wäre.
          links:
          - title: Organisation & Software-Delivery
            url: "/services/agile-transformation-coaching.html"
          - title: Alle Projekte & Erfahrungen ansehen
            url: "/projects.html"
          - title: Unverbindlich ins Gespräch kommen
            url: "/contact.html"
        approach:
          title: Von einzelnen Roadmaps zu einem gemeinsamen Planungsrhythmus.
          intro: Mir war wichtig, dass Planung kein einmaliges Großereignis bleibt, sondern ein wiederkehrender Austausch zwischen strategischer Richtung und der tatsächlichen Arbeit der Teams wird.
          items:
          - title: Prioritäten und Abhängigkeiten sichtbar machen
            text: Strategische Ziele, anstehende Vorhaben und Team-Roadmaps wurden zusammengeführt. Abhängigkeiten und Risiken sollten frühzeitig erkennbar sein, damit die Beteiligten nicht erst bei der Umsetzung auf widersprüchliche Planungen stoßen.
          - title: Gemeinsam planen – bewusst auch vor Ort
            text: Quartalsplanung und teamübergreifende Onsite-Wochen gaben der Abstimmung einen festen Rahmen. Mit vorbereiteten Agenden, klaren Fragestellungen und passenden Austauschformaten konnten Teams und Führung Prioritäten klären, Schnittstellen besprechen und die nächsten Schritte gemeinsam ausrichten.
          - title: Entscheidungen und Erfahrungen zurückspiegeln
            text: Status-Dashboards, Abhängigkeitsübersichten und regelmäßige Rückmeldungen an das Management ergänzten die Planung. So konnten neue Erkenntnisse, Engpässe und offene Entscheidungen sichtbar werden und in die weitere Steuerung einfließen.
        results:
          title: Was daraus entstanden ist.
          intro: Der wichtigste Fortschritt war, dass aus einem übergreifenden Planungsansatz eine wiederkehrend genutzte Arbeitsform wurde. Die Beteiligten hatten gemeinsame Anlässe und Grundlagen, um Prioritäten, Roadmaps und Abhängigkeiten aufeinander abzustimmen.
          items:
          - title: Eine etablierte Quartalsplanung
            text: Quartalsplanung und Onsite-Wochen wurden als wiederholbare, teamübergreifende Formate aufgebaut und eingesetzt – nicht nur als Konzept beschrieben.
          - title: Mehr Transparenz für gemeinsame Entscheidungen
            text: Team-Roadmaps, Status-Dashboards und Abhängigkeiten wurden miteinander verknüpft. Rückmeldungen aus der Zusammenarbeit bestätigen eine verbesserte Planungsqualität und frühere Sichtbarkeit von Risiken und Abstimmungsbedarf.
          - title: Bessere Abstimmung zwischen IT Teams, Fachbereichen und Management
            text: Die gemeinsamen Planungs- und Feedbackformate schufen eine verlässlichere Grundlage für Abstimmungen zwischen IT-Teams, Fachbereichen und Management. Beteiligte beschrieben die Zusammenarbeit als strukturierter und praxisnäher.
        process:
          title: Ein Planungsprozess, der im Alltag weiterlebt.
          intro: 'Entscheidend war die Verbindung der Ebenen: von der strategischen Priorität bis zur konkreten Abstimmung zwischen Teams – und wieder zurück zu den Verantwortlichen, die Entscheidungen treffen müssen.'
          steps:
          - Strategische Ziele & Prioritäten
          - Team-Roadmaps & Abhängigkeiten
          - Quartalsplanung & Onsite-Wochen
          - Umsetzung, Transparenz & Feedback
          feedback: Erkenntnisse, Risiken und Entscheidungen fließen in die weitere Planung zurück.
          caption: Vereinfachte Darstellung des Planungs- und Rückkopplungsprozesses.
