        title: Welche Entscheidung steht bei Ihnen an?
        text: Vielleicht geht es um eine gewachsene Anwendung, eine technische Richtungsentscheidung
          oder die Zusammenarbeit Ihrer Teams. Erzählen Sie uns, wo Sie gerade stehen. Wir
          hören zu und klären gemeinsam, ob und wie wir helfen können.
        button: Unverbindlich ins Gespräch kommen
