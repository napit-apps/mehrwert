  portfolio_cases_block2:
    viridium:
      publication_status: draft
      hero:
        eyebrow: KUNDENMANDAT · MEHR.WERT
        title: Gemeinsame Arbeitsgrundlagen für zwölf Squads
        lead: Unterschiedliche Teams auf gemeinsame Qualitätsmaßstäbe und eine verlässlichere Zusammenarbeit ausrichten – und die Veränderungen im Arbeitsalltag begleiten.
        context: Organisationsentwicklung · Software-Delivery · Laufendes Mandat
      situation:
        title: Viele Teams. Unterschiedliche Arbeitsweisen. Ein gemeinsamer Lieferauftrag.
        paragraphs:
        - In einer IT-Organisation mit zwölf Squads treffen unterschiedliche fachliche Aufgaben, Arbeitsweisen und Projektanforderungen aufeinander. Was in einem Team gut funktioniert, ist über Team- und Release-Grenzen hinweg nicht automatisch verständlich oder anschlussfähig.
        - Die Herausforderung lag nicht darin, noch ein agiles Framework einzuführen. Es brauchte gemeinsame Grundlagen für Anforderungen, Qualität und Planung – und eine Verbindung zwischen den Erwartungen aus Projekten, der Release-Steuerung und dem, was die Squads tatsächlich liefern können. Vor allem mussten diese Grundlagen im Alltag nutzbar werden.
      role:
        title: 'Unsere Aufgabe: gemeinsame Grundlagen schaffen und ihre Anwendung begleiten.'
        paragraphs:
        - mehr.wert unterstützt die Organisation dabei, ihre Zusammenarbeit und Software-Delivery gezielt weiterzuentwickeln. Wir bringen Beobachtungen aus den Teams und Anforderungen der Führung zusammen, machen Handlungsfelder sichtbar und entwickeln konkrete, praktikable Vorschläge.
        - Wir übernehmen Verantwortung für deren Ausarbeitung, Einführung und operative Begleitung. Dazu gehört, Hindernisse anzusprechen, Rückmeldungen aus dem Alltag aufzunehmen und Verbesserungen nachzuschärfen. Die Entscheidung über Prioritäten, Kapazitäten und verbindliche Erwartungen bleibt beim Management – und wird von uns aktiv eingefordert, wenn sie für die Umsetzung notwendig ist.
      transfer:
        title: Was diese Erfahrung für andere Organisationen relevant macht.
        paragraphs:
        - Organisationsentwicklung endet nicht mit einer Guideline oder einem guten Workshop. Sie wird dort wirksam, wo Führung die nötigen Voraussetzungen schafft und Teams Veränderungen in ihre tägliche Arbeit übernehmen können.
        - Deshalb verbinden wir bei mehr.wert übergreifende Orientierung mit konkreter Unterstützung in der Umsetzung. Gute Methoden helfen – entscheidend ist, ob sie in der jeweiligen Organisation tatsächlich einen Unterschied machen.
      closing:
        title: Ihre Teams arbeiten engagiert – aber noch nicht gut genug zusammen?
        paragraphs:
        - Wenn Standards uneinheitlich sind, Übergaben Zeit kosten oder Verbesserungen nicht im Alltag ankommen, lohnt es sich, die Ursachen gemeinsam zu betrachten. Wir helfen, passende Grundlagen zu entwickeln und ihre Anwendung zu begleiten.
        links:
        - title: Organisation & Software-Delivery
          url: "/services/agile-transformation-coaching.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Vom gemeinsamen Verständnis zur Anwendung im Squad.
        items:
        - title: Teams und Verantwortliche miteinander verbinden
          text: Mit einer Community of Practice ist ein Ort entstanden, an dem Erfahrungen aus den Squads zusammenkommen und gemeinsame Arbeitsweisen weiterentwickelt werden. Die Beteiligten prüfen Vorschläge, bringen ihre Sicht ein und tragen die Ergebnisse in die Teams zurück.
        - title: Arbeit und Qualität verständlicher machen
          text: Wir haben unter anderem gemeinsame Grundlagen für Anforderungs- und Change-Tickets, Backlog-Vorbereitung, Refinement, relative Schätzung und die Definition of Done erarbeitet und veröffentlicht. Damit werden Erwartungen an vorbereitete Arbeit und an fertige Ergebnisse über Squad-Grenzen hinweg nachvollziehbarer.
        - title: Anwendung unterstützen und Fortschritt sichtbar machen
          text: Die Einführung begleiten wir durch direkte Zusammenarbeit mit Squads, gezielte Trainings und einen strukturierten Blick auf bestehende Arbeitsweisen. Ein Agile Assessment hilft, Unterschiede und Hindernisse zu erkennen und Verbesserungen zu priorisieren. Rückmeldungen aus der Praxis fließen in die nächsten Schritte ein.
        intro: 'Wir haben bewusst an den Stellen angesetzt, an denen ein gemeinsamer Rahmen die tägliche Arbeit erleichtern kann. Die Maßnahmen ergänzen sich: Austausch, konkrete Qualitätsgrundlagen und Rückmeldung über ihren Nutzen.'
      results:
        title: Was bereits entstanden ist.
        items:
        - title: Ein organisierter Austausch über Squad-Grenzen hinweg
          text: Die Community of Practice bringt unterschiedliche Rollen und Teams an einen Tisch. Sie bildet den Rahmen, um Erfahrungen zu bündeln und gemeinsame Arbeitsweisen nicht isoliert in einzelnen Squads zu entwickeln.
        - title: Nutzbare Arbeits- und Qualitätsgrundlagen
          text: 'Vorlagen und Leitlinien sind dokumentiert, vorgestellt und werden in ersten Squads aufgegriffen. Wie schnell aus einer gemeinsamen Orientierung praktische Anwendung werden kann, zeigte sich etwa nach einem Story-Point-Training: Ein Squad nutzte die Methode bereits am folgenden Tag eigeninitiativ im Refinement.'
        - title: Eine Grundlage für gezielte Weiterentwicklung
          text: Mit einer strukturierten Bestandsaufnahme und Feedback aus den Teams lassen sich die nächsten Verbesserungen bewusster auswählen. Die tatsächliche Wirkung auf die Software-Delivery wird im weiteren Verlauf überprüft und ist nicht allein aus der Einführung gemeinsamer Standards abzuleiten.
        intro: Die gemeinsamen Grundlagen sind erarbeitet und erste Anwendungen im Alltag sichtbar. Die organisationsweite Verankerung ist ein weiterer Schritt, den wir aktiv begleiten.
      process:
        title: Gemeinsame Arbeitsweisen entstehen im Zusammenspiel.
        steps:
        - Führung, Projekte & Releases
        - Gemeinsame Grundlagen & Community of Practice
        - Anwendung & Feedback aus den Squads
        feedback: Prioritäten, gemeinsame Vereinbarungen und praktische Erfahrungen werden regelmäßig aufeinander abgestimmt.
        caption: Vereinfachte Darstellung der Zusammenarbeit zwischen Steuerung, Community of Practice und Squads.
        intro: Übergreifende Vereinbarungen schaffen erst dann Nutzen, wenn sie in den Teams verstanden und angewandt werden – und Erfahrungen aus der täglichen Arbeit wieder zurückfließen.
        mode: exchange
    hugo-boss:
      publication_status: draft
      hero:
        eyebrow: KUNDENMANDAT · MEHR.WERT
        title: Roadmap für KI-gestützte Softwareentwicklung
        lead: Die Möglichkeiten von KI im Softwareentwicklungsprozess gemeinsam einordnen, Prioritäten klären und daraus eine tragfähige Richtung für die nächsten Schritte entwickeln.
        context: Strategischer Team-Workshop · Software Development Lifecycle · 2026
      situation:
        title: Viele gute Ideen brauchen eine gemeinsame Richtung.
        paragraphs:
        - Ein erfahrenes, technologiebegeistertes Team wollte neue Möglichkeiten für den Software Development Lifecycle erschließen. Fachliche Expertise und Innovationsfreude waren vorhanden. Die Herausforderung lag darin, individuelle Perspektiven auf ein gemeinsames Ziel auszurichten und zu klären, welchen konkreten Nutzen die geplanten Veränderungen für ihre Zielgruppen schaffen sollten.
        - 'KI eröffnete neue Optionen. Aber bevor Werkzeuge ausgewählt oder Lösungen gebaut werden, braucht es Antworten auf grundlegende Fragen: Für wen entwickeln wir? Welches Problem wollen wir lösen? Was hat Priorität – und woran erkennen wir später, dass sich der eingeschlagene Weg lohnt?'
      role:
        title: 'Unsere Aufgabe: Orientierung schaffen und Ideen konstruktiv hinterfragen.'
        paragraphs:
        - mehr.wert hat den strategischen Workshop konzipiert, vorbereitet und moderiert. Wir waren dabei nicht für die technische Implementierung verantwortlich, sondern für einen Arbeitsrahmen, in dem ein erfahrenes Team seine Vorstellungen bündeln und konkrete Entscheidungen vorbereiten konnte.
        - Dazu gehörten gezielte Fragen, kritisches Sparring und die Fähigkeit, Themen im Verlauf aufzunehmen, ohne das gemeinsame Ergebnis aus dem Blick zu verlieren. Unser Anspruch war, dass aus dem Austausch mehr entsteht als eine Sammlung interessanter Ideen.
      transfer:
        title: Was diese Erfahrung für neue Technologievorhaben relevant macht.
        paragraphs:
        - Wenn KI oder andere technologische Entwicklungen neue Möglichkeiten eröffnen, entstehen schnell viele Ideen. Die schwierigere Frage ist häufig, welche davon zu den Zielen, Menschen und Möglichkeiten eines Unternehmens passen.
        - Unsere Arbeit verbindet deshalb technische Neugier mit strategischer Klarheit. Wir helfen, Chancen einzuordnen, gemeinsam eine Richtung zu entwickeln und die nächsten Schritte so vorzubereiten, dass ein Team eigenständig damit weiterarbeiten kann.
      closing:
        title: Sie möchten neue Technologien sinnvoll in Ihre IT-Arbeit einordnen?
        paragraphs:
        - Sprechen wir darüber, welches Ziel Sie erreichen wollen, welche Fragen noch offen sind und wie aus verschiedenen Ideen ein gemeinsamer Weg entstehen kann.
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Organisation & Software-Delivery
          url: "/services/agile-transformation-coaching.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Vom Team-Purpose zu konkreten nächsten Schritten.
        items:
        - title: Auftrag und Zielgruppe schärfen
          text: Die Beteiligten haben ihre Sicht auf das Vorhaben zusammengebracht und besprochen, welchen Beitrag das Team mit seiner Arbeit leisten soll. Damit konnten unterschiedliche Erwartungen offengelegt und auf ein gemeinsames Verständnis ausgerichtet werden.
        - title: Nutzen und Prioritäten gemeinsam bewerten
          text: Technologische Ideen – darunter KI-gestützte Ansätze im Entwicklungsprozess – wurden mit dem erwarteten Kundennutzen und den organisatorischen Voraussetzungen verbunden. Nicht jede spannende Möglichkeit musste sofort Teil des nächsten Schritts werden.
        - title: Eine Roadmap erarbeiten
          text: Aus den gemeinsamen Überlegungen entstand eine nachvollziehbare Richtung mit priorisierten Themen und nächsten Schritten. Die Roadmap schafft Orientierung für die weitere Arbeit und lässt Raum, Annahmen im praktischen Einsatz zu überprüfen.
        intro: 'Als Orientierung dienten fünf grundlegende Managementfragen: Was ist unser Auftrag? Für wen arbeiten wir? Welchen Nutzen schaffen wir? Woran messen wir Fortschritt? Wie gehen wir vor? Diese Fragen haben geholfen, technische Möglichkeiten an der tatsächlichen Aufgabe des Teams auszurichten.'
      results:
        title: Was der Workshop konkret gebracht hat.
        items:
        - title: Eine gemeinsame Sicht auf das Vorhaben
          text: Das Team konnte Ziele und Erwartungen zusammenführen. In der Rückmeldung aus der Zusammenarbeit wurde ausdrücklich bestätigt, dass der Workshop geholfen hat, eine gemeinsame Projektsicht zu entwickeln.
        - title: Eine strukturierte Roadmap
          text: Die Beteiligten erarbeiteten eine Roadmap für die nächsten Schritte. Auch ihr Nutzen wurde durch das Kundenfeedback ausdrücklich bestätigt. Damit stand ein konkretes Arbeitsergebnis zur Verfügung, an dem sich die weitere Entwicklung orientieren konnte.
        intro: Der Wert des Workshops lag nicht in einer neuen Methode, sondern in gemeinsam erarbeiteter Orientierung und einer Grundlage für die weitere Arbeit.
      process:
        title: Neue Technologien brauchen zuerst gute Entscheidungen.
        steps:
        - Auftrag & Zielgruppe
        - Nutzen & Prioritäten
        - Roadmap & nächste Schritte
        feedback: Eine gemeinsame Richtung verbindet technologische Optionen, Teamverantwortung und konkrete Umsetzungsschritte.
        caption: Vereinfachte Darstellung der strategischen Klärung im Workshop.
        intro: Der Weg von einer technologischen Möglichkeit zu einem sinnvollen Vorhaben beginnt mit einer gemeinsamen Vorstellung davon, wofür sie eingesetzt werden soll.
        mode: flow
    mobile-fertigungslogistik:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Mobile Fertigungslogistik in der Landmaschinenproduktion
        lead: Produktionsabläufe verstehen, eine mobile Lösung dafür gestalten und sie unter den tatsächlichen Bedingungen der Fertigung in Betrieb bringen.
        context: Android-Anwendung · Prozessverständnis · Technische Koordination · Einführung vor Ort
      situation:
        title: Das richtige Teil muss zur richtigen Zeit am richtigen Platz sein.
        paragraphs:
        - In der Landmaschinenfertigung müssen Vormontage und Hauptfertigung eng aufeinander abgestimmt sein. Benötigte Komponenten sollen dort verfügbar sein, wo sie im Produktionsablauf als Nächstes gebraucht werden. Dafür müssen Informationen über Anforderungen und Bereitstellung zuverlässig zwischen den beteiligten Bereichen ankommen.
        - Die Aufgabe bestand darin, diese Abstimmung mit einer mobilen Anwendung zu unterstützen. Die Lösung musste zu den vorhandenen Abläufen passen – und auch dort praxistauglich sein, wo die Netzwerkverbindung in der Produktion nicht durchgehend stabil war.
      role:
        title: 'Meine Aufgabe: Produktionsrealität und mobile Technik verbinden.'
        paragraphs:
        - In einer früheren beruflichen Rolle habe ich an der technischen Konzeption und Steuerung einer Android-Lösung für diesen Fertigungsprozess mitgearbeitet. Gemeinsam mit den Beteiligten wurden Abläufe verstanden, Anforderungen konkretisiert und die Benutzerführung sowie die technische Architektur auf den Einsatz in der Produktion ausgerichtet.
        - Neben der Entwicklungskoordination gehörte die Zusammenarbeit mit internationalen Entwicklungspartnern dazu. Wichtig war mir, die Anwendung nicht allein aus der Distanz zu planen, sondern ihre Einführung auch direkt im Produktionsumfeld zu begleiten.
      transfer:
        title: Was diese Erfahrung in meiner heutigen Arbeit wertvoll macht.
        paragraphs:
        - Eine technische Lösung ist erst dann gut, wenn sie dort funktioniert, wo sie gebraucht wird. Dazu muss man verstehen, welche Abläufe sie unterstützt, welche Einschränkungen vor Ort gelten und was Betrieb und Weiterentwicklung langfristig bedeuten.
        - 'Diese Erfahrung bringe ich heute bei mehr.wert in Strategie- und Modernisierungsfragen ein: Architekturentscheidungen nicht losgelöst vom Geschäftsprozess betrachten und eine realistische Umsetzung von Anfang an mitdenken.'
      closing:
        title: Ihre Software muss unter anspruchsvollen Bedingungen funktionieren?
        paragraphs:
        - 'Ob Produktion, Logistik oder ein anderer geschäftskritischer Ablauf: Wir sprechen gerne darüber, wie technische Anforderungen und die Realität Ihrer Organisation zusammenpassen.'
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Eine gute App beginnt mit dem Verständnis der Arbeit vor Ort.
        items:
        - title: Arbeitsabläufe und Informationsbedarf verstehen
          text: Welche Informationen benötigen Vormontage und Hauptfertigung, und wann werden sie gebraucht? Diese Fragen bildeten die Grundlage, um Funktionen und Bedienung an den tatsächlichen Produktionsschritten auszurichten.
        - title: Mobile Architektur alltagstauglich gestalten
          text: Für die Android-Anwendung wurden Benutzerführung und technische Umsetzung an die Arbeitsumgebung angepasst. Weil WLAN nicht überall zuverlässig verfügbar war, musste die Anwendung auch mit Unterbrechungen umgehen können. Lokale Zwischenspeicherung war dabei ein wichtiger technischer Baustein.
        - title: Entwicklung koordinieren und Einführung begleiten
          text: Die Umsetzung wurde technisch begleitet und mit den beteiligten Entwicklungspartnern abgestimmt. Die Einführung vor Ort half, die Anwendung am tatsächlichen Arbeitsplatz zu überprüfen und mit den Abläufen der Fertigung zusammenzubringen.
        intro: In diesem Vorhaben standen die konkreten Bedingungen der Fertigung im Mittelpunkt. Die technische Lösung musste den Prozess unterstützen, statt den Menschen zusätzliche Arbeit zu machen.
      results:
        title: Was aus dem Vorhaben entstanden ist.
        items:
        - title: Eine produktiv eingesetzte Android-Anwendung
          text: Die Lösung unterstützte die Abstimmung zwischen Vormontage und Hauptfertigung in einer Fertigungslinie. Die mobile Anwendung wurde nicht nur konzipiert, sondern in die praktische Arbeit eingeführt.
        - title: Technik für reale Einsatzbedingungen
          text: Die Architektur berücksichtigte die unvollständige Netzwerkabdeckung in der Produktion. So wurde eine betriebliche Randbedingung frühzeitig Teil der technischen Lösung.
        intro: Aus der gemeinsamen Arbeit an Prozessen und Technik entstand eine Android-Anwendung, die im Produktionsumfeld eingeführt und genutzt wurde.
      process:
        title: Mobile Informationen verbinden zwei Fertigungsbereiche.
        steps:
        - Vormontage
        - Mobile Android-Anwendung
        - Hauptfertigung
        feedback: Informationen zu Fertigungsaufgaben werden entlang des Prozesses mobil unterstützt.
        caption: Vereinfachte Darstellung der mobilen Unterstützung zwischen Vormontage und Hauptfertigung.
        intro: Die Anwendung unterstützt den Informationsfluss zwischen Arbeitsschritten. Entscheidend ist, dass die benötigten Daten auch unter wechselnden Bedingungen verfügbar bleiben.
        mode: flow
        middle_note: Lokale Zwischenspeicherung bei Verbindungsunterbrechungen
    mobile-scanning-bibliothek:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Eine eigene Barcode-Scanning-Bibliothek für Store-Apps
        lead: Eine kostenpflichtige Softwarekomponente durch eine native iOS-Lösung ersetzen – und dabei technische Qualität, Integration und langfristige Abhängigkeiten gemeinsam betrachten.
        context: HUGO BOSS · Mobile Anwendungen im Handel · iOS
      situation:
        title: Wenn eine kleine Komponente dauerhaft abhängig macht.
        paragraphs:
        - Für mobile Store-Anwendungen gehört das Scannen von Barcodes und QR-Codes zu den praktischen Funktionen im Alltag. Im damaligen HUGO-BOSS-Umfeld wurde dafür eine lizenzpflichtige Bibliothek eines externen Anbieters eingesetzt.
        - Die Aufgabe war, eine geeignete Alternative zu schaffen, die sich in die bestehenden iOS-Anwendungen einfügt. Dabei ging es nicht allein darum, dieselbe Funktion anders zu implementieren. Auch Aufwand, Wartbarkeit und die langfristige Abhängigkeit von externen Komponenten spielten eine Rolle.
      role:
        title: Technische Entscheidungen im Produkt- und Teamkontext beurteilen.
        paragraphs:
        - Das Vorhaben entstand während meiner früheren beruflichen Tätigkeit im Web- und Mobile-Umfeld von HUGO BOSS. In diesem Umfeld gehörten technische Produktentscheidungen und die Zusammenarbeit in der Entwicklung zu meinem Verantwortungsbereich.
        - Die Scanning-Bibliothek war eine technische Arbeit des damaligen Teams. Gerade solche Entscheidungen zeigen, dass eine scheinbar kleine Funktion Auswirkungen auf Lizenzierung, Integration und spätere Weiterentwicklung haben kann.
      transfer:
        title: Was diese Erfahrung für heutige Technologieentscheidungen zeigt.
        paragraphs:
        - Die Wahl einer Bibliothek mag klein wirken. Über Jahre beeinflusst sie aber, wie unabhängig ein Produkt weiterentwickelt werden kann, welche Kosten entstehen und wer Probleme beheben muss.
        - 'Bei mehr.wert betrachten wir deshalb auch solche Entscheidungen im Zusammenhang: Was passt langfristig zur Anwendung, welche Risiken bringt eine Abhängigkeit mit sich – und wann ist es sinnvoll, eine Komponente selbst zu verantworten?'
      closing:
        title: Stehen Sie vor einer schwierigen Technologie- oder Anbieterentscheidung?
        paragraphs:
        - 'Ob bestehende Bibliothek, Standardsoftware oder eigene Lösung: Wir helfen, Alternativen nüchtern zu bewerten und Entscheidungen an den tatsächlichen Anforderungen auszurichten.'
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Eine Alternative entwickeln, die zu den bestehenden Anwendungen passt.
        items:
        - title: Abhängigkeit und Anforderungen verstehen
          text: Die bisherige Scan-Funktion war an eine kostenpflichtige Bibliothek gebunden. Für eine Ablösung mussten die benötigten Funktionen und die Einbindung in die Store-Anwendungen betrachtet werden.
        - title: Native Scanning-Komponente bereitstellen
          text: Im Entwicklungsteam entstand mit HBScanner eine eigene iOS-Bibliothek für das Scannen von Barcodes und QR-Codes. Sie bildete die technische Alternative zur externen Komponente.
        - title: In vorhandene Apps integrieren
          text: Die neue Bibliothek wurde in bestehende Anwendungen eingebunden. Damit konnte die bisherige Drittanbieterkomponente ersetzt und die damit verbundene Lizenzabhängigkeit beendet werden.
        intro: Entscheidend war, die Scan-Funktion im vorhandenen Produktkontext abzulösen – ohne aus einer einzelnen Komponente ein eigenes großes Modernisierungsvorhaben zu machen.
      results:
        title: Was konkret verändert wurde.
        items:
        - title: Eine integrierte eigene iOS-Bibliothek
          text: Mit HBScanner entstand eine native Alternative, die in vorhandene Store-Anwendungen integriert wurde. Die Scan-Funktion blieb damit Bestandteil der eingesetzten Apps.
        - title: Weniger Abhängigkeit von einer Fremdkomponente
          text: Die externe Scanning-Bibliothek wurde ersetzt und ihre kostenpflichtige Lizenz nicht weiter benötigt. Damit änderte sich die technische Abhängigkeit; die Verantwortung für die eigene Lösung lag nun stärker im Produktumfeld selbst.
      process:
        title: Eine Funktion bleibt. Die technische Abhängigkeit verändert sich.
        steps: []
        feedback: Die Barcode- und QR-Code-Erfassung bleibt Teil der App; die zugrunde liegende Komponente wird ersetzt.
        caption: Vereinfachter Vergleich der technischen Einbindung vor und nach der Ablösung.
        intro: Für Nutzer muss ein Wechsel der technischen Grundlage nicht zwangsläufig sichtbar sein. Für die Weiterentwicklung eines Produkts kann er dennoch wichtig sein.
        mode: comparison
        comparison:
        - title: Vorher
          text: Store-App → kostenpflichtige externe Scanning-Bibliothek
        - title: Danach
          text: Store-App → eigene native iOS-Scanning-Bibliothek
  portfolio_cases:
    duecker:
      publication_status: draft
      hero:
        eyebrow: KUNDENMANDAT · MEHR.WERT
        title: Eine geschäftskritische Softwareplattform modernisieren
        lead: Gewachsene Software zukunftsfähig weiterentwickeln – indem Fachbereiche und Entwicklung eine gemeinsame Grundlage für Entscheidungen und Umsetzung schaffen.
        context: Laufendes Modernisierungsvorhaben · Fachliche und technische Zusammenarbeit · IT-Strategie
      situation:
        title: Die Anwendung ist unverzichtbar. Das Wissen darüber ist verteilt.
        paragraphs:
        - Wenn eine Software über viele Jahre das Geschäft unterstützt, steckt in ihr häufig weit mehr als Programmcode. Gewachsene Abläufe, fachliche Entscheidungen und Sonderregeln sind Teil des täglichen Betriebs. Nicht alles davon ist außerhalb der Anwendung vollständig dokumentiert.
        - In diesem Vorhaben kamen unterschiedliche Bereiche mit ihren eigenen Perspektiven auf die bestehende Plattform zusammen. Ein übergreifend geteiltes Domänenverständnis und ein gemeinsamer Modernisierungsweg mussten erst entstehen. Die Aufgabe bestand darin, notwendige Veränderungen vorzubereiten, ohne das wertvolle Wissen aus dem heutigen System zu verlieren.
      role:
        title: 'Unsere Aufgabe: die Beteiligten zusammenbringen und Modernisierung konkret vorbereiten.'
        paragraphs:
        - Wir begleiten das Unternehmen bei der fachlichen und strategischen Vorbereitung seiner Softwaremodernisierung. Dazu verbinden wir die Perspektiven der Fachbereiche mit denen der Entwicklung, strukturieren die offenen Fragen und unterstützen dabei, aus unterschiedlichen Vorstellungen eine gemeinsam getragene Richtung zu entwickeln.
        - Ein wichtiger Teil unserer Verantwortung ist, die Arbeitsergebnisse so aufzubereiten, dass sie über die Abstimmung hinaus für die weitere Entwicklung verwendbar werden. Die technische Umsetzung liegt bei den beteiligten Entwicklungsteams. mehr.wert begleitet die vereinbarte Modernisierungsarbeit und sorgt für die Verbindung zwischen fachlicher Klärung und Umsetzungsvorbereitung.
      transfer:
        title: Was diese Erfahrung für andere Modernisierungsvorhaben relevant macht.
        paragraphs:
        - Der schwierigste Teil einer Modernisierung ist nicht immer die neue Technologie. Häufig muss zuerst verstanden werden, weshalb eine bestehende Anwendung so funktioniert, wie sie funktioniert – und welche fachlichen Abhängigkeiten daran hängen.
        - Genau deshalb betrachten wir IT-Strategie, Fachdomäne und Umsetzung gemeinsam. Wir helfen, einen verantwortbaren Weg zu entwickeln und die Grundlagen zu schaffen, damit Veränderungen nicht bei einer Zielarchitektur auf dem Papier stehen bleiben.
      closing:
        title: Steht bei Ihnen eine geschäftskritische Anwendung vor Veränderungen?
        paragraphs:
        - 'Ob Modernisierung, schrittweise Weiterentwicklung oder Ablösung: Entscheidend ist zunächst ein klares Verständnis der Ausgangslage. Sprechen wir darüber, welche Entscheidungen in Ihrem Vorhaben anstehen.'
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Erst verstehen, was erhalten bleiben muss. Dann den nächsten Schritt festlegen.
        items:
        - title: Ein gemeinsames Domänenverständnis schaffen
          text: Beteiligte aus zuvor getrennt arbeitenden Bereichen kamen zusammen, um Geschäftsabläufe, Begriffe und Zusammenhänge gemeinsam zu betrachten. So konnten unterschiedliche Sichtweisen geklärt und ein gemeinsames Verständnis der fachlichen Anforderungen aufgebaut werden.
        - title: Bestehende Geschäftsregeln zugänglich machen
          text: Wichtige fachliche Regeln waren in der bestehenden Software verankert. Wir haben diese Regeln herausgearbeitet, strukturiert und an die Entwicklung übergeben. Damit wurde Wissen aus dem Bestand zu einer konkreten Grundlage für die nächsten technischen Schritte.
        - title: Einen tragfähigen Modernisierungsweg abstimmen
          text: Auf dieser Grundlage wurde gemeinsam eine Modernisierungsstrategie erarbeitet. Sie verbindet die fachlichen Anforderungen mit den Möglichkeiten der Umsetzung und schafft Orientierung dafür, wie das Vorhaben schrittweise weitergeführt werden kann.
        intro: Im Mittelpunkt stand keine vorschnelle Entscheidung für eine neue Technologie. Wir haben an den Grundlagen gearbeitet, die eine fundierte Modernisierung überhaupt erst möglich machen.
      results:
        title: Was bereits entstanden ist.
        items:
        - title: Ein geteiltes Verständnis der Fachdomäne
          text: Zuvor getrennte Bereiche haben ihre Perspektiven zusammengeführt und ein gemeinsames Verständnis der Abläufe und Anforderungen erarbeitet. Damit gibt es eine bessere Basis für fachliche Abstimmungen und weitere Entscheidungen.
        - title: Eine abgestimmte Modernisierungsrichtung
          text: Die Beteiligten haben einen gemeinsamen Weg für die weitere Entwicklung der Plattform definiert. Er gibt dem Vorhaben Orientierung, ohne die konkreten Umsetzungsschritte vorwegzunehmen.
        - title: Geschäftsregeln für die Entwicklung aufbereitet
          text: Fachliche Regeln aus der bestehenden Anwendung wurden erschlossen und an die Entwicklung übergeben. Dieses Material kann bei der schrittweisen Weiterentwicklung helfen, bewährtes Verhalten nachvollziehbar zu erhalten.
        intro: Die Modernisierung ist ein laufendes Vorhaben. Wesentliche Grundlagen für die weiteren Schritte wurden bereits gemeinsam geschaffen.
      process:
        title: Fachliches Wissen wird zur Grundlage der Umsetzung.
        steps:
        - Fachbereiche & bestehende Anwendung
        - Gemeinsames Domänenverständnis
        - Modernisierungsstrategie & nutzbare Geschäftsregeln
        feedback: Fachliches Wissen wird gemeinsam verstanden, strukturiert und für die weitere Entwicklung verfügbar gemacht.
        caption: Vereinfachte Darstellung der fachlichen Vorbereitung einer Softwaremodernisierung.
        mode: flow
        intro: Die Verbindung von Fachbereichen und Entwicklung ist kein zusätzlicher Abstimmungsschritt. Sie ist Voraussetzung dafür, dass bei der Modernisierung die richtigen Dinge erhalten und verändert werden.
    mywork-produktverantwortung:
      publication_status: draft
      hero:
        eyebrow: EIGENES PRODUKT · MARCEL RUSS
        title: myWork – Mobile Zeiterfassung
        lead: Eine iOS-App, mit der sich Arbeitszeiten und Projekte erfassen lassen – und die ich von der ersten Idee an über viele Jahre selbst entwickelt und verantwortet habe.
        context: iOS-Softwareprodukt · Konzeption, Entwicklung, Betrieb und Weiterentwicklung
      situation:
        title: Aus einem eigenen Bedarf wurde ein Softwareprodukt.
        paragraphs:
        - Die Idee zu myWork entstand aus dem Wunsch, Arbeitszeiten und Projekte einfacher zu erfassen. Aus einer zunächst persönlichen Aufgabenstellung entwickelte sich während meines Studiums eine mobile Anwendung, die ich veröffentlichte und anschließend kontinuierlich weiterentwickelte.
        - Entscheidend war dabei nicht nur, dass die App ihre Aufgaben erfüllt. Sie sollte im Alltag gut bedienbar bleiben, neue Anforderungen aufnehmen können und über mehrere technische Generationen hinweg zuverlässig weitergeführt werden. Damit wurde myWork für mich früh zu einer praktischen Erfahrung in langfristiger Produktverantwortung.
      role:
        title: Bei myWork endet meine Verantwortung nicht mit dem Release.
        paragraphs:
        - Ich habe myWork konzipiert, gestaltet und selbst entwickelt. Architektur, technische Umsetzung und Veröffentlichung gehören ebenso dazu wie Wartung, Qualitätssicherung, Support und Entscheidungen über neue Funktionen oder notwendige Anpassungen.
        - Anders als bei einem zeitlich begrenzten Projekt trage ich die Folgen früherer Entscheidungen selbst weiter. Was heute schnell umgesetzt ist, kann morgen aufwendig zu warten sein. Was technisch elegant wirkt, muss sich zugleich im Alltag der Nutzer bewähren. Diese beiden Perspektiven gehören für mich untrennbar zusammen.
      transfer:
        title: Warum diese Erfahrung meine heutige Beratung prägt.
        paragraphs:
        - Wer eigene Software über viele Jahre trägt, betrachtet technische Entscheidungen anders. Architektur und Wartbarkeit, Bedienung und Betriebskosten, neue Funktionen und vorhandene Abhängigkeiten lassen sich nicht isoliert voneinander bewerten.
        - Diese Produktperspektive bringe ich in die Arbeit von mehr.wert ein. Bei IT-Strategie und Modernisierung frage ich nicht nur, was technisch möglich ist, sondern auch, welche Lösung dauerhaft betrieben, verändert und wirtschaftlich verantwortet werden kann.
      closing:
        title: Sie möchten Software langfristig zukunftsfähig halten?
        paragraphs:
        - 'Ob Sie eine bestehende Anwendung weiterentwickeln oder grundlegende Technologieentscheidungen treffen müssen: Ein Blick auf den gesamten Lebenszyklus hilft, den passenden Weg zu wählen.'
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Ein Produkt weiterentwickeln heißt, viele Perspektiven zusammenzubringen.
        items:
        - title: Einfach nutzbare Funktionen gestalten
          text: 'Am Anfang steht die Aufgabe der Nutzer: Zeiten und Projekte ohne unnötige Umwege erfassen zu können. Daraus ergeben sich Anforderungen an Informationsstruktur, Bedienung und das Zusammenspiel der Funktionen – nicht nur an die technische Implementierung.'
        - title: Architektur und Technologien weiterentwickeln
          text: myWork wurde über mehrere iOS-Technologiegenerationen hinweg gepflegt. Dazu gehörte die Entwicklung mit Objective-C und Swift sowie die Arbeit mit Apple-Technologien für lokale und cloudbezogene Datenhaltung. Jede Weiterentwicklung muss zum bestehenden Produkt und seinen Daten passen.
        - title: Betrieb, Qualität und Rückmeldungen berücksichtigen
          text: 'Mit einer Veröffentlichung beginnt der nächste Teil der Arbeit: Probleme verstehen, Rückmeldungen einordnen, Support leisten und Verbesserungen planen. So fließen die Erfahrungen aus der tatsächlichen Nutzung wieder in Produkt- und Technologieentscheidungen ein.'
        intro: Über die Jahre hat sich nicht nur die App verändert. Auch Plattformtechnologien, Erwartungen an die Bedienung und Anforderungen an die technische Pflege entwickeln sich weiter.
      results:
        title: Was aus der eigenen Produktarbeit entstanden ist.
        items:
        - title: Ein eigenständig entwickeltes iOS-Produkt
          text: Aus einer Idee entstand eine veröffentlichte App zur mobilen Zeit- und Projekterfassung, deren Konzeption und technische Umsetzung ich selbst verantwortet habe.
        - title: Langfristige technische Verantwortung
          text: Die Anwendung wurde über Jahre weiterentwickelt und betreut. Technische Entscheidungen mussten deshalb nicht nur für den nächsten Release, sondern auch für Wartung und künftige Änderungen tragfähig sein.
        - title: Direkter Kontakt zur Nutzerperspektive
          text: Betrieb und Support machen sichtbar, wo Software im Alltag funktioniert und wo sie Fragen aufwirft. Diese Rückmeldungen fließen in die laufende Produktarbeit ein.
      process:
        title: Aus Nutzung wird Erfahrung. Aus Erfahrung wird Weiterentwicklung.
        steps:
        - Bedarf & Produktidee
        - Entwicklung & Veröffentlichung
        - Nutzung, Betrieb & Support
        - Rückmeldungen & Weiterentwicklung
        feedback: Erkenntnisse aus der Nutzung fließen in die nächste Produktentscheidung zurück.
        caption: Vereinfachter Kreislauf der langfristigen Produktentwicklung.
        mode: cycle
        intro: Ein Softwareprodukt ist kein einmaliges Lieferergebnis. Es entwickelt sich im Zusammenspiel mit seinen Nutzern und den technischen Möglichkeiten weiter.
    technische-fuehrung-web-mobile:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Web- und Mobile-Entwicklung bei HUGO BOSS führen
        lead: Digitale Produkte und Entwicklungsteams verantworten – und dabei technische Qualität, Menschen und organisatorische Zusammenarbeit zusammenbringen.
        context: HUGO BOSS · Team Lead Web & Mobile · 2018–2022
      situation:
        title: Digitale Produkte brauchen mehr als gute Einzelentscheidungen.
        paragraphs:
        - 'Die Arbeit an Web- und Mobile-Produkten verbindet viele Perspektiven: technische Entwicklung, fachliche Anforderungen, Nutzererlebnis, Produktentscheidungen und den laufenden Betrieb. In einer internationalen Organisation kommen unterschiedliche Teams, Standorte und Partner hinzu.'
        - Für technische Führung bedeutet das, nicht nur einzelne Entwicklungsaufgaben zu koordinieren. Es braucht eine gemeinsame Richtung für Produkte und Teams sowie Entscheidungen, die zu den Zielen des Unternehmens und den Möglichkeiten der Entwicklung passen.
      role:
        title: 'Meine Rolle: Verantwortung für Teams, Produkte und technische Entscheidungen.'
        paragraphs:
        - Bei HUGO BOSS habe ich mehrere Jahre die Web- und Mobile-Entwicklung geführt. Zu meiner Aufgabe gehörten die fachliche und disziplinarische Führung von Mitarbeitenden, die Verantwortung für digitale Produkte sowie die technische Abstimmung mit den Beteiligten.
        - Ich habe dabei unmittelbar erlebt, wie eng Technologie und Führung zusammenhängen. Produktentscheidungen beeinflussen die Arbeit der Teams; technische Abhängigkeiten wirken sich auf Prioritäten und Möglichkeiten aus. Umgekehrt entscheidet gute Zusammenarbeit darüber mit, ob aus einer Idee eine tragfähige Lösung wird.
      transfer:
        title: Warum diese Zeit meine heutige Arbeit prägt.
        paragraphs:
        - In Beratungsmandaten ist es leicht, über Prozesse, Architektur oder Führung zu sprechen, ohne ihre alltäglichen Spannungen selbst tragen zu müssen. Aus meiner Zeit als Entwickler und Teamleiter kenne ich diese Spannungen aus eigener Verantwortung.
        - Bei mehr.wert hilft mir diese Erfahrung, technische Entscheidungen und organisatorische Veränderungen gemeinsam zu betrachten. Ich kann die Perspektiven von Management, Produktverantwortlichen und Entwicklungsteams miteinander verbinden und Veränderungen so begleiten, dass sie unter realen Arbeitsbedingungen funktionieren können.
      closing:
        title: Technische Führung und Software-Delivery gemeinsam weiterentwickeln?
        paragraphs:
        - Wenn Teams, Produkte und Technologieentscheidungen eng zusammenhängen, hilft ein Blick auf das gesamte System. Sprechen wir darüber, wo Führung und Zusammenarbeit in Ihrer IT-Organisation wirksamer werden können.
        links:
        - title: Organisation & Software-Delivery
          url: "/services/agile-transformation-coaching.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Technologie, Produkte und Menschen gemeinsam im Blick behalten.
        items:
        - title: Technische Richtung geben
          text: Technische Entscheidungen vorbereiten und abstimmen, die Weiterentwicklung von Web- und Mobile-Anwendungen begleiten und Architektur- sowie Qualitätsfragen mit den Produktanforderungen verbinden. Konkrete Themen in diesem Umfeld reichten von wiederverwendbaren UI-Bausteinen bis zum bewussten Umgang mit Drittanbieterabhängigkeiten in mobilen Anwendungen.
        - title: Digitale Produkte verantworten
          text: Produktziele, Anforderungen und technische Umsetzung miteinander verbinden. Dabei geht es nicht nur um neue Funktionen, sondern auch um tragfähige Entscheidungen für Pflege, Weiterentwicklung und den laufenden Betrieb.
        - title: Teams führen und Zusammenarbeit ermöglichen
          text: Mitarbeitende fachlich und disziplinarisch führen, Abstimmungen zwischen Teams und Standorten gestalten und interne sowie externe Entwicklungspartner in die gemeinsame Arbeit einbeziehen.
        intro: Diese Verantwortung ließ sich nicht in getrennte technische und organisatorische Aufgaben aufteilen. Die drei Perspektiven gehörten im Alltag zusammen.
      results:
        title: Führung aus der Nähe zur Softwareentwicklung.
        items:
        - title: Mehrjährige Teamführung
          text: Ich habe Web- und Mobile-Teams über mehrere Jahre geführt und dabei fachliche Aufgaben, Personalverantwortung und Zusammenarbeit miteinander verbunden.
        - title: Technische und produktbezogene Verantwortung
          text: Entscheidungen über Technologie und digitale Produkte waren Teil derselben Führungsaufgabe. Dadurch kenne ich sowohl die technischen Details als auch die übergeordneten Anforderungen an eine verlässliche Produktentwicklung.
        - title: Zusammenarbeit über Standorte hinweg
          text: Die Arbeit mit verteilten Teams und Entwicklungspartnern gehörte zum Führungsalltag. Gemeinsame Orientierung, klare Abstimmung und Vertrauen sind dafür ebenso wichtig wie technische Kompetenz.
        intro: Aus dieser Zeit nehme ich vor allem die Erfahrung mit, Verantwortung nicht nur für eine technische Lösung, sondern auch für die Menschen und die Organisation ihrer Entwicklung zu tragen.
      process:
        title: Drei Perspektiven. Eine gemeinsame Verantwortung.
        steps:
        - Technische Entscheidungen
        - Digitale Produkte
        - Menschen & Zusammenarbeit
        feedback: Gute technische Führung hält diese Perspektiven zusammen, statt sie getrennt voneinander zu optimieren.
        caption: Vereinfachte Darstellung der Aufgaben technischer Produkt- und Teamführung.
        mode: peers
    mobile-fahrzeughandbuecher:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Mercedes-Benz Guides – Digitale Fahrzeughandbücher
        lead: Umfangreiche Fahrzeuginformationen mobil verfügbar machen – mit Softwareentwicklung, Content-Werkzeugen, Internationalisierung und technischer Projektleitung.
        context: Mobile Produktentwicklung · iOS & Android · Persönliche berufliche Erfahrung in unterschiedlichen Projektphasen
      situation:
        title: Technisches Wissen soll unterwegs einfach zugänglich sein.
        paragraphs:
        - Fahrzeughandbücher enthalten viele Funktionen, Hinweise und technische Details. Als mobile Anwendung sollen diese Informationen verständlich und zuverlässig verfügbar sein – auf unterschiedlichen Geräten, für verschiedene Fahrzeuge und in internationalen Märkten.
        - Dahinter steckt mehr als die Entwicklung einer Benutzeroberfläche. Inhalte müssen gepflegt, für verschiedene Sprachen aufbereitet, technisch ausgeliefert und über App-Versionen hinweg getestet werden. Damit solche Produkte funktionieren, müssen App-Entwicklung, Content-Prozesse und Qualitätssicherung ineinandergreifen.
      role:
        title: Von der mobilen Entwicklung zur technischen Projektleitung.
        paragraphs:
        - An den digitalen Fahrzeughandbüchern habe ich in unterschiedlichen Phasen meiner beruflichen Laufbahn gearbeitet. Zunächst war ich im Umfeld von CGI an der Entwicklung mobiler Anwendungen und technischen Grundlagen beteiligt. In einer späteren Phase übernahm ich bei inloop die technische Projektleitung für die Weiterentwicklung zu MBGuides 2.0.
        - 'Mit dieser Entwicklung veränderte sich auch meine Verantwortung: von Implementierung, technischen Fragen und Qualitätssicherung hin zur Abstimmung von App- und Content-Lösungen, zur Koordination der Entwicklung und zur Begleitung von Releases. Dazu gehörte auch die Zusammenarbeit mit einem Nearshore-Team in der Slowakei.'
      transfer:
        title: Was ich aus dieser Erfahrung heute mitbringe.
        paragraphs:
        - Ein komplexes Softwareprodukt entsteht nicht allein im Code. Architektur, Inhalte, Werkzeuge, Tests und Teamarbeit müssen zusammenpassen. Gerade die Arbeit an mehreren internationalen Produktversionen macht sichtbar, wie technische Entscheidungen und Organisationsfragen einander beeinflussen.
        - Diese Erfahrung ist Teil der technischen Grundlage meiner heutigen Arbeit bei mehr.wert. Ich kann bei strategischen Entscheidungen nicht nur auf Zielbilder schauen, sondern auch die Konsequenzen für Umsetzung, Betrieb, Qualität und Zusammenarbeit einordnen.
      closing:
        title: Technologieentscheidungen mit Blick auf das gesamte Produkt treffen?
        paragraphs:
        - 'Ob bestehende Anwendungen weiterentwickelt werden oder neue technische Anforderungen entstehen: Gute Entscheidungen berücksichtigen auch die Menschen, Werkzeuge und Abläufe hinter der Software.'
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Damit ein mobiles Handbuch funktioniert, muss auch der Weg der Inhalte funktionieren.
        items:
        - title: Mobile Anwendungen und verlässliche Technik
          text: Entwicklung und Architektur für mobile Anwendungen, automatisierte Tests sowie der Umgang mit lokal vorgehaltenen Inhalten gehörten zum Projektumfeld. Ziel war eine technische Grundlage, auf der sich umfangreiche Fahrzeuginformationen verständlich darstellen und weiterentwickeln lassen.
        - title: Internationalisierung und Content-Werkzeuge
          text: Inhalte für unterschiedliche Sprachen erfordern eigene technische Lösungen. Dazu gehörten die Unterstützung rechts-nach-links laufender Schriften sowie Python-gestützte Automatisierungen für die Lokalisierung. Auch an Werkzeugen zur Pflege und Bereitstellung der Handbuchinhalte wurde gearbeitet.
        - title: Verteilte Entwicklung und Qualität koordinieren
          text: In der späteren Projektphase kamen die technische Abstimmung zwischen App und Workbench, die Koordination eines Entwicklungsteams in der Slowakei sowie Qualitäts- und Release-Themen hinzu. So wurden nicht nur Funktionen umgesetzt, sondern mehrere technische und organisatorische Teile eines Produkts gemeinsam geführt.
        intro: Drei technische Aufgaben prägten die Arbeit an diesen Anwendungen besonders.
      results:
        title: Was aus der Zusammenarbeit hervorging.
        items:
        - title: Digitale Fahrzeughandbücher für mobile Plattformen
          text: Die Anwendungen stellten umfangreiche Fahrzeuginformationen mobil bereit. Für die spätere Projektphase ist die Veröffentlichung von MBGuides 2.0 für iOS und Android dokumentiert.
        - title: Werkzeuge und Abläufe für internationale Inhalte
          text: Content-Werkzeuge, Lokalisierungsautomatisierung und technische Lösungen für verschiedene Schriften unterstützten die Verarbeitung internationaler Handbuchinhalte.
        - title: Verbindung von Engineering und technischer Führung
          text: Meine Aufgaben umfassten sowohl eigene Entwicklungsarbeit als auch spätere technische Projektleitung und die Zusammenarbeit mit einem Nearshore-Team. Diese Perspektiven haben mein Verständnis für komplexe Softwareprodukte geprägt.
        intro: Das Ergebnis war nicht nur eine einzelne mobile Funktion, sondern die Arbeit an einem Produkt mit mehreren technischen Bestandteilen und internationalen Anforderungen.
      process:
        title: Vom gepflegten Inhalt zur mobilen Anwendung.
        steps:
        - Content-Pflege & Workbench
        - Lokalisierung & Qualitätsprüfung
        - Mobile Anwendungen für iOS & Android
        - Nutzung & Weiterentwicklung
        feedback: Änderungen an Inhalten, Sprachen und Anwendungen müssen gemeinsam betrachtet und getestet werden.
        caption: Vereinfachte Darstellung des Zusammenspiels von Content-Prozess und mobiler Anwendung.
        mode: flow
        intro: Digitale Fahrzeughandbücher verbinden redaktionell gepflegte Inhalte mit einer technischen Auslieferung an die App. Die einzelnen Schritte müssen zueinander passen.
