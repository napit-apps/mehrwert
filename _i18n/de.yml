##################### FAQ #########################
ac_faq:
  title: "GUT ZU WISSEN"
  subtitle: "Antworten auf typische Entscheidungsfragen"
  item:
  - question: "Was bringt Agile Coaching konkret für mein Team?"
    answer: "Mehr Planbarkeit, bessere Entscheidungen und geringere Reibung – das zeigen unsere Projekte immer wieder. Die Effekte sind meist schnell spürbar: mehr Klarheit, mehr Fokus, bessere Zusammenarbeit."

  - question: "Wie lange dauert es, bis erste Erfolge sichtbar werden?"
    answer: "In der Regel sehen Teams erste spürbare Verbesserungen nach wenigen Wochen – etwa in der Zusammenarbeit, der Planungssicherheit oder der Verantwortungsübernahme. Langfristige Wirkung entsteht über begleitendes Coaching."

  - question: "Wie viel Aufwand bedeutet das intern?"
    answer: "Der Aufwand ist planbar und richtet sich nach Ihrem Setup. Meist starten wir mit wenigen Stunden pro Woche, um Wirkung zu entfalten – ohne operative Teams zu blockieren."

  - question: "Was unterscheidet euch von klassischen Agile Coaches?"
    answer: "Wir denken Coaching vom Business her. Nicht der Prozess steht im Vordergrund, sondern Wirkung: bessere Steuerung, bessere Entscheidungen, bessere Ergebnisse."

  - question: "Was bedeutet das „Green“ in Green Agile?"
    answer: "„Green“ steht bei uns für einen erweiterten Blick auf Agilität: Wir verbinden die Prinzipien agiler Arbeitsweisen mit nachhaltigem, verantwortungsvollem Handeln – sowohl in der Organisation als auch in der Technologie. Das heißt: Wir achten nicht nur auf Lieferfähigkeit und Planbarkeit, sondern auch darauf, wie Entscheidungen langfristig wirken – auf Teams, Systeme und Ressourcen. So entsteht Agilität, die wirtschaftlich, organisatorisch und ökologisch tragfähig ist."
  
  - question: "Was passiert, wenn’s nicht funktioniert?"
    answer: "Dann justieren wir. Coaching ist ein lernender Prozess – auf beiden Seiten. Sollte sich keine Wirkung zeigen, beenden wir das Engagement lieber früh als verspätet."

  - question: "Wie funktioniert der Einstieg?"
    answer: "Sie starten mit dem kostenlosen Quick Check. Gemeinsam analysieren wir Setup, Engpässe und Potenziale – daraus entsteht ein konkreter Vorschlag für das weitere Vorgehen."

  - question: "Remote oder vor Ort?"
    answer: "Beides ist möglich. Remote-Coaching ist effizient und bewährt – vor Ort bringt zusätzliche Impulse für Kultur, Präsenz und Vertrauen. Wir stimmen das Setup individuell ab."

  - question: "Was kostet das?"
    answer: "Unsere Leistungen skalieren mit Ihrem Bedarf. Wir bieten flexible Modelle – von punktueller Unterstützung bis zur strategischen Begleitung. Im Erstgespräch erhalten Sie eine fundierte Einschätzung."

