      values:
        label: UNSER FUNDAMENT
        title: Nachhaltig bessere Software.
        text: Uns interessiert nicht nur, ob Software heute funktioniert. Wir schauen auch
          darauf, wie gut sie sich morgen verändern lässt, was ihr Betrieb kostet und welche
          Folgen Entscheidungen für Menschen und Umwelt haben. Bewusstsein und Verantwortung
          gehören für uns zur täglichen Arbeit.
        ai: Auch neue Werkzeuge wie KI beurteilen wir daran, ob sie einen konkreten Nutzen
          bringen und Qualität, Sicherheit und Nachvollziehbarkeit stimmen. Die Entscheidung
          und die Verantwortung bleiben bei Menschen.
        link: Mehr über den Green Agile Guide
      knowledge:
        label: WISSEN AUS DER PRAXIS
        title: Gedanken, die weiterführen.
        text: In unserem Blog schreiben wir über Softwaremodernisierung, Architektur und
          Zusammenarbeit – mit Fragen und Erfahrungen aus der Praxis.
