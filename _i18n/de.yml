      title: Mobile Software für unterschiedliche Branchen.
      meta_title: Mobile Software für unterschiedliche Branchen. | mehr.wert
      type: Berufserfahrung · Marcel Russ
      lead: Technische Kompetenz entsteht, wenn Software unter echten fachlichen Bedingungen entstehen und zuverlässig funktionieren muss.
      url: "/projects/mobile-software-projekte.html"
      sections:
      - title: Ausgangslage
        text: In früheren Kundenprojekten standen unterschiedliche fachliche Abläufe und Nutzeranforderungen im Mittelpunkt. Mobile Anwendungen mussten sich in bestehende Systeme einfügen und unter den jeweiligen Bedingungen der Domäne praktikabel sein.
      - title: Rolle und Verantwortung
        text: Marcel Russ arbeitete bei CGI in mobilen Kundenprojekten von der Anforderungsanalyse über Konzeption und Entwicklung bis zu Tests und Produktiveinsatz. Die konkreten Rollen unterschieden sich je Projekt.
      - title: Beitrag
        text: 'Der Schwerpunkt lag auf mobiler Softwareentwicklung und den technischen Entscheidungen dahinter: Anwendungsarchitektur, Schnittstellen, UI/UX, Implementierung und Betriebsperspektive.'
      - title: Ergebnis und Bedeutung
        text: Diese Erfahrungen vermitteln den Blick dafür, wie stark gute Software von Fachlichkeit, Bedienbarkeit, technischer Qualität und den Rahmenbedingungen ihres Einsatzes abhängt.
      - title: Heute relevant
        text: Für mehr.wert ist diese praktische Erfahrung die Grundlage, um technische Entscheidungen nicht nur konzeptionell, sondern auch mit Blick auf Umsetzung, Betrieb und die Arbeit der Entwickler zu beurteilen.
      description: Technische Kompetenz entsteht, wenn Software unter echten fachlichen Bedingungen entstehen und zuverlässig funktionieren muss.
      service:
        title: IT-Strategie & Modernisierung
        url: "/services/fractional-cto.html"
      related:
      - mywork-produktverantwortung
      - technische-fuehrung-web-mobile
