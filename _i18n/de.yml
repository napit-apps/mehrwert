          sinnvoll ist. Manche Fragen brauchen eine klare Entscheidung, andere einen überschaubaren
          Versuch. Wir prüfen Ergebnisse, nehmen Rückmeldungen ernst und passen unser Vorgehen
          an, wenn wir dazulernen.
        questions:
        - Was funktioniert bereits?
        - Was probieren wir aus?
        - Was können wir weglassen?
