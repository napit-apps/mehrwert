    strategy:
      url: "/services/fractional-cto.html"
      meta_title: IT-Strategie & Softwaremodernisierung | mehr.wert
      description: 'IT-Strategie und Modernisierung geschäftskritischer Software: Optionen
        bewerten, Risiken einordnen und Veränderungen persönlich begleiten.'
      hero:
        label: IT-STRATEGIE & MODERNISIERUNG
        title: Eine klare Richtung für Ihre IT. Damit Ihr Unternehmen handlungsfähig bleibt.
        paragraphs:
        - Eine gute IT-Strategie beginnt bei Ihrem Geschäft. Wir schaffen Überblick über
          Systeme, Abhängigkeiten und Möglichkeiten, klären wichtige Entscheidungen und
          entwickeln mit Ihnen die nächsten sinnvollen Schritte. Bei der Umsetzung übernehmen
          wir die Verantwortung, die wir vereinbaren – und prüfen gemeinsam, ob der Weg
          weiterhin passt.
        primary: Unverbindlich ins Gespräch kommen
        secondary: So unterstützen wir
      situations:
        label: WENN IT-ENTSCHEIDUNGEN ANSTEHEN
        title: Vielleicht stehen Sie gerade vor einer dieser Fragen.
        items:
        - title: Ihre IT ist gewachsen. Aber wohin soll sie sich entwickeln?
          text: Neue Anforderungen treffen auf bestehende Systeme, Verträge und Zuständigkeiten.
            Es fehlt ein gemeinsames Bild davon, was bleiben kann – und wo Veränderung nötig
            ist.
        - title: Die Software läuft. Jede Änderung wird schwieriger.
          text: Geschäftskritische Anwendungen funktionieren, doch Wissen ist verteilt und
            Abhängigkeiten sind kaum dokumentiert. Sie möchten modernisieren, ohne den laufenden
            Betrieb zu gefährden.
        - title: Standardsoftware ist zur Sonderlösung geworden.
          text: Individuelle Anpassungen erschweren Updates, erhöhen Kosten oder verstärken
            die Bindung an Anbieter. Jetzt braucht es eine nüchterne Bewertung der tatsächlichen
            Möglichkeiten.
        - title: Die Richtung ist klar. Aber das Vorhaben stockt.
          text: Fachbereiche, IT und Partner sind beteiligt, doch Prioritäten und Verantwortlichkeiten
            greifen nicht ineinander. Entscheidungen müssen wieder im Alltag ankommen.
      benefits:
        label: WORAUF ES ANKOMMT
        title: Eine gute IT-Strategie schafft Handlungsspielraum.
        intro: Sie muss nicht alles vorhersagen. Sie soll helfen, Möglichkeiten zu beurteilen
          und wichtige Entscheidungen auch bei neuen Erkenntnissen nachvollziehbar zu treffen.
        items:
        - title: Klarheit über das Wesentliche.
          text: Welche Systeme, Risiken und Abhängigkeiten sind für Ihr Geschäft entscheidend?
        - title: Begründete Prioritäten.
          text: Was lohnt sich angesichts von Nutzen, Kosten und Risiken – und was nicht?
        - title: Nächste Schritte, die sich anpassen lassen.
          text: Wer übernimmt was, und wann lohnt es sich, den Weg zu überprüfen?
      decisions:
        label: MODERNISIERUNG ALS STRATEGISCHE ENTSCHEIDUNG
        criteria:
        - Geschäftlicher Nutzen
        - Risiken
        - Wirtschaftlichkeit
        - Umsetzbarkeit
        title: Nicht alles muss neu. Aber es braucht eine bewusste Entscheidung.
        intro: Manchmal ist gezielte Weiterentwicklung richtig, manchmal eine schrittweise
          Erneuerung oder eine Ablösung. Entscheidend sind Ihr Geschäft, die Risiken, die
          Kosten und die Möglichkeiten Ihrer Organisation.
        items:
        - title: Gezielt weiterentwickeln
          text: Was zuverlässig funktioniert, muss nicht ersetzt werden. Wir klären, wo
            Verbesserungen sinnvoll sind und was erhalten bleiben sollte.
        - title: Schrittweise modernisieren
          text: Wenn Teile einer Anwendung zunehmend bremsen, planen wir überschaubare Veränderungen
            und behalten den laufenden Betrieb im Blick.
        - title: Bewusst ablösen
          text: Wenn Aufwand, Risiken oder Abhängigkeiten nicht mehr tragbar sind, bewerten
            wir einen geordneten Ersatz – einschließlich des Wissens, das erhalten bleiben
            muss.
        closing: Diese Möglichkeiten schließen sich nicht aus. Der passende Weg kann sich
          mit neuen Erkenntnissen ändern.
      engagements:
        label: ZUSAMMENARBEIT
        title: Sie bekommen die Unterstützung, die Ihre Situation braucht.
        paragraphs:
        - Manchmal genügt eine unabhängige Einschätzung oder ein Workshop. Bei größeren
          Vorhaben begleiten wir Sie über längere Zeit, bei Bedarf auch mit IT-Führungsverantwortung
          auf Zeit. Sie sprechen direkt mit Marcel Russ; Ihre Teams und Partner bleiben
          eingebunden. Zusätzliche Fachleute kommen nur dazu, wenn sie wirklich gebraucht
          werden.
      support:
        label: UNSERE UNTERSTÜTZUNG
        title: Wir steigen dort ein, wo Sie uns brauchen.
        intro: Manchmal reicht ein unabhängiger Blick. Manchmal braucht es eine gemeinsame
          IT-Strategie oder Begleitung bei der Umsetzung. Umfang und Vorgehen richten sich
          nach Ihrer Situation.
        items:
        - title: IT-Situation einordnen
          text: Wir betrachten Ihre Systeme, die Anforderungen des Geschäfts, Risiken und
            Abhängigkeiten. Gemeinsam klären wir, welche Informationen für eine Entscheidung
            fehlen und welche Optionen bereits erkennbar sind.
          result: Verständliche Ausgangslage · begründete Handlungsoptionen.
        - title: Strategie und Modernisierung ausrichten
          text: Wir klären mit Ihnen, was Ihre IT künftig leisten soll, und bewerten bestehende
            Lösungen, Alternativen und mögliche Etappen. Architektur, Kosten, Sicherheit
            und die Möglichkeiten Ihrer Organisation fließen in die Entscheidungen ein.
          result: Gemeinsames Zielbild · klare Prioritäten · überprüfbare nächste Schritte.
        - title: Umsetzung begleiten und IT-Verantwortung übernehmen
          text: Wir bringen Beteiligte zusammen, begleiten vereinbarte Entscheidungen in
            die Praxis und machen Fortschritte und Hindernisse sichtbar. Neue Erkenntnisse
            können den nächsten Schritt verändern. Bei Bedarf übernehmen wir zeitweise klar
            vereinbarte IT-Führungsverantwortung.
          result: Klare Zuständigkeiten · sichtbarer Fortschritt · rechtzeitige Entscheidungen.
        clarification: Die Softwareentwicklung liegt bei Ihren Teams, bestehenden Partnern
          oder gezielt hinzugezogenen Spezialisten. Wir verantworten die Aufgaben, die wir
          gemeinsam vereinbaren.
        result_label: 'Mögliche Arbeitsergebnisse:'
      practice:
        label: EINBLICKE IN UNSERE ARBEIT
        title: Erfahrung hilft, aus Möglichkeiten konkrete Schritte zu machen.
        intro: Manchmal geht es zuerst darum, eine gemeinsame Richtung zu finden. Manchmal
          darum, gewachsene Software besser zu verstehen und die Modernisierung vorzubereiten.
          Beides gehört zu guter Technologiearbeit.
        items:
        - label: STRATEGISCHE TECHNOLOGIE- UND TEAMARBEIT · HUGO BOSS · WORKSHOP 2026
          title: Eine gemeinsame Richtung für eine neue Technologieinitiative.
          paragraphs:
          - Das TechFoundry-Team bei HUGO BOSS beschäftigte sich mit den Möglichkeiten KI-gestützter
            Softwareentwicklung. Viele Ideen und hohe technische Expertise waren vorhanden.
            Entscheidend war, daraus gemeinsame Ziele, klare Prioritäten und einen tragfähigen
            nächsten Schritt zu machen.
          - Wir haben den strategischen Workshop konzipiert und moderiert, Annahmen hinterfragt
            und die Diskussion konsequent auf Kundennutzen und Ergebnisse ausgerichtet.
            Das Team erarbeitete eine gemeinsame Sicht auf sein Vorhaben und eine strukturierte
            Roadmap für die weitere Arbeit.
          result: Ein abgestimmtes Zielbild und eine Roadmap, mit der das Team seine nächsten
            Schritte gezielt angehen kann.
        - label: LAUFENDE SOFTWAREMODERNISIERUNG · DÜCKER
          title: Eine gewachsene Anwendung gemeinsam weiterentwickeln.
          paragraphs:
          - 'Bei Dücker soll die geschäftskritische Plattform ASCOR modernisiert werden.
            Die Herausforderung liegt nicht nur in der Technik: Fachbereiche und Entwicklung
            müssen ein gemeinsames Verständnis davon haben, wie die Anwendung funktioniert
            und welche fachlichen Regeln erhalten bleiben müssen.'
          - Wir haben die unterschiedlichen Perspektiven zusammengebracht, gemeinsam ein
            Domänenverständnis und eine Modernisierungsstrategie erarbeitet und bestehende
            Geschäftsregeln aus ASCOR für die weitere Entwicklung herausgearbeitet.
          result: Ein gemeinsam getragener Modernisierungsansatz und dokumentiertes Fachwissen
            als Grundlage für die nächsten Schritte. Die Begleitung läuft weiter.
        - label: LANGFRISTIGE PRODUKTVERANTWORTUNG · MARCEL RUSS
          title: Software über Jahre verantworten – nicht nur Empfehlungen geben.
          paragraphs:
          - 'Mit der selbst entwickelten Zeiterfassungs-App myWork bringt Marcel Russ die
            Erfahrung mit, ein Softwareprodukt über Jahre zu entwickeln, zu betreiben und
            weiterzuentwickeln. Das prägt unseren Blick auf IT-Entscheidungen: Eine Architektur
            muss nicht nur auf dem Papier funktionieren, sondern auch bei Änderungen, im
            Betrieb und für die Menschen, die täglich damit arbeiten.'
      values:
        label: NACHHALTIG BESSERE SOFTWARE
        title: Gute Entscheidungen wirken über den nächsten Release hinaus.
        paragraphs:
        - 'Wir schauen auf die Folgen technischer Entscheidungen: Wartbarkeit, Betriebskosten,
          Ressourcen und die Menschen, die mit der Software arbeiten. Bewusstsein und Verantwortung
          helfen uns, Chancen und Risiken offen abzuwägen – auch dann, wenn sich Rahmenbedingungen
          ändern.'
      faq:
        label: GUT ZU WISSEN
        title: Häufige Fragen zur Zusammenarbeit
        items:
        - title: Müssen wir schon wissen, was wir modernisieren wollen?
          text: Nein. Gerade wenn die Richtung noch offen ist, kann eine gemeinsame Standortbestimmung
            sinnvoll sein. Wir betrachten Ausgangslage und Ziele, bewerten Optionen und
            klären, welche Entscheidung als Nächstes ansteht.
        - title: Arbeiten Sie mit unseren bestehenden Teams und Dienstleistern?
          text: Ja. Wir beziehen die Menschen ein, die die Systeme und Abläufe kennen. Je
            nach Auftrag helfen wir bei Strategie und Abstimmung oder übernehmen die vereinbarte
            Steuerung des Vorhabens. Zusätzliche Spezialisten binden wir nur ein, wenn sie
            gebraucht werden.
        - title: Können Sie auch vorübergehend IT-Verantwortung übernehmen?
          text: Ja, wenn Aufgabe, Mandat und Entscheidungsrahmen geklärt sind. Das kann
            beispielsweise die Steuerung eines Modernisierungsvorhabens oder eine zeitlich
            begrenzte IT-Führungsaufgabe sein.
      contact:
        label: DER NÄCHSTE SCHRITT
        title: Welche IT-Entscheidung beschäftigt Sie gerade?
        text: Sie möchten Ihre IT neu ausrichten, eine wichtige Anwendung modernisieren
          oder ein festgefahrenes Vorhaben voranbringen? Erzählen Sie uns, wo Sie stehen.
          Gemeinsam überlegen wir, welcher nächste Schritt sinnvoll ist.
        primary: Unverbindlich ins Gespräch kommen
        alternative: Oder schreiben Sie direkt an
      ai:
        label: NEUE MÖGLICHKEITEN DURCH KI
        title: KI sinnvoll einsetzen. Mit klarem Blick auf den Nutzen.
        paragraphs:
        - Künstliche Intelligenz eröffnet neue Möglichkeiten, Software besser zu verstehen,
          zu entwickeln und zu modernisieren. Gerade bei gewachsenen Systemen kann sie helfen,
          vorhandenes Fachwissen zu erschließen, Abhängigkeiten sichtbar zu machen und die
          Qualitätssicherung zu unterstützen. So lassen sich Veränderungen besser vorbereiten
          und fundiertere Entscheidungen treffen.
        - Wir beziehen diese Möglichkeiten in unsere Strategie- und Modernisierungsarbeit
          ein. Welche Werkzeuge sinnvoll sind, hängt von Ihren Zielen, Ihrer IT-Landschaft
          und den verfügbaren Informationen ab. Dabei berücksichtigen wir Wirtschaftlichkeit,
          Datenschutz, Sicherheit, Qualität und mögliche neue Abhängigkeiten.
        closing: "<strong>Unser Anspruch:</strong> Die Möglichkeiten moderner Technologie
          nutzen, ohne dabei fachliches Urteilsvermögen und Verantwortung aus der Hand zu
          geben."
      experience:
        label: ERFAHRUNG ALS GRUNDLAGE
        text: Wir kennen Software aus eigener Entwicklung, langfristiger Produktverantwortung und technischer Führung. Bei Dücker haben wir beispielsweise Fachbereiche und Entwicklung zusammengebracht, die fachlichen Zusammenhänge einer gewachsenen Software geklärt und bestehende Geschäftsregeln für die weitere Modernisierung aufbereitet.
        link: Modernisierung bei Dücker ansehen
        url: "/projects/duecker.html"
    delivery:
      title: Organisation & Software-Delivery
      meta_title: Organisation & Software-Delivery | mehr.wert
      url: "/services/agile-transformation-coaching.html"
      hero:
        label: ORGANISATION & SOFTWARE-DELIVERY
        title: Damit Strategie im Alltag ankommt. Und Teams verlässlich liefern.
        paragraphs:
        - Auch gute Teams kommen ins Stocken, wenn Prioritäten, Abhängigkeiten und Entscheidungen
          nicht zusammenpassen. Wir bringen Führungskräfte und Teams zusammen, unterstützen
          konkrete Verbesserungen im Alltag und überprüfen gemeinsam, was sich dadurch verändert.
          Dabei passen wir das Vorgehen an Ihre Organisation und neue Erkenntnisse an.
        primary: Unverbindlich ins Gespräch kommen
        secondary: So unterstützen wir
      description: Damit Strategie im Alltag ankommt. Und Teams gemeinsam verlässlich liefern
        können.
      situations:
        label: WENN ZUSAMMENARBEIT KOMPLEX WIRD
        title: Kommen Ihnen diese Situationen bekannt vor?
        items:
        - title: Jedes Team hat einen Plan. Der gemeinsame fehlt.
          text: Prioritäten und Abhängigkeiten werden erst spät abgestimmt. Was für ein
            Team sinnvoll ist, passt nicht immer zum Ganzen – und gemeinsame Zusagen werden
            unsicher.
        - title: Die Projektplanung steht. Die tatsächliche Delivery bleibt schwer einschätzbar.
          text: Budgets und Termine sind geplant. Engpässe und neue Erkenntnisse aus der
            Entwicklung erreichen die Projektsteuerung jedoch zu spät, um rechtzeitig über
            Prioritäten, Umfang oder Termine zu entscheiden.
        - title: Agile Arbeitsweisen sind eingeführt. Trotzdem hakt es.
          text: Unterschiedliche Qualitätsmaßstäbe und unklare Übergaben führen zu Rückfragen
            und Nacharbeit. Oft fehlen gemeinsame Vereinbarungen, die im Alltag auch angewendet
            werden.
        - title: Verbesserungen sind bekannt. Im Alltag bleibt vieles liegen.
          text: Gute Ideen aus Retrospektiven oder Workshops kommen nicht voran, wenn Zeit,
            Zuständigkeiten oder Unterstützung fehlen. Führung und Teams müssen Veränderungen
            gemeinsam möglich machen.
      benefits:
        label: WORAUF ES ANKOMMT
        title: Gute Zusammenarbeit zeigt sich in der Delivery.
        intro: Wir möchten, dass Teams gemeinsame Vorhaben besser abstimmen, mit weniger
          Reibung arbeiten und notwendige Entscheidungen früher treffen können.
        items:
        - title: Eine gemeinsame Richtung
          text: Teams kennen Prioritäten, Abhängigkeiten und ihren Beitrag zu größeren Vorhaben.
        - title: Weniger Reibung im Arbeitsalltag
          text: Anforderungen, Qualitätskriterien und Übergaben sind so geklärt, dass die
            Arbeit besser vorankommt.
        - title: Mehr Transparenz für Entscheidungen
          text: Fortschritt, Hindernisse und geeignete Kennzahlen helfen Teams und Führung,
            rechtzeitig zu entscheiden.
      support:
        label: UNSERE UNTERSTÜTZUNG
        title: Was wir gemeinsam verbessern können.
        intro: Mal braucht es eine gemeinsame Planung über mehrere Teams. Mal sind es die
          täglichen Arbeitsweisen oder die Umsetzung längst bekannter Verbesserungen. Wir
          konzentrieren uns auf das, was in Ihrer Organisation gerade hilft.
        results_label: 'Mögliche Arbeitsergebnisse:'
        items:
        - title: Ziele, Planung und Teams verbinden
          text: 'Wir stimmen mit Führungskräften, Product Ownern und Teams Prioritäten ab,
            machen Abhängigkeiten sichtbar und schaffen eine Planung, die im Alltag Orientierung
            gibt. Ob Quartalsplanung oder ein einfacheres Abstimmungsformat: Wir richten
            die Zusammenarbeit an Ihrer Organisation aus.'
          result: Abgestimmte Ziele und Prioritäten · sichtbare Abhängigkeiten · passende
            Planungs- und Rückkopplungsformate.
        - title: Arbeitsweisen und Qualität verbessern
          text: Wir schauen gemeinsam auf Rückfragen, Wartezeiten und Nacharbeit – etwa
            durch unklare Anforderungen oder Übergaben. Mit den Beteiligten entwickeln wir
            praktikable Vereinbarungen und unterstützen ihre Anwendung im Alltag.
          result: Besser vorbereitete Arbeit · gemeinsame Qualitätskriterien · klarere Übergaben.
        - title: Verbesserungen begleiten und Wirkung prüfen
          text: Wir unterstützen Führung und Teams dabei, Veränderungen im Alltag anzuwenden. Gemeinsam prüfen wir, ob sich beispielsweise Durchlaufzeiten, Nacharbeit oder die Verlässlichkeit der Lieferung verbessern. Dafür nutzen wir passende Kennzahlen und Rückmeldungen und passen Maßnahmen an, wenn sie nicht die gewünschte Wirkung zeigen.
          result: Konkrete Verbesserungen mit Verantwortlichen · regelmäßiges Feedback ·
            geeignete Messsignale für Entscheidungen.
      ai:
        label: SOFTWARE-DELIVERY IM WANDEL
        title: Wenn KI die Entwicklung verändert, muss die Zusammenarbeit mitwachsen.
        paragraphs:
        - 'KI kann die Analyse, Entwicklung, Tests und Dokumentation von Software verändern.
          Damit entstehen neue Fragen: Wer prüft Ergebnisse? Wie bleibt die Qualität gesichert?
          Wie müssen Abstimmung und Feedback aussehen, wenn sich Arbeit verändert?'
        - Wir betrachten Werkzeuge und Zusammenarbeit gemeinsam. Ob Verantwortlichkeiten,
          Qualitätsprüfungen oder Arbeitsweisen angepasst werden sollten, hängt von den
          tatsächlichen Möglichkeiten und Anforderungen ab. Entscheidend bleiben Nutzen,
          Sicherheit und nachvollziehbare Ergebnisse.
        closing: Wie strategische Orientierung bei einer KI-gestützten Entwicklungsinitiative
          entstehen kann, zeigt auch unsere Arbeit mit dem TechFoundry-Team von HUGO BOSS.
      practice:
        label: ERFAHRUNGEN AUS DER PRAXIS
        title: Wenn aus guten Absichten gemeinsame Arbeitsweisen werden.
        intro: 'Nicht jede Organisation braucht dieselbe Veränderung. Diese Beispiele zeigen
          zwei unterschiedliche Aufgaben: Zusammenarbeit und Planung über viele Teams hinweg
          wirksam gestalten – und gemeinsame Grundlagen für bessere Software-Delivery aufbauen
          und einführen.'
        items:
        - label: PERSÖNLICHE PROJEKTERFAHRUNG · ENBW TRADING IT · MEHRJÄHRIG
          title: Strategie, Roadmaps und Teams in einer gemeinsamen Planung verbinden.
          paragraphs:
          - In der Trading IT von EnBW arbeiteten viele Teams an unterschiedlichen Vorhaben.
            Für eine gemeinsame Richtung brauchte es mehr als die Summe einzelner Teampläne.
            Marcel Russ hat die Entwicklung eines wiederkehrenden Quartalsplanungsprozesses
            und teamübergreifender Onsite-Wochen maßgeblich gestaltet und in der Praxis
            begleitet.
          - So wurden strategische Prioritäten, Roadmaps, Abhängigkeiten und die Rückkopplung
            mit dem Management in einen gemeinsamen Planungsrhythmus gebracht. Beteiligte
            bestätigen, dass Planung, Transparenz und Zusammenarbeit dadurch besser wurden.
          result: Wiederkehrende, gemeinsam genutzte Planungsformate und mehr Transparenz
            über Vorhaben und Abhängigkeiten – mit positiven Rückmeldungen aus der Organisation.
        - label: LAUFENDES MANDAT · VIRIDIUM · ORGANISATIONSENTWICKLUNG
          title: Gemeinsame Grundlagen schaffen, damit zwölf Squads besser zusammenarbeiten
            können.
          paragraphs:
          - Bei Viridium begleiten wir die Weiterentwicklung der Software-Delivery in einer
            Organisation mit zwölf Squads. Unterschiedliche Arbeitsweisen, Qualitätsvorstellungen
            und der Abstimmungsbedarf zwischen Projekten und Teams erfordern gemeinsame
            Orientierung.
          - Wir haben eine Community of Practice mit rund 50 Beteiligten aufgebaut und mit
            den Teams Grundlagen für Backlog-Qualität, Refinement, Schätzung und Definition
            of Done entwickelt. Dazu kommen die strukturierte Betrachtung der Squad-Arbeitsweisen
            und die aktive Begleitung der Einführung. So wird Verbesserung zu einer gemeinsamen
            Aufgabe, die im Alltag weiterentwickelt werden kann.
          result: Geschaffene gemeinsame Arbeits- und Qualitätsgrundlagen sowie eine übergreifende
            Austauschstruktur. Die Einführung wird begleitet; Verbesserungen der Delivery
            werden weiter überprüft.
        link: Mehr Projekte & Erfahrungen
        url: "/projects.html"
      engagements:
        label: ZUSAMMENARBEIT
        title: Veränderung braucht Menschen, die Verantwortung übernehmen.
        paragraphs:
        - 'Wir übernehmen Verantwortung für die vereinbarten Aufgaben: Wir entwickeln mit
          den Beteiligten passende Maßnahmen, begleiten ihre Einführung, sprechen Hindernisse
          offen an und steuern bei Bedarf nach.'
        - Damit Verbesserungen im Alltag bestehen bleiben, braucht es auch Führung, die
          Prioritäten setzt, Entscheidungen trifft und Zeit für Veränderungen ermöglicht.
          Wir arbeiten mit Ihren Teams und bestehenden Partnern – punktuell oder über längere
          Zeit, je nach Aufgabe.
      values:
        label: NACHHALTIG BESSERE SOFTWARE
        title: Gute Zusammenarbeit soll bleiben – auch wenn unsere Begleitung endet.
        paragraphs:
        - 'Wir helfen, Arbeitsweisen zu entwickeln, die Teams selbst weiterführen können.
          Dazu gehört auch, auf Termine und Regeln zu verzichten, wenn sie keinen Nutzen
          bringen. Bewusstsein und Verantwortung aus Green Agile prägen diesen Anspruch:
          Folgen erkennen, Entscheidungen tragen und Zusammenarbeit so gestalten, dass sie
          auf Dauer funktioniert.'
        link: Bewusstsein und Verantwortung im Green Agile Guide
        url: "/green-agile-guide.html"
      faq:
        label: GUT ZU WISSEN
        title: Häufige Fragen zur Zusammenarbeit
        items:
        - title: Müssen unsere Teams bereits agil arbeiten?
          text: Nein. Entscheidend ist nicht, welches Vorgehensmodell Sie heute verwenden,
            sondern welche Probleme Sie lösen möchten. Wir knüpfen an vorhandene Strukturen
            an und entwickeln mit Ihnen die Arbeitsweisen, die tatsächlich helfen.
        - title: Müssen wir unsere bestehenden Planungs- und Arbeitsweisen grundlegend verändern?
          text: Nicht unbedingt. Wir beginnen mit dem, was bereits funktioniert, und betrachten
            gemeinsam, wo Veränderungen sinnvoll sind. Projekt- und Portfolioplanung, die
            tägliche Arbeit der Teams und die Steuerung durch das Management müssen nicht
            nach derselben Methode funktionieren. Entscheidend ist, dass sie zusammenpassen
            und notwendige Entscheidungen rechtzeitig möglich machen.
        - title: Wie erkennen wir, ob sich die Software-Delivery verbessert?
          text: Wir schauen zunächst darauf, welche Wirkung Sie erreichen möchten – etwa
            bessere Planbarkeit, weniger Wartezeiten oder höhere Qualität. Darauf abgestimmt
            wählen wir geeignete Beobachtungen und Kennzahlen. Sie sollen Teams bei Verbesserungen
            unterstützen und fundierte Entscheidungen ermöglichen, nicht einzelne Menschen
            oder Teams gegeneinander ausspielen.
        - title: Wer sorgt dafür, dass neue Arbeitsweisen dauerhaft genutzt werden?
          text: Wir gestalten und begleiten die Einführung, prüfen die Anwendung und machen
            Hindernisse sichtbar. Für Prioritäten, notwendige Kapazitäten und verbindliche
            Entscheidungen braucht es das Management und die jeweiligen Teams. Genau diese
            Zusammenarbeit bauen wir von Anfang an mit auf.
      contact:
        label: DER NÄCHSTE SCHRITT
        title: Was soll in Ihrer Software-Delivery besser funktionieren?
        text: Vielleicht möchten Sie mehrere Teams besser aufeinander abstimmen, Planung
          verlässlicher machen oder eine begonnene Veränderung endlich in die Praxis bringen.
          Erzählen Sie uns, was Sie beschäftigt. Gemeinsam klären wir, wo mehr.wert sinnvoll
