  services:
    it_strategy:
      meta_title: IT-Strategie & Softwaremodernisierung | mehr.wert
      description: 'IT-Strategie und Modernisierung geschäftskritischer Software: Optionen bewerten, Risiken einordnen und Veränderungen persönlich begleiten.'
      hero:
        label: IT-STRATEGIE & MODERNISIERUNG
        title: Eine klare Richtung für Ihre IT. Damit Ihr Unternehmen handlungsfähig bleibt.
        paragraphs:
        - Eine gute IT-Strategie beginnt bei Ihrem Geschäft. Wir schaffen Überblick über Systeme, Abhängigkeiten und Möglichkeiten, klären wichtige Entscheidungen und entwickeln mit Ihnen die nächsten sinnvollen Schritte. Bei der Umsetzung übernehmen wir die Verantwortung, die wir vereinbaren – und prüfen gemeinsam, ob der Weg weiterhin passt.
        primary: Unverbindlich ins Gespräch kommen
        secondary: So unterstützen wir
      situations:
        label: WENN IT-ENTSCHEIDUNGEN ANSTEHEN
        title: Vielleicht stehen Sie gerade vor einer dieser Fragen.
        items:
        - title: Ihre IT ist gewachsen. Aber wohin soll sie sich entwickeln?
          text: Neue Anforderungen treffen auf bestehende Systeme, Verträge und Zuständigkeiten. Es fehlt ein gemeinsames Bild davon, was bleiben kann – und wo Veränderung nötig ist.
        - title: Die Software läuft. Jede Änderung wird schwieriger.
          text: Geschäftskritische Anwendungen funktionieren, doch Wissen ist verteilt und Abhängigkeiten sind kaum dokumentiert. Sie möchten modernisieren, ohne den laufenden Betrieb zu gefährden.
        - title: Standardsoftware ist zur Sonderlösung geworden.
          text: Individuelle Anpassungen erschweren Updates, erhöhen Kosten oder verstärken die Bindung an Anbieter. Jetzt braucht es eine nüchterne Bewertung der tatsächlichen Möglichkeiten.
        - title: Die Richtung ist klar. Aber das Vorhaben stockt.
          text: Fachbereiche, IT und Partner sind beteiligt, doch Prioritäten und Verantwortlichkeiten greifen nicht ineinander. Entscheidungen müssen wieder im Alltag ankommen.
      benefits:
        label: WORAUF ES ANKOMMT
        title: Eine gute IT-Strategie schafft Handlungsspielraum.
        intro: Sie muss nicht alles vorhersagen. Sie soll helfen, Möglichkeiten zu beurteilen und wichtige Entscheidungen auch bei neuen Erkenntnissen nachvollziehbar zu treffen.
        items:
        - title: Klarheit über das Wesentliche.
          text: Welche Systeme, Risiken und Abhängigkeiten sind für Ihr Geschäft entscheidend?
        - title: Begründete Prioritäten.
          text: Was lohnt sich angesichts von Nutzen, Kosten und Risiken – und was nicht?
        - title: Nächste Schritte, die sich anpassen lassen.
          text: Wer übernimmt was, und wann lohnt es sich, den Weg zu überprüfen?
      decisions:
        label: MODERNISIERUNG ALS STRATEGISCHE ENTSCHEIDUNG
        criteria:
        - Geschäftlicher Nutzen
        - Risiken
        - Wirtschaftlichkeit
        - Umsetzbarkeit
        title: Nicht alles muss neu. Aber es braucht eine bewusste Entscheidung.
        intro: Manchmal ist gezielte Weiterentwicklung richtig, manchmal eine schrittweise Erneuerung oder eine Ablösung. Entscheidend sind Ihr Geschäft, die Risiken, die Kosten und die Möglichkeiten Ihrer Organisation.
        items:
        - title: Gezielt weiterentwickeln
          text: Was zuverlässig funktioniert, muss nicht ersetzt werden. Wir klären, wo Verbesserungen sinnvoll sind und was erhalten bleiben sollte.
        - title: Schrittweise modernisieren
          text: Wenn Teile einer Anwendung zunehmend bremsen, planen wir überschaubare Veränderungen und behalten den laufenden Betrieb im Blick.
        - title: Bewusst ablösen
          text: Wenn Aufwand, Risiken oder Abhängigkeiten nicht mehr tragbar sind, bewerten wir einen geordneten Ersatz – einschließlich des Wissens, das erhalten bleiben muss.
        closing: Diese Möglichkeiten schließen sich nicht aus. Der passende Weg kann sich mit neuen Erkenntnissen ändern.
      engagements:
        label: ZUSAMMENARBEIT
        title: Sie bekommen die Unterstützung, die Ihre Situation braucht.
        paragraphs:
        - Manchmal genügt eine unabhängige Einschätzung oder ein Workshop. Bei größeren Vorhaben begleiten wir Sie über längere Zeit, bei Bedarf auch mit IT-Führungsverantwortung auf Zeit. Sie sprechen direkt mit Marcel Russ; Ihre Teams und Partner bleiben eingebunden. Zusätzliche Fachleute kommen nur dazu, wenn sie wirklich gebraucht werden.
      support:
        label: UNSERE UNTERSTÜTZUNG
        title: Wir steigen dort ein, wo Sie uns brauchen.
        intro: Manchmal reicht ein unabhängiger Blick. Manchmal braucht es eine gemeinsame IT-Strategie oder Begleitung bei der Umsetzung. Umfang und Vorgehen richten sich nach Ihrer Situation.
        items:
        - title: IT-Situation einordnen
          text: Wir betrachten Ihre Systeme, die Anforderungen des Geschäfts, Risiken und Abhängigkeiten. Gemeinsam klären wir, welche Informationen für eine Entscheidung fehlen und welche Optionen bereits erkennbar sind.
          result: Verständliche Ausgangslage · begründete Handlungsoptionen.
        - title: Strategie und Modernisierung ausrichten
          text: Wir klären mit Ihnen, was Ihre IT künftig leisten soll, und bewerten bestehende Lösungen, Alternativen und mögliche Etappen. Architektur, Kosten, Sicherheit und die Möglichkeiten Ihrer Organisation fließen in die Entscheidungen ein.
          result: Gemeinsames Zielbild · klare Prioritäten · überprüfbare nächste Schritte.
        - title: Umsetzung begleiten und IT-Verantwortung übernehmen
          text: Wir bringen Beteiligte zusammen, begleiten vereinbarte Entscheidungen in die Praxis und machen Fortschritte und Hindernisse sichtbar. Neue Erkenntnisse können den nächsten Schritt verändern. Bei Bedarf übernehmen wir zeitweise klar vereinbarte IT-Führungsverantwortung.
          result: Klare Zuständigkeiten · sichtbarer Fortschritt · rechtzeitige Entscheidungen.
        clarification: Die Softwareentwicklung liegt bei Ihren Teams, bestehenden Partnern oder gezielt hinzugezogenen Spezialisten. Wir verantworten die Aufgaben, die wir gemeinsam vereinbaren.
        result_label: 'Mögliche Arbeitsergebnisse:'
      values:
        label: NACHHALTIG BESSERE SOFTWARE
        title: Gute Entscheidungen wirken über den nächsten Release hinaus.
        paragraphs:
        - 'Wir schauen auf die Folgen technischer Entscheidungen: Wartbarkeit, Betriebskosten, Ressourcen und die Menschen, die mit der Software arbeiten. Bewusstsein und Verantwortung helfen uns, Chancen und Risiken offen abzuwägen – auch dann, wenn sich Rahmenbedingungen ändern.'
      faq:
        label: GUT ZU WISSEN
        title: Häufige Fragen zur Zusammenarbeit
        items:
        - title: Müssen wir schon wissen, was wir modernisieren wollen?
          text: Nein. Gerade wenn die Richtung noch offen ist, kann eine gemeinsame Standortbestimmung sinnvoll sein. Wir betrachten Ausgangslage und Ziele, bewerten Optionen und klären, welche Entscheidung als Nächstes ansteht.
        - title: Arbeiten Sie mit unseren bestehenden Teams und Dienstleistern?
          text: Ja. Wir beziehen die Menschen ein, die die Systeme und Abläufe kennen. Je nach Auftrag helfen wir bei Strategie und Abstimmung oder übernehmen die vereinbarte Steuerung des Vorhabens. Zusätzliche Spezialisten binden wir nur ein, wenn sie gebraucht werden.
        - title: Können Sie auch vorübergehend IT-Verantwortung übernehmen?
          text: Ja, wenn Aufgabe, Mandat und Entscheidungsrahmen geklärt sind. Das kann beispielsweise die Steuerung eines Modernisierungsvorhabens oder eine zeitlich begrenzte IT-Führungsaufgabe sein.
      contact:
        label: DER NÄCHSTE SCHRITT
        title: Welche IT-Entscheidung beschäftigt Sie gerade?
        text: Sie möchten Ihre IT neu ausrichten, eine wichtige Anwendung modernisieren oder ein festgefahrenes Vorhaben voranbringen? Erzählen Sie uns, wo Sie stehen. Gemeinsam überlegen wir, welcher nächste Schritt sinnvoll ist.
        primary: Unverbindlich ins Gespräch kommen
        alternative: Oder schreiben Sie direkt an
      ai:
        label: NEUE MÖGLICHKEITEN DURCH KI
        title: KI sinnvoll einsetzen. Mit klarem Blick auf den Nutzen.
        paragraphs:
        - Künstliche Intelligenz eröffnet neue Möglichkeiten, Software besser zu verstehen, zu entwickeln und zu modernisieren. Gerade bei gewachsenen Systemen kann sie helfen, vorhandenes Fachwissen zu erschließen, Abhängigkeiten sichtbar zu machen und die Qualitätssicherung zu unterstützen. So lassen sich Veränderungen besser vorbereiten und fundiertere Entscheidungen treffen.
        - Wir beziehen diese Möglichkeiten in unsere Strategie- und Modernisierungsarbeit ein. Welche Werkzeuge sinnvoll sind, hängt von Ihren Zielen, Ihrer IT-Landschaft und den verfügbaren Informationen ab. Dabei berücksichtigen wir Wirtschaftlichkeit, Datenschutz, Sicherheit, Qualität und mögliche neue Abhängigkeiten.
        closing: "<strong>Unser Anspruch:</strong> Die Möglichkeiten moderner Technologie nutzen, ohne dabei fachliches Urteilsvermögen und Verantwortung aus der Hand zu geben."
      experience:
        label: ERFAHRUNG ALS GRUNDLAGE
        text: Wir kennen Software aus eigener Entwicklung, langfristiger Produktverantwortung und technischer Führung. Bei Dücker haben wir beispielsweise Fachbereiche und Entwicklung zusammengebracht, die fachlichen Zusammenhänge einer gewachsenen Software geklärt und bestehende Geschäftsregeln für die weitere Modernisierung aufbereitet.
        link: Modernisierung bei Dücker ansehen
        url: "/projects/duecker.html"
    software_delivery:
      meta_title: Organisation & Software-Delivery | mehr.wert
      hero:
        label: ORGANISATION & SOFTWARE-DELIVERY
        title: Damit Strategie im Alltag ankommt. Und Teams verlässlich liefern.
        paragraphs:
        - Auch gute Teams kommen ins Stocken, wenn Prioritäten, Abhängigkeiten und Entscheidungen nicht zusammenpassen. Wir bringen Führungskräfte und Teams zusammen, unterstützen konkrete Verbesserungen im Alltag und überprüfen gemeinsam, was sich dadurch verändert. Dabei passen wir das Vorgehen an Ihre Organisation und neue Erkenntnisse an.
        primary: Unverbindlich ins Gespräch kommen
        secondary: So unterstützen wir
      description: Damit Strategie im Alltag ankommt. Und Teams gemeinsam verlässlich liefern können.
      situations:
        label: WENN ZUSAMMENARBEIT KOMPLEX WIRD
        title: Kommen Ihnen diese Situationen bekannt vor?
        items:
        - title: Jedes Team hat einen Plan. Der gemeinsame fehlt.
          text: Prioritäten und Abhängigkeiten werden erst spät abgestimmt. Was für ein Team sinnvoll ist, passt nicht immer zum Ganzen – und gemeinsame Zusagen werden unsicher.
        - title: Die Projektplanung steht. Die tatsächliche Delivery bleibt schwer einschätzbar.
          text: Budgets und Termine sind geplant. Engpässe und neue Erkenntnisse aus der Entwicklung erreichen die Projektsteuerung jedoch zu spät, um rechtzeitig über Prioritäten, Umfang oder Termine zu entscheiden.
        - title: Agile Arbeitsweisen sind eingeführt. Trotzdem hakt es.
          text: Unterschiedliche Qualitätsmaßstäbe und unklare Übergaben führen zu Rückfragen und Nacharbeit. Oft fehlen gemeinsame Vereinbarungen, die im Alltag auch angewendet werden.
        - title: Verbesserungen sind bekannt. Im Alltag bleibt vieles liegen.
          text: Gute Ideen aus Retrospektiven oder Workshops kommen nicht voran, wenn Zeit, Zuständigkeiten oder Unterstützung fehlen. Führung und Teams müssen Veränderungen gemeinsam möglich machen.
      benefits:
        label: WORAUF ES ANKOMMT
        title: Gute Zusammenarbeit zeigt sich darin, dass Arbeit vorankommt.
        intro: Vom Kundenbedarf bis zur fertigen Software soll Arbeit möglichst reibungslos durch die Organisation fließen. Dafür brauchen Teams eine gemeinsame Richtung, klare Absprachen und die Möglichkeit, Hindernisse frühzeitig zu erkennen.
        items:
        - title: Gemeinsame Richtung
          text: Prioritäten und Abhängigkeiten über Teamgrenzen hinweg klären.
        - title: Weniger Reibung
          text: Übergaben vereinfachen, Rückfragen und Wartezeiten reduzieren.
        - title: Bessere Entscheidungen
          text: Fortschritt und Hindernisse sichtbar machen und gemeinsam nachsteuern.
      voice:
        title: Was Menschen aus der Zusammenarbeit mitnehmen.
      support:
        label: UNSERE UNTERSTÜTZUNG
        title: Was wir gemeinsam verbessern können.
        intro: Mal braucht es eine gemeinsame Planung über mehrere Teams. Mal sind es die täglichen Arbeitsweisen oder die Umsetzung längst bekannter Verbesserungen. Wir konzentrieren uns auf das, was in Ihrer Organisation gerade hilft.
        results_label: 'Mögliche Arbeitsergebnisse:'
        items:
        - title: Ziele, Planung und Teams verbinden
          text: 'Wir stimmen mit Führungskräften, Product Ownern und Teams Prioritäten ab, machen Abhängigkeiten sichtbar und schaffen eine Planung, die im Alltag Orientierung gibt. Ob Quartalsplanung oder ein einfacheres Abstimmungsformat: Wir richten die Zusammenarbeit an Ihrer Organisation aus.'
          result: Abgestimmte Ziele und Prioritäten · sichtbare Abhängigkeiten · passende Planungs- und Rückkopplungsformate.
        - title: Arbeitsweisen und Qualität verbessern
          text: Wir schauen gemeinsam auf Rückfragen, Wartezeiten und Nacharbeit – etwa durch unklare Anforderungen oder Übergaben. Mit den Beteiligten entwickeln wir praktikable Vereinbarungen und unterstützen ihre Anwendung im Alltag.
          result: Besser vorbereitete Arbeit · gemeinsame Qualitätskriterien · klarere Übergaben.
        - title: Verbesserungen begleiten und Wirkung prüfen
          text: Wir unterstützen Führung und Teams dabei, Veränderungen im Alltag anzuwenden. Gemeinsam prüfen wir, ob sich beispielsweise Durchlaufzeiten, Nacharbeit oder die Verlässlichkeit der Lieferung verbessern. Dafür nutzen wir passende Kennzahlen und Rückmeldungen und passen Maßnahmen an, wenn sie nicht die gewünschte Wirkung zeigen.
          result: Konkrete Verbesserungen mit Verantwortlichen · regelmäßiges Feedback · geeignete Messsignale für Entscheidungen.
      ai:
        label: SOFTWARE-DELIVERY IM WANDEL
        title: Wenn KI die Entwicklung verändert, muss die Zusammenarbeit mitwachsen.
        paragraphs:
        - 'KI kann die Analyse, Entwicklung, Tests und Dokumentation von Software verändern. Damit entstehen neue Fragen: Wer prüft Ergebnisse? Wie bleibt die Qualität gesichert? Wie müssen Abstimmung und Feedback aussehen, wenn sich Arbeit verändert?'
        - Wir betrachten Werkzeuge und Zusammenarbeit gemeinsam. Ob Verantwortlichkeiten, Qualitätsprüfungen oder Arbeitsweisen angepasst werden sollten, hängt von den tatsächlichen Möglichkeiten und Anforderungen ab. Entscheidend bleiben Nutzen, Sicherheit und nachvollziehbare Ergebnisse.
      engagements:
        label: ZUSAMMENARBEIT
        title: Veränderung braucht Menschen, die Verantwortung übernehmen.
        paragraphs:
        - 'Wir übernehmen Verantwortung für die vereinbarten Aufgaben: Wir entwickeln mit den Beteiligten passende Maßnahmen, begleiten ihre Einführung, sprechen Hindernisse offen an und steuern bei Bedarf nach.'
        - Damit Verbesserungen im Alltag bestehen bleiben, braucht es auch Führung, die Prioritäten setzt, Entscheidungen trifft und Zeit für Veränderungen ermöglicht. Wir arbeiten mit Ihren Teams und bestehenden Partnern – punktuell oder über längere Zeit, je nach Aufgabe.
      values:
        label: NACHHALTIG BESSERE SOFTWARE
        title: Gute Zusammenarbeit soll bleiben – auch wenn unsere Begleitung endet.
        paragraphs:
        - 'Wir helfen, Arbeitsweisen zu entwickeln, die Teams selbst weiterführen können. Dazu gehört auch, auf Termine und Regeln zu verzichten, wenn sie keinen Nutzen bringen. Bewusstsein und Verantwortung aus Green Agile prägen diesen Anspruch: Folgen erkennen, Entscheidungen tragen und Zusammenarbeit so gestalten, dass sie auf Dauer funktioniert.'
        link: Bewusstsein und Verantwortung im Green Agile Guide
        url: "/green-agile-guide.html"
      faq:
        label: GUT ZU WISSEN
        title: Häufige Fragen zur Zusammenarbeit
        items:
        - title: Müssen unsere Teams bereits agil arbeiten?
          text: Nein. Entscheidend ist nicht, welches Vorgehensmodell Sie heute verwenden, sondern welche Probleme Sie lösen möchten. Wir knüpfen an vorhandene Strukturen an und entwickeln mit Ihnen die Arbeitsweisen, die tatsächlich helfen.
        - title: Müssen wir unsere bestehenden Planungs- und Arbeitsweisen grundlegend verändern?
          text: Nicht unbedingt. Wir beginnen mit dem, was bereits funktioniert, und betrachten gemeinsam, wo Veränderungen sinnvoll sind. Projekt- und Portfolioplanung, die tägliche Arbeit der Teams und die Steuerung durch das Management müssen nicht nach derselben Methode funktionieren. Entscheidend ist, dass sie zusammenpassen und notwendige Entscheidungen rechtzeitig möglich machen.
        - title: Wie erkennen wir, ob sich die Software-Delivery verbessert?
          text: Wir schauen zunächst darauf, welche Wirkung Sie erreichen möchten – etwa bessere Planbarkeit, weniger Wartezeiten oder höhere Qualität. Darauf abgestimmt wählen wir geeignete Beobachtungen und Kennzahlen. Sie sollen Teams bei Verbesserungen unterstützen und fundierte Entscheidungen ermöglichen, nicht einzelne Menschen oder Teams gegeneinander ausspielen.
        - title: Wer sorgt dafür, dass neue Arbeitsweisen dauerhaft genutzt werden?
          text: Wir gestalten und begleiten die Einführung, prüfen die Anwendung und machen Hindernisse sichtbar. Für Prioritäten, notwendige Kapazitäten und verbindliche Entscheidungen braucht es das Management und die jeweiligen Teams. Genau diese Zusammenarbeit bauen wir von Anfang an mit auf.
      contact:
        label: DER NÄCHSTE SCHRITT
        title: Was soll in Ihrer Software-Delivery besser funktionieren?
        text: Vielleicht möchten Sie mehrere Teams besser aufeinander abstimmen, Planung verlässlicher machen oder eine begonnene Veränderung endlich in die Praxis bringen. Erzählen Sie uns, was Sie beschäftigt. Gemeinsam klären wir, wo mehr.wert sinnvoll unterstützen kann.
        primary: Unverbindlich ins Gespräch kommen
        alternative: Oder schreiben Sie direkt an kontakt@mehrwert.tech.
      experience:
        label: ERFAHRUNG ALS GRUNDLAGE
        text: Aus eigener Softwareentwicklung, technischer Führung und der Zusammenarbeit mit Führungskräften und Teams kennen wir unterschiedliche Perspektiven. Zwei Erfahrungen zeigen, wie verschieden die Aufgaben in der Praxis sind.
        link: Mehr zu Projekten & Erfahrung
        url: "/projects.html"
        items:
        - title: EnBW Trading IT
          origin: Frühere Berufserfahrung · Marcel Russ
          text: In meiner früheren Tätigkeit habe ich die teamübergreifende Quartalsplanung und gemeinsame Onsite-Wochen mitgestaltet. Die Formate wurden zu einer wiederkehrenden Grundlage für Abstimmung und Entscheidungen.
          link: EnBW-Erfahrung ansehen
          url: "/projects/enbw.html"
        - title: Viridium
          origin: Laufendes Kundenmandat · mehr.wert
          text: Bei Viridium unterstützen wir eine IT-Organisation mit zwölf Squads beim Aufbau gemeinsamer Arbeits- und Qualitätsgrundlagen. Über die Community of Practice fördern wir den Austausch und entwickeln gemeinsame Vereinbarungen. Ihre Anwendung begleiten wir gezielt in einzelnen Squads.
          link: Viridium-Erfahrung ansehen
          url: "/projects/viridium.html"
  about:
    meta_title: Über mehr.wert | mehr.wert
    description: Nachhaltig bessere Software. Aus Überzeugung.
    hero:
      label: ÜBER MEHR.WERT
      title: Nachhaltig bessere Software. Aus Überzeugung.
      paragraphs:
      - Software ist für uns nie nur Technik. Sie beeinflusst, wie Menschen arbeiten, wie Unternehmen entscheiden und wie gut sich Dinge verändern lassen. Wir möchten dazu beitragen, dass aus guten Ideen etwas wird, das im Alltag trägt. Mit eigener Erfahrung, einem offenen Blick und der Bereitschaft, Verantwortung zu übernehmen.
      primary: Den Menschen hinter mehr.wert kennenlernen
      secondary: So arbeiten wir zusammen
    story:
      label: WARUM ES MEHR.WERT GIBT
      title: Warum ich mehr.wert gegründet habe.
      paragraphs:
      - 'Ich habe meine Laufbahn als Softwareentwickler und Berater begonnen. Schon vor meiner Zeit bei HUGO BOSS habe ich in ganz unterschiedlichen Branchen gearbeitet – unter anderem im Automobil- und Industrieumfeld. Dabei musste ich mich immer wieder in neue Fachgebiete, Abläufe und Menschen hineindenken. Das hat meinen Blick geprägt: Gute Software entsteht nicht allein durch gute Technik. Man muss verstehen, wofür sie gebraucht wird und wer später damit arbeitet.'
      - Mit meiner App myWork habe ich außerdem ein eigenes Produkt entwickelt, über viele Jahre weiterentwickelt und betrieben. Dabei erlebt man unmittelbar, wie lange technische Entscheidungen nachwirken, wie sich Anforderungen verändern und wie wichtig die Rückmeldungen der Menschen sind, die eine Anwendung täglich nutzen.
      - 'Später habe ich bei HUGO BOSS Web- und Mobile-Teams geführt und digitale Produkte verantwortet. Bei Exxeta und in der EnBW Trading IT kamen Modernisierung, Strategie und die Zusammenarbeit größerer Organisationen hinzu. Dabei ist mir eines immer wieder begegnet: Es fehlt selten an guten Ideen oder klugen Menschen. Schwieriger wird es, wenn Entscheidungen liegen bleiben, Verantwortlichkeiten unklar sind oder Veränderungen im Alltag nicht ankommen.'
      - 2024 habe ich mehr.wert gegründet, weil ich diese Erfahrungen zusammenbringen wollte. Ich möchte Unternehmen unabhängig begleiten, meine Einschätzung offen vertreten und Verantwortung für die Arbeit übernehmen, die wir gemeinsam vereinbaren. Dabei geht es mir nicht darum, möglichst viel zu verändern. Sondern herauszufinden, was tatsächlich besser werden kann – und was bereits gut funktioniert und bleiben sollte.
      - Ich glaube an Erfahrung, aber nicht an fertige Antworten für jede Situation. Deshalb höre ich zu, hinterfrage auch meine eigenen Annahmen und bleibe offen für neue Erkenntnisse. Gemeinsam mit den Menschen, die das Unternehmen und seine Herausforderungen am besten kennen, finden wir den passenden Weg.
      signature: Marcel Russ · Gründer und Geschäftsführer
      link: Projekte & Erfahrung ansehen
      url: "/projects.html"
      portrait: "/assets/images/banner/2023.avif"
      portrait_alt: Marcel Russ, Gründer und Geschäftsführer von mehr.wert
      caption: Marcel Russ - Diplom Informatiker, Universität Stutgart
      anecdote: Der Name mehr.wert geht übrigens auf einen Kunden zurück, der einmal meinte, ich sei mehr wert als all die teuren Berater aus den großen Häusern zusammen – darüber musste ich schmunzeln, aber der Anspruch ist geblieben.
    network:
      diagram:
        core: mehr.wert · Marcel Russ
        responsibility: Ihr direkter Ansprechpartner
        expertise: Fachleute aus meinem Netzwerk
        customer: Ihre eigenen Teams und bestehenden Partner
      label: SO SIND WIR AUFGESTELLT
      title: Ein fester Kern. Ein Netzwerk, das zur Aufgabe passt.
      paragraphs:
      - mehr.wert ist bewusst persönlich geführt. Ich bin Ihr direkter Ansprechpartner, entwickle mit Ihnen die Richtung und gestalte die Zusammenarbeit. Für die Aufgaben, die wir vereinbaren, übernehme ich Verantwortung – vom ersten Gespräch bis zu den nächsten Schritten in der Praxis.
      - 'Nicht jedes Vorhaben braucht dieselben Menschen oder ein großes Projektteam. Wenn zusätzliche Erfahrung oder besondere technische Fähigkeiten nötig sind, arbeite ich mit Fachleuten aus meinem Netzwerk zusammen. So entsteht ein bedarfsgerecht zusammengestelltes Kollektiv: mit einem klaren Kern, ergänzender Expertise und so wenig organisatorischem Aufwand wie sinnvoll.'
      - Ihre eigenen Teams und bestehenden Partner bleiben dabei eingebunden. Wir ergänzen, was fehlt, statt funktionierende Strukturen zu ersetzen. Und auch wenn weitere Spezialisten mitarbeiten, wissen Sie immer, an wen Sie sich wenden können.
    approach:
      label: UNSERE ARBEITSWEISE
      title: Wir bringen Erfahrung mit. Und bleiben offen für das, was wir lernen.
      paragraphs:
      - Zu Beginn möchte ich verstehen, was Sie beschäftigt, was bereits gut läuft und wo Sie sich Veränderung wünschen. Wir schauen auf die technischen Fragen, aber genauso auf die Menschen, die später mit den Ergebnissen arbeiten sollen. Ihre Branche, Ihre Kultur und die vorhandenen Möglichkeiten sind dabei wichtiger als irgendein Standardmodell.
      - Manchmal braucht es vor allem eine klare Entscheidung. Manchmal hilft ein kleiner, überschaubarer Versuch, bevor viel Geld und Zeit gebunden werden. Und manchmal ist die beste Empfehlung, etwas bewusst nicht zu verändern. Wir nutzen die Arbeitsweisen und Methoden, die in der jeweiligen Situation helfen – und lassen den Rest weg.
      - Wenn wir etwas verändern, interessieren uns die Folgen im Alltag. Wir holen Rückmeldungen ein, schauen auf passende Kennzahlen und sprechen offen darüber, was funktioniert und was nicht. Daraus ergeben sich die nächsten Schritte. Gemeinsam, mit klaren Zuständigkeiten und der Bereitschaft, den Kurs zu korrigieren.
    values:
      sustainability_link: Unsere Haltung zur Nachhaltigkeit
      label: WAS UNS WICHTIG IST
      title: Nachhaltig besser. Für Unternehmen, Menschen und Umwelt.
      paragraphs:
      - Auch der Planet ist für uns ein Stakeholder – selbst wenn er in keinem unserer Meetings sitzt.
      - Bewusstsein und Verantwortung aus Green Agile helfen uns, diese Perspektiven zusammenzubringen. Wir schauen auf Chancen und Zielkonflikte, begründen unsere Empfehlungen und übernehmen Verantwortung für die vereinbarten Aufgaben. Nicht alles lässt sich gleichzeitig optimieren. Aber wir sollten wissen, welche Folgen unsere Entscheidungen haben.
      - Diese Haltung prägt auch unsere eigene Zusammenarbeit. Wir setzen bewährte agile Ansätze und neue Technologien dort ein, wo sie helfen, und überprüfen gemeinsam, ob sie den gewünschten Nutzen bringen.
      link: Green Agile Guide kennenlernen
      url: "/green-agile-guide.html"
      intro: Nachhaltig bessere Software bedeutet für uns mehr als geringere Kosten oder eine längere Lebensdauer. Wir möchten Lösungen mitgestalten, die wirtschaftlich sinnvoll sind, Menschen unterstützen und verantwortungsvoll mit den Ressourcen unseres Planeten umgehen. Alle drei Perspektiven gehören für uns zu einer guten Entscheidung.
      items:
      - title: Wirtschaftlich
        text: Software soll einen echten Nutzen bringen und langfristig tragfähig bleiben. Deshalb betrachten wir nicht nur die Entwicklungskosten, sondern auch Betrieb, Wartbarkeit, Abhängigkeiten und die Möglichkeiten, später etwas zu verändern.
      - title: Sozial
        text: Software wird von Menschen entwickelt und für Menschen gemacht. Wir achten darauf, wie sie den Arbeitsalltag beeinflusst, ob sie zugänglich und verständlich ist und wie Teams zusammenarbeiten. Gute Lösungen sollen Menschen unterstützen, nicht zusätzliche Hürden schaffen.
      - title: Ökologisch
        text: Auch Software verbraucht Energie und Ressourcen. Rechenleistung, Datenübertragung, Infrastruktur und die Lebensdauer von Systemen haben Auswirkungen auf unsere Umwelt. Diese Folgen möchten wir bewusst berücksichtigen und dort verbessern, wo es sinnvoll und möglich ist.
