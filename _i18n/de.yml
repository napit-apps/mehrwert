    about:
      title: Über mehr.wert
      meta_title: Über mehr.wert | mehr.wert
      description: Nachhaltig bessere Software. Aus Überzeugung.
      url: "/mission.html"
      hero:
        label: ÜBER MEHR.WERT
        title: Nachhaltig bessere Software. Aus Überzeugung.
        paragraphs:
        - 'Wir sind überzeugt: Gute IT zeigt ihren Wert nicht allein daran, was technisch möglich ist. Entscheidend ist, was sie für ein Unternehmen leistet – heute und auf lange Sicht. Dafür verbinden wir Erfahrung aus der Softwareentwicklung mit strategischem Denken, einem Blick für Menschen und der Bereitschaft, Verantwortung zu übernehmen.'
        - mehr.wert steht für Beratung, die sorgfältig hinschaut, Klarheit schafft und Veränderungen auch in der Umsetzung begleitet. Unabhängig, persönlich und immer mit dem Ziel, Lösungen zu finden, die wirklich zum Unternehmen passen.
        primary: Lernen Sie uns kennen
        secondary: Unsere Arbeitsweise
      why:
        label: WARUM ES MEHR.WERT GIBT
        title: Warum ich mehr.wert gegründet habe.
        paragraphs:
        - Ich habe Software selbst entwickelt, eigene Produkte über Jahre betreut, technische Teams geführt und Unternehmen bei Veränderungen begleitet. Dabei habe ich erlebt, wie wichtig es ist, technische Entscheidungen mit den Menschen und den Abläufen im Unternehmen zusammenzudenken. Eine gute Idee allein reicht selten aus. Sie muss auch im Alltag funktionieren.
        - 2024 habe ich mehr.wert gegründet, um diese Erfahrungen in meiner eigenen Beratung zusammenzubringen. Ich möchte Unternehmen unabhängig bei wichtigen IT-Entscheidungen unterstützen und Verantwortung dafür übernehmen, dass aus einer gemeinsamen Richtung auch konkrete, tragfähige Schritte werden.
        - Mir geht es nicht darum, möglichst viel zu verändern. Sondern darum, gemeinsam zu erkennen, was wirklich besser werden sollte – und den passenden Weg dafür zu finden.
        signature: Marcel Russ · Gründer und Geschäftsführer
      network:
        label: SO SIND WIR AUFGESTELLT
        title: Persönlich im Kern. Offen für die passende Expertise.
        paragraphs:
        - mehr.wert ist bewusst persönlich geführt. Sie arbeiten direkt mit dem Gründer und dem Menschen, der Ihr Mandat verantwortet. Das bedeutet kurze Wege, klare Absprachen und einen Ansprechpartner, der Ihre Situation kennt.
        - Wenn ein Vorhaben zusätzliche Fähigkeiten erfordert, beziehen wir erfahrene Spezialisten und internationale Entwicklungspartner ein. Umfang und Zusammenarbeit richten sich nach der Aufgabe. Die Verantwortung für unser Mandat bleibt bei mehr.wert.
      person:
        label: PERSÖNLICH VERANTWORTLICH
        title: Ich bin Marcel Russ. Mein Ausgangspunkt ist die Softwareentwicklung.
        paragraphs:
        - Ich bin Diplom-Informatiker mit Schwerpunkt Softwaretechnik und habe meine Laufbahn als Softwareentwickler begonnen. Mit myWork habe ich außerdem ein eigenes Softwareprodukt entwickelt, das ich über viele Jahre betrieben und weiterentwickelt habe. Dabei lernt man, was technische Entscheidungen langfristig bedeuten – nicht nur beim ersten Release, sondern auch im täglichen Betrieb.
        - Später habe ich bei HUGO BOSS Web- und Mobile-Teams geführt und Verantwortung für digitale Produkte übernommen. Bei Exxeta arbeitete ich in der Enterprise-Modernisierung; im Umfeld der EnBW Trading IT habe ich Führungskräfte und Teams bei der Organisationsentwicklung und teamübergreifenden Steuerung begleitet. Auch die Arbeit mit internationalen Entwicklungspartnern gehört zu meiner Erfahrung.
        - 'Heute bringe ich diese Perspektiven bei mehr.wert zusammen. Ich verstehe die Fragen, die Entwicklungsteams beschäftigen, ebenso wie die Entscheidungen, die Führungskräfte treffen müssen. Mir ist wichtig, dass beides zusammenpasst: eine fachlich gute Entscheidung und ein Weg, der unter realen Bedingungen funktioniert.'
        items:
        - title: Software & Produkte
          text: Eigene Software entwickeln, betreiben und über Jahre weiterentwickeln – unter anderem die Zeiterfassungs-App myWork.
        - title: Technische Führung
          text: Web- und Mobile-Teams führen, digitale Produkte verantworten und standortübergreifende Zusammenarbeit gestalten.
        - title: Strategie & Veränderung
          text: Modernisierungsvorhaben beraten, Führung und Teams begleiten und Software-Delivery über Organisationsgrenzen hinweg verbessern.
        link: Mehr zu Projekten & Erfahrung
        url: "/projects.html"
        portrait_alt: Marcel Russ, Gründer und Geschäftsführer von mehr.wert
      approach:
        label: UNSERE ARBEITSWEISE
        title: Verstehen. Konzipieren. Begleiten.
        intro: 'Jedes Mandat ist anders. Die Art, wie wir vorgehen, folgt dennoch einer einfachen Idee: Erst die Situation wirklich verstehen, dann einen passenden Weg entwickeln und schließlich dafür sorgen, dass daraus konkrete Schritte werden.'
        items:
        - title: Verstehen
          text: Wir hören zu, stellen Fragen und betrachten Technologie, Geschäftsanforderungen und Organisation gemeinsam. Wir wollen wissen, was heute funktioniert, was im Weg steht und was verändert werden soll.
        - title: Konzipieren
          text: Wir entwickeln mit den Verantwortlichen ein klares Zielbild, bewerten Alternativen und übersetzen Entscheidungen in nachvollziehbare Prioritäten und umsetzbare Schritte.
        - title: Begleiten
          text: Wir unterstützen die Beteiligten bei der Umsetzung, machen Hindernisse sichtbar und prüfen gemeinsam, ob die Veränderungen ihren Zweck erfüllen. Wo nötig, steuern wir innerhalb unseres Mandats nach.
      values:
        label: UNSER QUALITÄTSANSPRUCH
        title: Gute Entscheidungen sollen lange tragen.
        intro: "„Nachhaltig bessere Software“ ist für uns ein Qualitätsanspruch. Wir achten nicht nur darauf, ob eine Lösung heute funktioniert. Wir betrachten auch, wie sie sich später verändern, betreiben und wirtschaftlich sinnvoll nutzen lässt – und welche Folgen Entscheidungen für die Menschen haben, die damit arbeiten."
        items:
        - title: Bewusstsein
          text: Wir schaffen Klarheit über Chancen, Risiken und Zielkonflikte. Dabei berücksichtigen wir Technik und Architektur ebenso wie Kosten, Ressourcen, Zusammenarbeit und den zukünftigen Handlungsspielraum des Unternehmens.
        - title: Verantwortung
          text: Wir geben begründete Empfehlungen, begleiten die vereinbarten Schritte und sprechen Hindernisse offen an. Wir prüfen, was unsere Arbeit bewirkt, und steuern innerhalb unseres Mandats nach, wenn es nötig ist.
        closing: Diese Haltung steckt auch hinter dem Green Agile Guide, mit dem wir Nachhaltigkeit in bestehende agile Arbeitsweisen einbringen. Neue Technologien und KI nutzen wir dort, wo sie helfen – mit demselben Anspruch an Qualität, Sicherheit und Verantwortung.
        link: Mehr über den Green Agile Guide
        url: "/green-agile-guide.html"
