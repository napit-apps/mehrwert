  title : "Unsere Kernkompetenzen"

  skills-left:
  - name: "Agile Coaching & Mentoring"
    modal_id: "skill-1"
    description: "Wir begleiten Teams, Scrum Master und Führungskräfte auf dem Weg zur agilen Exzellenz. Unser Coaching verbessert Zusammenarbeit, Entscheidungsprozesse und fördert eine nachhaltige agile Kultur."

  - name: "Skalierte Agilität (SAFe, LeSS, Nexus)"
    modal_id: "skill-2"
    description: "Wir helfen Unternehmen, agile Methoden erfolgreich zu skalieren – von Teams bis zur gesamten Organisation. Mit SAFe, LeSS und Nexus schaffen wir nachhaltige Strukturen für agile Skalierung."

  - name: "Change Management & Agile Transformation"
    modal_id: "skill-3"
    description: "Wir begleiten Organisationen durch agile Transformationsprozesse, reduzieren Widerstände und schaffen Strukturen, die nachhaltige Agilität ermöglichen."

  - name: "Portfolio- & Programmmanagement"
    modal_id: "skill-4"
    description: "Wir optimieren die Steuerung agiler Programme und Portfolios – mit klaren Prioritäten, Wertfokus und strategischer Ausrichtung."

  - name: "Agile Führungsstrategien"
    modal_id: "skill-5"
    description: "Wir befähigen Führungskräfte, agile Prinzipien nachhaltig zu leben und ihre Organisation in eine resiliente und anpassungsfähige Zukunft zu führen."

  - name: "Teamentwicklung & Konfliktlösung"
    modal_id: "skill-6"
    description: "Wir fördern Zusammenarbeit, lösen Hindernisse und schaffen eine Teamkultur, die auf Vertrauen, Respekt und kontinuierlicher Verbesserung basiert."

  skills-right:
  - name: "Green Coding & Energieeffizienz"
    modal_id: "skill-7"
    description: "Wir optimieren Code & Softwarearchitektur für geringeren Energieverbrauch und höhere Effizienz – für nachhaltige, leistungsfähige IT."

  - name: "Messbare Nachhaltigkeit & IT-Transparenz"
    modal_id: "skill-8"
    description: "Wir definieren KPIs für nachhaltige Softwareentwicklung und unterstützen Unternehmen bei der Vorbereitung auf CSRD-Anforderungen."

  - name: "Nachhaltigkeit im Software Development Lifecycle (SDLC)"
    modal_id: "skill-9"
    description: "Wir integrieren ökologische Verantwortung in den gesamten Entwicklungsprozess – von Architektur über Programmierung bis zum Betrieb."

  - name: "Energieprofilierung & Optimierung von Software"
    modal_id: "skill-10"
    description: "Durch gezielte Analyse und Optimierung reduzieren wir den Energieverbrauch Ihrer IT-Systeme messbar."

  - name: "Schulungen zu Green IT & nachhaltiger Softwareentwicklung"
    modal_id: "skill-11"
    description: "Wir vermitteln Wissen & Best Practices zu Green Coding, energieeffizienter Softwareentwicklung und nachhaltigen IT-Strategien."

