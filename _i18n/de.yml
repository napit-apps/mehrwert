    details:
      duecker:
        hero:
          eyebrow: KUNDENMANDAT · MEHR.WERT
          title: Eine geschäftskritische Softwareplattform modernisieren
          lead: Gewachsene Software zukunftsfähig weiterentwickeln – indem Fachbereiche und Entwicklung eine gemeinsame Grundlage für Entscheidungen und Umsetzung schaffen.
          context: Laufendes Modernisierungsvorhaben · Fachliche und technische Zusammenarbeit · IT-Strategie
          client: Dücker
        situation:
          title: Die Anwendung ist unverzichtbar. Das Wissen darüber ist verteilt.
          paragraphs:
          - Wenn eine Software über viele Jahre das Geschäft unterstützt, steckt in ihr häufig weit mehr als Programmcode. Gewachsene Abläufe, fachliche Entscheidungen und Sonderregeln sind Teil des täglichen Betriebs. Nicht alles davon ist außerhalb der Anwendung vollständig dokumentiert.
          - In diesem Vorhaben kamen unterschiedliche Bereiche mit ihren eigenen Perspektiven auf die bestehende Plattform zusammen. Ein übergreifend geteiltes Domänenverständnis und ein gemeinsamer Modernisierungsweg mussten erst entstehen. Die Aufgabe bestand darin, notwendige Veränderungen vorzubereiten, ohne das wertvolle Wissen aus dem heutigen System zu verlieren.
        role:
          title: 'Unsere Aufgabe: die Beteiligten zusammenbringen und Modernisierung konkret vorbereiten.'
          paragraphs:
          - Wir begleiten das Unternehmen bei der fachlichen und strategischen Vorbereitung seiner Softwaremodernisierung. Dazu verbinden wir die Perspektiven der Fachbereiche mit denen der Entwicklung, strukturieren die offenen Fragen und unterstützen dabei, aus unterschiedlichen Vorstellungen eine gemeinsam getragene Richtung zu entwickeln.
          - Ein wichtiger Teil unserer Verantwortung ist, die Arbeitsergebnisse so aufzubereiten, dass sie über die Abstimmung hinaus für die weitere Entwicklung verwendbar werden. Die technische Umsetzung liegt bei den beteiligten Entwicklungsteams. mehr.wert begleitet die vereinbarte Modernisierungsarbeit und sorgt für die Verbindung zwischen fachlicher Klärung und Umsetzungsvorbereitung.
        transfer:
          title: Was diese Erfahrung für andere Modernisierungsvorhaben relevant macht.
          paragraphs:
          - Der schwierigste Teil einer Modernisierung ist nicht immer die neue Technologie. Häufig muss zuerst verstanden werden, weshalb eine bestehende Anwendung so funktioniert, wie sie funktioniert – und welche fachlichen Abhängigkeiten daran hängen.
          - Genau deshalb betrachten wir IT-Strategie, Fachdomäne und Umsetzung gemeinsam. Wir helfen, einen verantwortbaren Weg zu entwickeln und die Grundlagen zu schaffen, damit Veränderungen nicht bei einer Zielarchitektur auf dem Papier stehen bleiben.
        closing:
          title: Steht bei Ihnen eine geschäftskritische Anwendung vor Veränderungen?
          paragraphs:
          - 'Ob Modernisierung, schrittweise Weiterentwicklung oder Ablösung: Entscheidend ist zunächst ein klares Verständnis der Ausgangslage. Sprechen wir darüber, welche Entscheidungen in Ihrem Vorhaben anstehen.'
          links:
          - title: IT-Strategie & Modernisierung
            url: "/services/it-strategy-modernisation.html"
          - title: Alle Projekte & Erfahrungen ansehen
            url: "/projects.html"
          - title: Unverbindlich ins Gespräch kommen
            url: "/contact.html"
        approach:
          title: Erst verstehen, was erhalten bleiben muss. Dann den nächsten Schritt festlegen.
          items:
          - title: Ein gemeinsames Domänenverständnis schaffen
            text: Beteiligte aus zuvor getrennt arbeitenden Bereichen kamen zusammen, um Geschäftsabläufe, Begriffe und Zusammenhänge gemeinsam zu betrachten. So konnten unterschiedliche Sichtweisen geklärt und ein gemeinsames Verständnis der fachlichen Anforderungen aufgebaut werden.
          - title: Bestehende Geschäftsregeln zugänglich machen
            text: Wichtige fachliche Regeln waren in der bestehenden Software verankert. Wir haben diese Regeln herausgearbeitet, strukturiert und an die Entwicklung übergeben. Damit wurde Wissen aus dem Bestand zu einer konkreten Grundlage für die nächsten technischen Schritte.
          - title: Einen tragfähigen Modernisierungsweg abstimmen
            text: Auf dieser Grundlage wurde gemeinsam eine Modernisierungsstrategie erarbeitet. Sie verbindet die fachlichen Anforderungen mit den Möglichkeiten der Umsetzung und schafft Orientierung dafür, wie das Vorhaben schrittweise weitergeführt werden kann.
          intro: Im Mittelpunkt stand keine vorschnelle Entscheidung für eine neue Technologie. Wir haben an den Grundlagen gearbeitet, die eine fundierte Modernisierung überhaupt erst möglich machen.
        results:
          title: Was bereits entstanden ist.
          items:
          - title: Ein geteiltes Verständnis der Fachdomäne
            text: Zuvor getrennte Bereiche haben ihre Perspektiven zusammengeführt und ein gemeinsames Verständnis der Abläufe und Anforderungen erarbeitet. Damit gibt es eine bessere Basis für fachliche Abstimmungen und weitere Entscheidungen.
