        title: Eine alltägliche Aufgabe, bei der viele kleine Schritte zählen.
        paragraphs:
        - Bei der Fahrzeugannahme müssen Informationen zuverlässig erfasst werden. Dazu gehören unter anderem das Kennzeichen und die Fahrzeugidentifikationsnummer. Werden diese Daten von Hand übertragen, erfordert das Aufmerksamkeit und kann zusätzliche Rückfragen oder Korrekturen nötig machen.
        - Die Aufgabe war, den Erfassungsschritt mit dem Smartphone zu unterstützen. Dafür sollte die Kamera Zeichen erkennen und als digitale Information verfügbar machen. Entscheidend war, dass sich diese technische Möglichkeit sinnvoll in die Arbeit vor Ort einfügt.
      role:
        title: 'Mein Beitrag: mobile Texterkennung technisch umsetzen.'
        paragraphs:
        - In einer früheren beruflichen Rolle habe ich an der technischen Ausarbeitung und Entwicklung einer iOS-Anwendung für diesen Anwendungsfall mitgewirkt. Dazu gehörte, die Möglichkeiten mobiler Bilderkennung für Kennzeichen und Fahrzeugidentifikationsnummern zu untersuchen und in eine nutzbare Anwendung zu übertragen.
        - Die interessante Frage war nicht nur, ob eine Kamera Zeichen erkennen kann. Es ging darum, einen konkreten Erfassungsschritt durch eine passende mobile Lösung zu unterstützen. Die technische Ausarbeitung orientierte sich deshalb am vorgesehenen Arbeitsablauf.
      transfer:
        title: Was ich daraus für heutige Softwarevorhaben mitnehme.
        paragraphs:
        - Nicht jede Verbesserung braucht eine große Plattform oder ein umfassendes Transformationsprogramm. Manchmal macht eine gut durchdachte technische Funktion einen wichtigen Arbeitsschritt einfacher.
        - 'Für meine heutige Arbeit bei mehr.wert ist dabei der Blick auf den gesamten Zusammenhang entscheidend: Was brauchen die Menschen vor Ort, welche Technologie eignet sich dafür und wie lässt sich ihre Qualität unter realen Bedingungen beurteilen?'
      closing:
        title: Sie möchten einen bestehenden Ablauf gezielt digital unterstützen?
        paragraphs:
        - Wir helfen, technische Möglichkeiten im Zusammenhang mit Ihren tatsächlichen Anforderungen zu bewerten – und daraus einen sinnvollen Weg für die Umsetzung abzuleiten.
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Aus einem Kamerabild wird eine nutzbare Information.
        items:
        - title: Den Erfassungsfall verstehen
          text: Kennzeichen und FIN unterscheiden sich in Länge und Darstellung. Für die mobile Anwendung musste klar sein, welche Informationen aufgenommen werden sollen und wie sich dieser Schritt in die Fahrzeugannahme einordnet.
        - title: Mobile Bilderkennung einbinden
          text: Die iOS-Anwendung nutzte die Kamera und optische Texterkennung, um Zeichen aus Fahrzeugdaten aufzunehmen. Ich war an der technischen Ausarbeitung und Umsetzung dieses Funktionsbereichs beteiligt.
        - title: Erkannte Daten in der Anwendung bereitstellen
          text: Ein erkanntes Zeichen ist erst dann hilfreich, wenn daraus eine verständliche Information wird. Deshalb gehörte auch die Einbindung der Erkennung in den mobilen Erfassungsablauf zur Aufgabe.
        intro: Die Lösung verband Bildaufnahme, optische Zeichenerkennung und die Darstellung der erfassten Fahrzeugdaten in einer iOS-Anwendung.
      results:
        title: Was aus dem Projekt entstanden ist.
        paragraphs:
        - Aus der technischen Arbeit entstand eine funktionsfähige iOS-Anwendung zur Erkennung und Erfassung von Fahrzeugdaten. Das Projekt zeigte konkret, wie Bildverarbeitung auf einem Smartphone für eine praktische Aufgabe im Automotive-Umfeld eingesetzt werden kann.
        - Ihr fachlicher Wert liegt in der Verbindung von mobiler Technik, konkretem Prozessverständnis und einer funktionierenden Umsetzung – von der Bildaufnahme bis zur bereitgestellten Information.
      process:
        title: Der Erfassungsweg in drei Schritten.
        steps:
        - Kameraaufnahme
        - Optische Texterkennung
        - Fahrzeugdaten in der App
        caption: Vereinfachte Darstellung des mobilen Erfassungsprinzips.
        intro: 'Das technische Prinzip lässt sich einfach darstellen: Die Kamera liefert das Bild, die Software erkennt Zeichen, und die Anwendung stellt die erfassten Informationen bereit.'
        mode: flow
        feedback: Kennzeichen und FIN sind die beiden Erfassungsfälle dieses Projekts.
    ibeacon-messeinformationen:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Mobile Messeinformationen mit iBeacon-Technologie
        lead: Informationen auf dem Smartphone passend zum jeweiligen Bereich eines Messestands bereitstellen – damit Besucher relevante Inhalte dort entdecken, wo sie gerade gebraucht werden.
        context: Mobile Anwendung · iBeacon · Technische Konzeption und Projektkoordination
      situation:
        title: Informationen sollten dort auftauchen, wo sie relevant sind.
        paragraphs:
        - Ein Messestand bietet viele Produkte und Themen auf engem Raum. Besucher bewegen sich zwischen verschiedenen Bereichen und möchten Informationen zu dem finden, was sie gerade interessiert. Eine klassische Übersicht kann dabei helfen, stellt aber nicht automatisch einen Bezug zum jeweiligen Standort her.
        - 'Für eine mobile Anwendung entstand deshalb die Idee, den Messebesuch stärker mit der Umgebung zu verbinden: Passende Informationen sollten auf dem Smartphone verfügbar werden, wenn sich Besucher in der Nähe eines zugehörigen Bereichs befinden.'
      role:
        title: 'Meine Aufgabe: eine neue Technologie in einen verständlichen Anwendungsfall übersetzen.'
        paragraphs:
        - In einer früheren beruflichen Rolle habe ich die technische Konzeption und Projektkoordination dieser Anwendung verantwortet. Dabei ging es darum, die Möglichkeiten von iBeacon mit den gewünschten Inhalten und dem Besuchsablauf zusammenzubringen.
        - Ebenso wichtig war die Erprobung direkt am Einsatzort. Funksignale und räumliche Gegebenheiten lassen sich nicht allein am Schreibtisch beurteilen. Die Zuordnung von Standbereichen und Informationen musste daher vor Ort überprüft und feinabgestimmt werden.
      transfer:
        title: Was diese Erfahrung für meine heutige Arbeit bedeutet.
        paragraphs:
        - Neue Technologien sind interessant, wenn sie ein echtes Problem lösen oder eine Nutzung spürbar verständlicher machen. Dafür muss man den Kontext kennen, technische Grenzen ernst nehmen und die Lösung unter realen Bedingungen testen.
        - 'Diesen Blick bringe ich heute bei mehr.wert in Technologieentscheidungen ein: Nicht die Neuheit eines Werkzeugs steht im Vordergrund, sondern sein Nutzen und die Frage, ob es im konkreten Umfeld tragfähig funktioniert.'
      closing:
        title: Sie möchten eine neue Technologie sinnvoll einsetzen?
        paragraphs:
        - Wir unterstützen dabei, Möglichkeiten und Grenzen einzuordnen, den passenden Anwendungsfall zu schärfen und einen realistischen Weg zur Umsetzung zu entwickeln.
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Technik und Messeerlebnis aufeinander abstimmen.
        items:
        - title: Bereiche und Inhalte sinnvoll zuordnen
          text: Zunächst musste klar sein, welche Informationen für Besucher in welchen Teilen des Messestands relevant sind. Daraus entstand die fachliche Grundlage für die Zuordnung zwischen Standbereich und mobilem Inhalt.
        - title: iBeacon als Nähe-Signal nutzen
          text: Über iBeacon-Signale konnte die Anwendung eine Annäherung an definierte Bereiche erkennen und dazugehörige Inhalte bereitstellen. Entscheidend war eine nachvollziehbare Nutzung des Signals, nicht die Behauptung einer punktgenauen Indoor-Ortung.
        - title: Die Anwendung am Messestand erproben
          text: Die mobile Lösung wurde entwickelt, am Einsatzort getestet und für die räumliche Situation abgestimmt. Dabei stand im Mittelpunkt, ob die Verbindung aus Signal und Information für die tatsächliche Nutzung funktioniert.
        intro: Die entscheidende Arbeit lag in der Verbindung aus räumlichem Kontext, mobiler Anwendung und verständlicher Informationsdarstellung.
      results:
        title: Eine mobile Anwendung für den Einsatz auf einer internen Messe.
        paragraphs:
        - Aus der Konzeption und Entwicklung entstand eine iBeacon-gestützte Messeanwendung, die auf einer internen Veranstaltung eingesetzt wurde. Die Zuordnung von Standbereichen und Inhalten konnte damit nicht nur als technische Idee betrachtet, sondern im vorgesehenen Umfeld erprobt werden.
        - Der Einsatz erhielt positive Rückmeldungen. Er machte die Verbindung aus räumlichem Kontext und mobilen Inhalten als konkretes Nutzungserlebnis erfahrbar.
      process:
        title: Vom Standbereich zum passenden Inhalt.
        steps:
        - Ausstellungsbereich
        - iBeacon-Nähe-Signal
        - Passende Inhalte in der App
        caption: Vereinfachte Funktionsdarstellung; keine maßstabsgetreue Ortung oder Originalsystemarchitektur.
        intro: Das Prinzip besteht nicht darin, den gesamten Weg eines Besuchers aufzuzeichnen. Relevant ist, dass die App eine Nähe zu einem Bereich erkennt und dazu passende Inhalte anzeigen kann.
        mode: flow
        feedback: Die Zuordnung zwischen Bereich und Information bildet die Grundlage des mobilen Besuchserlebnisses.
    mobile-lieferkoordination:
      publication_status: draft
      hero:
        eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
        title: Lieferaufträge mobil erfassen und koordinieren
        lead: Ein mobiler Prototyp, der Informationen aus dem Lieferalltag für die Disposition nutzbar macht – entwickelt mit Blick auf unterschiedliche Geräteplattformen und reale technische Einschränkungen.
        context: Logistik · Proof of Concept · Xamarin · iOS und Windows Phone
      situation:
        title: Lieferinformationen entstehen unterwegs. Geplant wird zentral.
        paragraphs:
        - Bei einem Logistikdienstleister sollten Informationen zu Lieferaufträgen mobil erfasst und für die zentrale Disposition besser nachvollziehbar gemacht werden. Dafür mussten Daten aus der Arbeit unterwegs und die Sicht der planenden Stelle zusammenfinden.
        - 'Neben der Bedienbarkeit war auch der technische Rahmen entscheidend: Die Anwendung sollte auf unterschiedlichen mobilen Plattformen laufen und Standortinformationen berücksichtigen, ohne die Geräte durch unnötig intensive GPS-Nutzung zu belasten.'
      role:
        title: 'Meine Aufgabe: aus dem Bedarf eine technisch prüfbare Lösung machen.'
        paragraphs:
        - Ich habe in einer früheren beruflichen Rolle die Konzeption und technische Steuerung des Vorhabens übernommen. Dazu gehörten die Abstimmung mit dem Auftraggeber, die Strukturierung der mobilen Abläufe und die Koordination der plattformübergreifenden Entwicklung mit beteiligten Partnern.
        - Mein Schwerpunkt lag darauf, fachliche Anforderungen und technische Entscheidungen frühzeitig zusammenzubringen. Ein Prototyp sollte nicht nur eine Idee illustrieren, sondern zeigen, wie die wesentlichen Funktionen unter den vorgesehenen Bedingungen zusammenspielen können.
      transfer:
        title: Was mich diese Erfahrung über Softwareprojekte gelehrt hat.
        paragraphs:
        - Eine gute technische Idee muss zu den Geräten, Nutzern und Einsatzbedingungen passen. Im mobilen Alltag gehören auch Energieverbrauch und Plattformunterschiede zu den Fragen, die früh geklärt werden müssen.
        - 'Bei mehr.wert prägt mich diese Perspektive bis heute: Bevor aus einer Idee ein großes Vorhaben wird, lohnt es sich, die entscheidenden Annahmen zu prüfen und technische Möglichkeiten an den tatsächlichen Anforderungen auszurichten.'
      closing:
        title: Sie müssen eine technische Idee erst belastbar einordnen?
        paragraphs:
        - Wir helfen, Anforderungen, Risiken und sinnvolle nächste Schritte zu klären – damit aus einer Idee eine tragfähige Entscheidung für Ihr IT-Vorhaben wird.
        links:
        - title: IT-Strategie & Modernisierung
          url: "/services/fractional-cto.html"
        - title: Alle Projekte & Erfahrungen ansehen
          url: "/projects.html"
        - title: Unverbindlich ins Gespräch kommen
          url: "/contact.html"
      approach:
        title: Eine mobile Lösung, die auch technische Grenzen mitdenkt.
        items:
        - title: Auftrags- und Informationsfluss klären
          text: Gemeinsam mit den Beteiligten wurde betrachtet, welche Informationen unterwegs erfasst werden und was die Disposition für die Koordination benötigt. Diese fachliche Struktur war die Grundlage des mobilen Prototyps.
        - title: Plattformübergreifend entwickeln
          text: Die mobile Umsetzung wurde mit Xamarin für iOS und Windows Phone angelegt. Damit konnten zentrale Funktionsbausteine für zwei damals relevante Plattformen gemeinsam konzipiert und technisch abgestimmt werden.
        - title: Standortinformationen mit Augenmaß nutzen
          text: Die Einbindung von GPS war Teil der technischen Konzeption. Dabei musste der Nutzen von Standortinformationen gegen den Energieverbrauch mobiler Geräte abgewogen werden – eine wichtige Randbedingung für unterwegs genutzte Anwendungen.
        intro: 'Für den Proof of Concept mussten drei Themen zusammenfinden: die Arbeit mit Lieferaufträgen, mobile Standortinformationen und eine gemeinsame technische Basis für mehrere Plattformen.'
      results:
        title: Ein Proof of Concept als Grundlage für die Weiterentwicklung.
        paragraphs:
        - Aus der Konzeption und plattformübergreifenden Arbeit entstand ein mobiler Proof of Concept für die Erfassung und Koordination von Lieferaufträgen. Er brachte die wesentlichen mobilen Funktionen und die zentrale Dispositionsperspektive in einem prüfbaren Lösungsansatz zusammen.
        - 'Der Prototyp wurde an den Auftraggeber zur internen Weiterentwicklung übergeben. Damit war das konkrete Ergebnis dieses Vorhabens erreicht: eine technische Grundlage, an der die nächsten Entscheidungen und Umsetzungsschritte ansetzen konnten.'
      process:
        title: Mobile Erfassung und zentrale Disposition verbinden.
        steps:
        - Lieferauftrag unterwegs
        - Mobile App mit Auftrags- und Standortdaten
        - Zentrale Sicht für die Disposition
        caption: Vereinfachter Informationsfluss des Proof of Concept; keine Darstellung eines produktiven Live-Trackingsystems.
        intro: Der Prototyp stellte die Verbindung zwischen dem mobilen Arbeitsablauf und den Informationen her, die für die Koordination benötigt werden.
        mode: flow
        middle_note: GPS-Nutzung und Energieverbrauch gemeinsam berücksichtigen.
