        text: Nachhaltige Softwareentwicklung wird oft als zusätzlicher Prozess oder als separates Spezialthema verstanden. In der täglichen Produkt- und Teamarbeit entsteht dadurch leicht eine Lücke zwischen Anspruch und Anwendung.
