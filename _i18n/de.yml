            text: Mobile Implementierung, Testautomatisierung und technische Architektur; Unterstützung von Mehrsprachigkeit und rechts-nach-links laufenden Schriften; Automatisierung der Lokalisierung mit Python; Content-Caching und Arbeit an einer Workbench zur Pflege digitaler Handbuchinhalte. In der späteren Phase kamen die Koordination eines Teams in der Slowakei, Gestaltung von App- und Workbench-Lösungen und Qualitäts-/Release-Steuerung hinzu.
          - title: Ergebnis / aktueller Stand
            text: In den Projektunterlagen ist die internationale Verfügbarkeit sowie die Veröffentlichung der Version 2.0 für iOS und Android dokumentiert. Aussagen zu Rankings, Kundenzufriedenheit und Zahl der Sprachversionen bleiben bis zur gesonderten Prüfung aus dem Webtext heraus.
          - title: Was die Erfahrung heute relevant macht
