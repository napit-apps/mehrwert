##################### FAQ #########################
cto_faq:
  title: "GUT ZU WISSEN"
  subtitle: "Antworten auf die wichtigsten Fragen"
  item:
  - question: "Was genau macht ein IT Leiter auf Zeit?"
    answer: "Ich übernehme temporär die technische Führung – hands-on und strategisch. Dabei geht es um klare Architekturentscheidungen, saubere Teamstrukturen und wirksame Prozesse – bis Ihr Tech-Team selbstständig liefern kann."

  - question: "Wie läuft der Einstieg ab?"
    answer: "Mit demQuick Check (kostenlos) prüfen wir Ziel, Kontext und Handlungsbedarf. Danach folgt – falls sinnvoll – einTech Audit mit klaren Empfehlungen und Prioritäten."

  - question: "Sind Sie Teil meines Teams oder externer Berater?"
    answer: "Ich arbeite als Teil Ihrer Organisation, nicht auf der Metaebene. Ich übernehme Verantwortung, treffe Entscheidungen und coache gleichzeitig Ihr Team für nachhaltige Eigenständigkeit."

  - question: "Wie lange bleiben Sie an Board?"
    answer: "So lange wie sinnvoll – typischerweise zwischen 2 und 9 Monaten. Manche Projekte enden nach der Roadmap-Phase, andere laufen bis zur erfolgreichen Skalierung."

  - question: "Wir haben kein großes Budget. Gibt es auch kleine Pakete?"
    answer: "Ja – besonders für Startups und NGOs gibt es fokussierte Module wie das Tech Audit oder gezielte Architektur- und Teamreviews. Wirkung vor Umfang."

  - question: "Was unterscheidet Sie von einer klassischen IT-Beratung?"
    answer: "Ich bringe keine PowerPoint-Folien, sondern konkrete Umsetzungserfahrung. Ich arbeite an den realen Systemen, mit den echten Teams – und bin messbar wirksam, nicht bloß strategisch präsent."

  - question: "Wie messen Sie Ihren Erfolg als CTO?"
    answer: "Erfolg heißt für mich: Transparenz, Fortschritt und Eigenständigkeit. Ich arbeite mit konkreten KPIs – z. B. Release-Zyklen, Bugrate, technischer Schuldenstand oder Team-Zufriedenheit. Entscheidend ist: Ihr Team kann nach meiner Zeit selbständig liefern."


