################## Mission Area #######################
mission:
  enable: true
  title: "Unsere Mission"
  subtitle: "Mehr.Wert entsteht durch Klarheit, Verantwortung und wirksame Umsetzung."
  statement: "Wir glauben: Wert ist die Grundlage für alles – für funktionierende Teams, tragfähige Prozesse und greifbare Ergebnisse. Echten Mehrwert schafft, wer Verantwortung übernimmt und konsequent auf nachhaltige Wirkung hinarbeitet. Genau dafür stehen wir."
  why-title: "Warum?"
  why:
    - item: "Weil Wertschöpfung ohne Werte nicht langfristig funktioniert."
    - item: "Weil Klarheit in Technik, Team und Strategie die Voraussetzung für nachhaltige Ergebnisse ist."
    - item: "Weil Zukunftsfähigkeit eine bewusste Entscheidung für Verantwortung erfordert – technisch, ökologisch und menschlich."
  how-title: "Wie?"
  how:
    - item: "Durch klare Rollen, strukturierte Prozesse und technische Exzellenz."
    - item: "Durch agile Methoden, die auf Wirkung statt Dogma setzen."
    - item: "Durch Nachhaltigkeitsmetriken und Green Tech als strategische Hebel."
    - item: "Durch Coaching, das Teams stärkt – nicht nur Methoden lehrt."
  special-title: "Was macht uns einzigartig?"
  specials:
    - item: "Wir denken Wertschöpfung ganzheitlich – technisch, menschlich, nachhaltig."
    - item: "Wir vereinen CTO-Denken, agile Führung und Green Software Engineering."
    - item: "Wir liefern keinen Hype – sondern Klarheit, Wirkung und Verantwortung."

vision:
  title: "Unsere Vision"
  statement: "Wertorientierung wird zur neuen Norm in der digitalen Welt. Unternehmen entwickeln Software nicht nur schneller, sondern verantwortungsvoller – mit klarer Ausrichtung, resilienten Teams und technischer Substanz. Unsere Vision ist eine digitale Zukunft, in der Wertschöpfung nicht auf Geschwindigkeit, sondern auf Wirkung, Verantwortung und Nachhaltigkeit basiert."

