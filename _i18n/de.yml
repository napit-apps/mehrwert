    enbw:
      case_study:
        publication_status: draft
        hero:
          eyebrow: BERUFSERFAHRUNG · MARCEL RUSS
          title: Quartalsplanung und Onsite-Wochen in der EnBW Trading IT
          lead: Strategische Ziele, Team-Roadmaps und Abhängigkeiten zusammenbringen – damit Teams und Führung ihre Vorhaben gemeinsam planen und Entscheidungen rechtzeitig treffen können.
          context: EnBW Trading IT · Enterprise Agile Coaching und zeitweise Release Train Engineering · Teamübergreifende Planung und Zusammenarbeit
        situation:
          title: Wenn viele Teams liefern, braucht es eine gemeinsame Richtung.
          paragraphs:
          - In der Trading IT liefen unterschiedliche Vorhaben parallel. Teams arbeiteten an ihren eigenen Aufgaben und Roadmaps, waren dabei aber vielfach voneinander abhängig. Für die übergreifende Steuerung reichte es nicht aus, wenn jedes Team für sich gut plante. Strategische Prioritäten, Team-Roadmaps, Abhängigkeiten und offene Entscheidungen mussten gemeinsam betrachtet werden.
          - Die Herausforderung bestand deshalb nicht nur darin, einen Plan zu erstellen. Gefragt war eine Arbeitsform, mit der Teams, Verantwortliche und Management regelmäßig zusammenkommen, ihre Planungen aufeinander abstimmen und neue Erkenntnisse im weiteren Verlauf berücksichtigen können.
        role:
          title: 'Meine Aufgabe: aus einer Idee eine gelebte Planungsroutine machen.'
          paragraphs:
          - Ich habe im Umfeld der EnBW Trading IT über mehrere Phasen und in unterschiedlichen Rollen gearbeitet – zunächst in der übergreifenden agilen Organisationsentwicklung, zeitweise auch als Release Train Engineer. Ein wesentlicher Teil meiner Verantwortung lag darin, den teamübergreifenden Quartalsplanungsprozess mitzugestalten, weiterzuentwickeln und im Arbeitsalltag zu verankern.
          - 'Dazu gehörte mehr als die Moderation einzelner Termine: Ich habe Formate konzipiert und vorbereitet, Teams und Verantwortliche in der Planung zusammengebracht, Abstimmungen begleitet und daran gearbeitet, dass die vereinbarten Prozesse und Rückmeldeschleifen tatsächlich genutzt wurden. Die operative RTE-Rolle half dabei, die gemeinsam entwickelte Arbeitsweise über die Einführung hinaus zu betreiben.'
        transfer:
          title: Was ich aus dieser Erfahrung mitnehme.
          paragraphs:
          - Eine gute Strategie wird erst dann wirksam, wenn Menschen sie in gemeinsame Entscheidungen und konkrete Arbeit übersetzen können. Das erfordert nicht zwingend mehr Prozesse. Es braucht klare Ziele, passende Abstimmungen und die Bereitschaft, aus dem Arbeitsalltag zu lernen.
          - 'Diese Erfahrung prägt meine heutige Arbeit bei mehr.wert: Wir verbinden strategische Orientierung mit tragfähigen Arbeitsweisen und begleiten ihre Einführung so, dass Teams und Führung sie tatsächlich nutzen können.'
        closing:
          title: Ähnliche Herausforderungen in Ihrer IT-Organisation?
          paragraphs:
          - Wenn viele Teams an gemeinsamen Vorhaben arbeiten, lohnt sich ein Blick darauf, wie Ziele, Planung und Delivery heute zusammenfinden. Wir sprechen gerne darüber, was in Ihrer Situation hilfreich wäre.
          links:
          - title: Organisation & Software-Delivery
            url: "/services/agile-transformation-coaching.html"
          - title: Alle Projekte & Erfahrungen ansehen
            url: "/projects.html"
          - title: Unverbindlich ins Gespräch kommen
            url: "/contact.html"
        approach:
          title: Von einzelnen Roadmaps zu einem gemeinsamen Planungsrhythmus.
          intro: Mir war wichtig, dass Planung kein einmaliges Großereignis bleibt, sondern ein wiederkehrender Austausch zwischen strategischer Richtung und der tatsächlichen Arbeit der Teams wird.
          items:
          - title: Prioritäten und Abhängigkeiten sichtbar machen
            text: Strategische Ziele, anstehende Vorhaben und Team-Roadmaps wurden zusammengeführt. Abhängigkeiten und Risiken sollten frühzeitig erkennbar sein, damit die Beteiligten nicht erst bei der Umsetzung auf widersprüchliche Planungen stoßen.
          - title: Gemeinsam planen – bewusst auch vor Ort
            text: Quartalsplanung und teamübergreifende Onsite-Wochen gaben der Abstimmung einen festen Rahmen. Mit vorbereiteten Agenden, klaren Fragestellungen und passenden Austauschformaten konnten Teams und Führung Prioritäten klären, Schnittstellen besprechen und die nächsten Schritte gemeinsam ausrichten.
          - title: Entscheidungen und Erfahrungen zurückspiegeln
            text: Status-Dashboards, Abhängigkeitsübersichten und regelmäßige Rückmeldungen an das Management ergänzten die Planung. So konnten neue Erkenntnisse, Engpässe und offene Entscheidungen sichtbar werden und in die weitere Steuerung einfließen.
        results:
          title: Was daraus entstanden ist.
          intro: Der wichtigste Fortschritt war, dass aus einem übergreifenden Planungsansatz eine wiederkehrend genutzte Arbeitsform wurde. Die Beteiligten hatten gemeinsame Anlässe und Grundlagen, um Prioritäten, Roadmaps und Abhängigkeiten aufeinander abzustimmen.
          items:
          - title: Eine etablierte Quartalsplanung
            text: Quartalsplanung und Onsite-Wochen wurden als wiederholbare, teamübergreifende Formate aufgebaut und eingesetzt – nicht nur als Konzept beschrieben.
          - title: Mehr Transparenz für gemeinsame Entscheidungen
            text: Team-Roadmaps, Status-Dashboards und Abhängigkeiten wurden miteinander verknüpft. Rückmeldungen aus der Zusammenarbeit bestätigen eine verbesserte Planungsqualität und frühere Sichtbarkeit von Risiken und Abstimmungsbedarf.
          - title: Bessere Abstimmung zwischen IT Teams, Fachbereichen und Management
            text: Die gemeinsamen Planungs- und Feedbackformate schufen eine verlässlichere Grundlage für Abstimmungen zwischen IT-Teams, Fachbereichen und Management. Beteiligte beschrieben die Zusammenarbeit als strukturierter und praxisnäher.
        process:
          title: Ein Planungsprozess, der im Alltag weiterlebt.
          intro: 'Entscheidend war die Verbindung der Ebenen: von der strategischen Priorität bis zur konkreten Abstimmung zwischen Teams – und wieder zurück zu den Verantwortlichen, die Entscheidungen treffen müssen.'
          steps:
          - Strategische Ziele & Prioritäten
          - Team-Roadmaps & Abhängigkeiten
          - Quartalsplanung & Onsite-Wochen
          - Umsetzung, Transparenz & Feedback
          feedback: Erkenntnisse, Risiken und Entscheidungen fließen in die weitere Planung zurück.
          caption: Vereinfachte Darstellung des Planungs- und Rückkopplungsprozesses.
        testimonial:
          title: Über die Zusammenarbeit
          quote: "“Marcel’s critical and pragmatic approach means he validates whether it contributes to the objectives.”"
          attribution: Jacques Dunselman · Agile Transformation Lead, PMx · Zusammenarbeit im EnBW-Umfeld
          publication_status: draft
