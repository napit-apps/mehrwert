<!DOCTYPE html>
<html lang="{{ site.lang }}">
{% include head.html %}
<body class="mw-site{% if page.layout == 'post' or page.page_type == 'blog' %} mw-blog{% endif %}">
{% assign copy = site.translations[site.lang] %}
<a class="mw-skip" href="#main-content">{{ copy.common.header.skip }}</a>
{% include header.html %}
<main id="main-content" tabindex="-1">{{ content | content_asset_urls }}</main>
{% include footer.html %}
{% if page.page_type == 'blog' %}
<script src="{{ '/assets/plugins/lunr/lunr.min.js' | asset_url }}" defer></script>
<script src="{{ '/assets/js/blog-search.js' | asset_url }}" defer></script>
{% endif %}
{% if page.layout == 'training' %}
<script src="{{ '/assets/plugins/jQuery/jquery.min.js' | asset_url }}" defer></script>
<script src="{{ '/assets/plugins/slick-carousel/slick/slick.min.js' | asset_url }}" defer></script>
<script src="{{ '/assets/js/training.js' | asset_url }}" defer></script>
{% endif %}
</body></html>
