<!DOCTYPE html>
<html lang="{{ site.lang }}">
{% include head.html %}
<body class="mw-2027{% if page.layout == 'post' or page.layout == 'blog-review' %} mw-blog-review{% endif %}">
{% assign copy = site.translations[site.lang].relaunch %}
<a class="mw-skip" href="#main-content">{{ copy.ui.skip }}</a>
{% include relaunch/header.html %}
<main id="main-content" tabindex="-1">{{ content | content_asset_urls }}</main>
{% include relaunch/footer.html %}
{% unless page.relaunch %}
{% for js in site.data.plugins.js %}<script src="{{ js | asset_url }}"></script>{% endfor %}
<script src="{{ '/assets/js/script.js' | asset_url }}"></script>
{% endunless %}
</body></html>
