---
layout: default
---

<section class="section">
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<div class="blog-single mb-5">
					<div class="row justify-content-center">
						<div class="col-lg-8">
							<h1 class="mw-article-title">{{page.title}}</h1>
							<div class="post-meta text-uppercase mb-3">
								<span class="text-color"> {{page.author}}, </span>
								<span class="text-color">{{ page.datum }}</span>
							</div>

						</div>
					</div>


					<div class="row justify-content-center">
						<div class="col-lg-8 mx-auto">
							<div class="post-content">
								{{page.content}}
								{% include social_share.html %}
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>



{% assign contact_spec = site.translations[site.lang].pages.blog.contact %}
{% include contact.html %}
